<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>장바구니 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <main>
    <div id="cart-list" style="display:grid; gap:12px; color:#e5e7eb;">로딩중...</div>
    <div id="cart-summary" style="margin-top:24px; display:none;"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const listEl = document.getElementById('cart-list');
    const summaryEl = document.getElementById('cart-summary');

    let globalShipping = 0;

    function getCart() { return JSON.parse(localStorage.getItem('cart') || '[]'); }
    function saveCart(cart) { localStorage.setItem('cart', JSON.stringify(cart)); }
    function getMember() {
      try { return JSON.parse(localStorage.getItem('member') || 'null'); }
      catch { return null; }
    }

    async function loadShipping() {
      const { data } = await db.from('settings').select('value').eq('key', 'shipping_fee').maybeSingle();
      globalShipping = data ? Number(data.value) || 0 : 0;
    }

    // ⭐ 주문 규칙:
    // - 장바구니에 1개 품목만 → 총 6개 이상
    // - 여러 품목 → 품목당 2개 이상, 총 6개 이상
    function validateOrder(cart) {
      const itemKinds = cart.length;
      const totalQty = cart.reduce((s, it) => s + it.quantity, 0);

      if (totalQty < 6) {
        return { ok: false, msg: '총 주문 수량은 최소 6개 이상이어야 합니다.' };
      }

      if (itemKinds === 1) {
        if (cart[0].quantity < 6) {
          return { ok: false, msg: '단일 품목 주문 시 최소 6개 이상 주문해야 합니다.' };
        }
      } else {
        // 여러 품목: 각 품목 최소 2개
        for (const it of cart) {
          if (it.quantity < 2) {
            return { ok: false, msg: `여러 품목 주문 시 품목당 최소 2개 이상이어야 합니다.\n"${it.product_name}" 수량을 늘려주세요.` };
          }
        }
      }
      return { ok: true };
    }

    function render() {
      const cart = getCart();
      if (cart.length === 0) {
        listEl.innerHTML = '<p style="text-align:center; padding:40px; color:#666;">장바구니가 비어있습니다.</p>';
        summaryEl.style.display = 'none';
        return;
      }

      listEl.innerHTML = cart.map((it, idx) => `
        <div style="background:#151515; border:1px solid #222; padding:14px; border-radius:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <div style="width:70px; height:70px; border-radius:8px; flex-shrink:0; background-color:#0f0f0f; background-size:cover; background-position:center; background-image:url('${(it.main_image || '').replace(/'/g,"\\'")}'); border:1px solid #222;"></div>
          <div style="flex:1; font-size:14px; line-height:1.6; min-width:150px;">
            <b style="color:#fff;">${it.product_name}</b>
            ${it.product_code ? `<span style="color:#666; font-size:12px;">[${it.product_code}]</span>` : ''}
            <br>
            ${it.selected_color ? `색상: ${it.selected_color} · ` : ''}${it.selected_size ? `사이즈: ${it.selected_size}` : ''}
            ${it.selected_hem ? `<br>밑단선택: ${it.selected_hem}` : ''}
            ${it.selected_other ? `<br>기타옵션: ${it.selected_other}` : ''}
            <br>
            ${Number(it.product_price).toLocaleString()}원 ×
            <input type="number" min="1" value="${it.quantity}" data-idx="${idx}"
              class="qty-input"
              style="width:60px; padding:4px 8px; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:6px; color:#e5e7eb; margin:0 4px;">
            = <b style="color:#ef4444;">${(it.product_price * it.quantity).toLocaleString()}원</b>
          </div>
          <button data-idx="${idx}" class="del-btn"
            style="padding:8px 14px; background:#dc2626; color:#fff; border:0; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit;">
            삭제
          </button>
        </div>
      `).join('');

      const subTotal = cart.reduce((s, it) => s + it.product_price * it.quantity, 0);
      const total = subTotal + globalShipping;

      const totalQty = cart.reduce((s, it) => s + it.quantity, 0);
      const ruleText = cart.length === 1
        ? `단일 품목 (최소 6개)`
        : `묶음 구매 (품목당 최소 2개, 총 최소 6개)`;

      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `
        <div style="background:#151515; border:1px solid #222; padding:20px; border-radius:12px; text-align:right; font-size:14px; line-height:1.8; color:#e5e7eb;">
          <div style="color:#888; font-size:12px; text-align:left; margin-bottom:12px; padding:8px 12px; background:#0f0f0f; border-radius:6px; border-left:3px solid #f59e0b;">
            📦 주문 규칙: ${ruleText} · 현재 총 <b style="color:#e5e7eb;">${totalQty}개</b>
          </div>
          <div>상품 합계: <b>${subTotal.toLocaleString()}원</b></div>
          <div>배송비: <b>${globalShipping > 0 ? globalShipping.toLocaleString() + '원' : '무료'}</b></div>
          <hr style="border:0; border-top:1px solid #222; margin:12px 0;">
          <p style="font-size:18px; margin-bottom:16px;">
            총 합계: <b style="color:#ef4444; font-size:22px;">${total.toLocaleString()}원</b>
          </p>
          <button id="checkout-btn"
            style="padding:14px 28px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-size:15px; font-family:inherit;">
            주문하기
          </button>
        </div>
      `;

      listEl.querySelectorAll('.qty-input').forEach(inp => {
        inp.addEventListener('change', () => {
          const cart = getCart();
          const idx = Number(inp.dataset.idx);
          cart[idx].quantity = Math.max(1, Number(inp.value) || 1);
          saveCart(cart);
          render();
          if (document.getElementById('app-header')) renderHeader('cart');
        });
      });

      listEl.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cart = getCart();
          cart.splice(Number(btn.dataset.idx), 1);
          saveCart(cart);
          render();
          if (document.getElementById('app-header')) renderHeader('cart');
        });
      });

      document.getElementById('checkout-btn').onclick = () => showCheckoutModal(cart);
    }

    function showCheckoutModal(cart) {
      // ⭐ 주문 규칙 검증
      const v = validateOrder(cart);
      if (!v.ok) {
        alert('⚠️ ' + v.msg);
        return;
      }

      const subTotal = cart.reduce((s, it) => s + it.product_price * it.quantity, 0);
      const total = subTotal + globalShipping;
      const m = getMember();

      const inputStyle = 'width:100%; padding:10px 12px; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:8px; color:#e5e7eb; font-family:inherit; font-size:14px;';
      const labelStyle = 'font-size:13px; font-weight:600; color:#ccc; display:block; margin-bottom:4px;';

      const modal = document.createElement('div');
      modal.style.cssText = `position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; z-index:1000; padding:10px;`;
      modal.innerHTML = `
        <div style="background:#151515; border:1px solid #222; padding:24px; border-radius:12px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; color:#e5e7eb;">
          <h2 style="margin:0 0 16px; font-size:18px; color:#fff;">주문 정보 입력</h2>
          <form id="checkout-form" style="display:grid; gap:10px; background:none; padding:0; border:0; border-radius:0; max-width:none;">
            <label style="${labelStyle}">주문자 이름 *</label>
            <input name="customer_name" required value="${m?.name || ''}" style="${inputStyle}">
            <label style="${labelStyle}">연락처 *</label>
            <input name="customer_phone" type="tel" inputmode="numeric" required value="${m?.phone || ''}" style="${inputStyle}">
            <label style="${labelStyle}">우편번호</label>
            <input name="postcode" value="${m?.postcode || ''}" style="${inputStyle}">
            <label style="${labelStyle}">주소 *</label>
            <input name="address" required value="${m?.address || ''}" style="${inputStyle}">
            <label style="${labelStyle}">상세주소</label>
            <input name="address_detail" value="${m?.address_detail || ''}" style="${inputStyle}">
            <label style="${labelStyle}">입금자명 *</label>
            <input name="depositor_name" required style="${inputStyle}">
            <label style="${labelStyle}">요청사항</label>
            <textarea name="memo" style="${inputStyle} min-height:60px;"></textarea>

            <div style="text-align:right; font-size:14px; font-weight:600; color:#ef4444; line-height:1.7; margin-top:8px;">
              상품: ${subTotal.toLocaleString()}원<br>
              배송비: ${globalShipping > 0 ? globalShipping.toLocaleString() + '원' : '무료'}<br>
              <span style="font-size:17px;">총액: ${total.toLocaleString()}원</span>
            </div>

            <button type="submit" style="padding:12px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-family:inherit;">주문 완료</button>
            <button type="button" id="close-modal" style="padding:10px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-family:inherit;">취소</button>
          </form>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('#close-modal').onclick = () => modal.remove();

      modal.querySelector('#checkout-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;
        const orderNumber = generateOrderNumber();

        const rows = cart.map((it, idx) => ({
          order_number: orderNumber,
          product_id: it.product_id,
          product_code: it.product_code || '',
          product_name: it.product_name,
          product_price: it.product_price,
          quantity: it.quantity,
          total_price: idx === 0 ? it.product_price * it.quantity + globalShipping : it.product_price * it.quantity,
          customer_name: f.customer_name.value.trim(),
          customer_phone: f.customer_phone.value.trim(),
          depositor_name: f.depositor_name.value.trim(),
          memo: f.memo.value.trim(),
          address: f.address.value.trim(),
          address_detail: f.address_detail.value.trim(),
          postcode: f.postcode.value.trim(),
          selected_color: it.selected_color,
          selected_size: it.selected_size,
          selected_hem: it.selected_hem,
          selected_other: it.selected_other,
          shipping_fee: idx === 0 ? globalShipping : 0,
          status: '입금대기',
        }));

        const { error } = await db.from('orders').insert(rows);
        if (error) { alert('❌ 주문 실패: ' + error.message); return; }

        localStorage.removeItem('cart');
        if (document.getElementById('app-header')) renderHeader('cart');
        showOrderComplete(modal, orderNumber, total);
      });
    }

    function generateOrderNumber() {
      const d = new Date();
      const ymd = d.getFullYear().toString().slice(-2) +
        String(d.getMonth()+1).padStart(2,'0') +
        String(d.getDate()).padStart(2,'0');
      const rand = Math.random().toString(36).slice(2,6).toUpperCase();
      return `ORD-${ymd}-${rand}`;
    }

    function showOrderComplete(modal, orderNumber, total) {
      modal.querySelector('div').innerHTML = `
        <h2 style="margin-bottom:16px; color:#10b981;">✅ 주문 접수 완료</h2>
        <div style="background:#0f0f0f; padding:16px; border-radius:8px; margin-bottom:16px; line-height:1.8; font-size:14px; border:1px solid #222;">
          <div style="font-size:13px; color:#888;">주문번호</div>
          <div style="font-size:18px; font-weight:700; color:#60a5fa; margin-bottom:8px; letter-spacing:1px; display:flex; align-items:center; flex-wrap:wrap; gap:6px;">
            <span id="order-number-text">${orderNumber}</span>
            <button id="copy-order-number" style="padding:3px 8px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-size:11px; font-family:inherit;">복사</button>
          </div>
          <hr style="border:0; border-top:1px solid #222; margin:8px 0;">
          <b>입금 계좌 안내</b><br>
          은행: <b>○○은행</b><br>
          계좌: <b>123-456-789012</b>
          <button id="copy-account" style="margin-left:6px; padding:3px 8px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-size:11px; font-family:inherit;">복사</button>
          <br>예금주: <b>홍길동</b><br>
          입금액: <b>${total.toLocaleString()}원</b>
        </div>
        <p style="font-size:12px; color:#666; margin-bottom:16px;">주문번호를 꼭 저장해두세요.</p>
        <button onclick="location.href='index.html'" style="width:100%; padding:12px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-family:inherit;">메인으로</button>
      `;
      modal.querySelector('#copy-order-number').onclick = () => {
        navigator.clipboard.writeText(orderNumber).then(() => alert('주문번호가 복사되었습니다.'));
      };
      modal.querySelector('#copy-account').onclick = () => {
        navigator.clipboard.writeText('123-456-789012').then(() => alert('계좌번호가 복사되었습니다.'));
      };
      listEl.innerHTML = '';
      summaryEl.style.display = 'none';
    }

    (async () => {
      await loadShipping();
      render();
    })();
  </script>
</body>
</html>
