<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>장바구니 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div id="cart-list" style="display:grid; gap:12px;">로딩중...</div>
    <div id="cart-summary" style="margin-top:24px; display:none;"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const listEl = document.getElementById('cart-list');
    const summaryEl = document.getElementById('cart-summary');

    let globalShipping = 0;

    function getCart() { return JSON.parse(localStorage.getItem('cart') || '[]'); }
    function saveCart(cart) { localStorage.setItem('cart', JSON.stringify(cart)); }
    function getMember() {
      try { return JSON.parse(localStorage.getItem('member') || 'null'); }
      catch { return null; }
    }

    async function loadShipping() {
      const { data } = await db.from('settings').select('value').eq('key', 'shipping_fee').maybeSingle();
      globalShipping = data ? Number(data.value) || 0 : 0;
    }

    function render() {
      const cart = getCart();
      if (cart.length === 0) {
        listEl.innerHTML = '<p style="text-align:center; padding:40px; color:#888;">장바구니가 비어있습니다.</p>';
        summaryEl.style.display = 'none';
        return;
      }

      listEl.innerHTML = cart.map((it, idx) => `
        <div style="background:#fff; padding:14px; border-radius:8px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <img src="${it.main_image}" style="width:70px; height:70px; object-fit:cover; border-radius:6px;">
          <div style="flex:1; font-size:14px; line-height:1.6; min-width:150px;">
            <b>${it.product_name}</b>
            ${it.product_code ? `<span style="color:#888; font-size:12px;">[${it.product_code}]</span>` : ''}
            <br>
            ${it.selected_color ? `색상: ${it.selected_color} · ` : ''}${it.selected_size ? `사이즈: ${it.selected_size}` : ''}
            ${it.selected_hem ? `<br>밑단선택: ${it.selected_hem}` : ''}
            ${it.selected_other ? `<br>기타옵션: ${it.selected_other}` : ''}
            <br>
            ${Number(it.product_price).toLocaleString()}원 ×
            <input type="number" min="1" value="${it.quantity}" data-idx="${idx}"
              class="qty-input"
              style="width:55px; padding:4px; border:1px solid #ddd; border-radius:4px; margin:0 4px;">
            = <b style="color:#e53935;">${(it.product_price * it.quantity).toLocaleString()}원</b>
          </div>
          <button data-idx="${idx}" class="del-btn"
            style="padding:8px 12px; background:#e53935; color:#fff; border:0; border-radius:6px; cursor:pointer; font-size:13px;">
            삭제
          </button>
        </div>
      `).join('');

      const subTotal = cart.reduce((s, it) => s + it.product_price * it.quantity, 0);
      const total = subTotal + globalShipping;

      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `
        <div style="background:#fff; padding:20px; border-radius:8px; text-align:right; font-size:14px; line-height:1.8;">
          <div>상품 합계: <b>${subTotal.toLocaleString()}원</b></div>
          <div>배송비: <b>${globalShipping > 0 ? globalShipping.toLocaleString() + '원' : '무료'}</b></div>
          <hr style="border:0; border-top:1px solid #eee; margin:12px 0;">
          <p style="font-size:18px; margin-bottom:16px;">
            총 합계: <b style="color:#e53935; font-size:22px;">${total.toLocaleString()}원</b>
          </p>
          <button id="checkout-btn"
            style="padding:14px 28px; background:#03c75a; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600; font-size:15px;">
            주문하기
          </button>
        </div>
      `;

      listEl.querySelectorAll('.qty-input').forEach(inp => {
        inp.addEventListener('change', () => {
          const cart = getCart();
          const idx = Number(inp.dataset.idx);
          cart[idx].quantity = Math.max(1, Number(inp.value) || 1);
          saveCart(cart);
          render();
          if (document.getElementById('app-header')) renderHeader('cart');
        });
      });

      listEl.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cart = getCart();
          cart.splice(Number(btn.dataset.idx), 1);
          saveCart(cart);
          render();
          if (document.getElementById('app-header')) renderHeader('cart');
        });
      });

      document.getElementById('checkout-btn').onclick = () => showCheckoutModal(cart);
    }

    function showCheckoutModal(cart) {
      const subTotal = cart.reduce((s, it) => s + it.product_price * it.quantity, 0);
      const total = subTotal + globalShipping;
      const m = getMember();

      const modal = document.createElement('div');
      modal.style.cssText = `position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:10px;`;
      modal.innerHTML = `
        <div style="background:#fff; padding:20px; border-radius:10px; width:100%; max-width:440px; max-height:90vh; overflow-y:auto;">
          <h2 style="margin-bottom:16px; font-size:18px;">주문 정보 입력</h2>
          <form id="checkout-form" style="display:grid; gap:10px;">
            <label style="font-size:13px; font-weight:600;">주문자 이름 *</label>
            <input name="customer_name" required value="${m?.name || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">연락처 *</label>
            <input name="customer_phone" type="tel" inputmode="numeric" required value="${m?.phone || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">우편번호</label>
            <input name="postcode" value="${m?.postcode || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">주소 *</label>
            <input name="address" required value="${m?.address || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">상세주소</label>
            <input name="address_detail" value="${m?.address_detail || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">입금자명 *</label>
            <input name="depositor_name" required
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">요청사항</label>
            <textarea name="memo"
              style="padding:10px; border:1px solid #ddd; border-radius:6px; min-height:60px;"></textarea>

            <div style="text-align:right; font-size:14px; font-weight:600; color:#e53935; line-height:1.7; margin-top:8px;">
              상품: ${subTotal.toLocaleString()}원<br>
              배송비: ${globalShipping > 0 ? globalShipping.toLocaleString() + '원' : '무료'}<br>
              <span style="font-size:17px;">총액: ${total.toLocaleString()}원</span>
            </div>

            <button type="submit"
              style="padding:12px; background:#03c75a; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">
              주문 완료
            </button>
            <button type="button" id="close-modal"
              style="padding:10px; background:#eee; border:0; border-radius:6px; cursor:pointer;">
              취소
            </button>
          </form>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('#close-modal').onclick = () => modal.remove();

      modal.querySelector('#checkout-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;

        const orderNumber = generateOrderNumber();

        const rows = cart.map((it, idx) => ({
          order_number: orderNumber,
          product_id: it.product_id,
          product_code: it.product_code || '',
          product_name: it.product_name,
          product_price: it.product_price,
          quantity: it.quantity,
          total_price: idx === 0 ? it.product_price * it.quantity + globalShipping : it.product_price * it.quantity,
          customer_name: f.customer_name.value.trim(),
          customer_phone: f.customer_phone.value.trim(),
          depositor_name: f.depositor_name.value.trim(),
          memo: f.memo.value.trim(),
          address: f.address.value.trim(),
          address_detail: f.address_detail.value.trim(),
          postcode: f.postcode.value.trim(),
          selected_color: it.selected_color,
          selected_size: it.selected_size,
          selected_hem: it.selected_hem,
          selected_other: it.selected_other,
          shipping_fee: idx === 0 ? globalShipping : 0,
          status: '입금대기',
        }));

        const { error } = await db.from('orders').insert(rows);
        if (error) { alert('❌ 주문 실패: ' + error.message); return; }

        localStorage.removeItem('cart');
        if (document.getElementById('app-header')) renderHeader('cart');
        showOrderComplete(modal, orderNumber, total);
      });
    }

    function generateOrderNumber() {
      const d = new Date();
      const ymd = d.getFullYear().toString().slice(-2) +
        String(d.getMonth()+1).padStart(2,'0') +
        String(d.getDate()).padStart(2,'0');
      const rand = Math.random().toString(36).slice(2,6).toUpperCase();
      return `ORD-${ymd}-${rand}`;
    }

    function showOrderComplete(modal, orderNumber, total) {
      modal.querySelector('div').innerHTML = `
        <h2 style="margin-bottom:16px; color:#03c75a;">✅ 주문 접수 완료</h2>
        <div style="background:#f8f8f8; padding:16px; border-radius:8px; margin-bottom:16px; line-height:1.8; font-size:14px;">
          <div style="font-size:13px; color:#888;">주문번호</div>
          <div style="font-size:18px; font-weight:700; color:#1976d2; margin-bottom:8px; letter-spacing:1px; display:flex; align-items:center; flex-wrap:wrap; gap:6px;">
            <span id="order-number-text">${orderNumber}</span>
            <button id="copy-order-number"
              style="padding:3px 8px; background:#222; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:11px;">
              복사
            </button>
          </div>
          <hr style="border:0; border-top:1px solid #ddd; margin:8px 0;">
          <b>입금 계좌 안내</b><br>
          은행: <b>○○은행</b><br>
          계좌: <b>123-456-789012</b>
          <button id="copy-account"
            style="margin-left:6px; padding:3px 8px; background:#222; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:11px;">
            복사
          </button>
          <br>
          예금주: <b>홍길동</b><br>
          입금액: <b>${total.toLocaleString()}원</b>
        </div>
        <p style="font-size:12px; color:#888; margin-bottom:16px;">
          주문번호를 꼭 저장해두세요.
        </p>
        <button onclick="location.href='index.html'"
          style="width:100%; padding:12px; background:#222; color:#fff; border:0; border-radius:6px; cursor:pointer;">
          메인으로
        </button>
      `;
      modal.querySelector('#copy-order-number').onclick = () => {
        navigator.clipboard.writeText(orderNumber).then(() => alert('주문번호가 복사되었습니다.'));
      };
      modal.querySelector('#copy-account').onclick = () => {
        navigator.clipboard.writeText('123-456-789012').then(() => alert('계좌번호가 복사되었습니다.'));
      };
      listEl.innerHTML = '';
      summaryEl.style.display = 'none';
    }

    (async () => {
      await loadShipping();
      render();
    })();
  </script>
</body>
</html>
