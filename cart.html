<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>장바구니 - Simple life' StockingStory</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    @import url('https://fonts.cdnfonts.com/css/bahnschrift');
    body { font-family: 'Bahnschrift Light', 'Bahnschrift', -apple-system, sans-serif; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }
    .cart-check { width: 22px; height: 22px; cursor: pointer; accent-color: #10b981; }
    .rule-card { background: #151515; border: 1px solid #222; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; color: #e5e7eb; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .rule-card .rule-text { color: #aaa; }
    .rule-card .rule-status { font-weight: 700; }
    .grade-info-card { background: linear-gradient(135deg, #1a1a1a 0%, #222 100%); border: 1px solid #333; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #e5e7eb; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .grade-info-card.wholesale { background: linear-gradient(135deg, #78350f 0%, #92400e 100%); border-color: #f59e0b; }
    .grade-info-card.vip { background: linear-gradient(135deg, #581c87 0%, #6b21a8 100%); border-color: #a855f7; }
    .grade-info-card .gi-label { font-weight: 700; }
    .grade-info-card .gi-detail { font-size: 12px; opacity: 0.95; }
    .checkout-modal-backdrop { position: fixed !important; inset: 0; background: rgba(0,0,0,.8); z-index: 999999 !important; display: flex !important; align-items: flex-start !important; justify-content: center !important; padding: 10px !important; overflow-y: auto !important; }
    .checkout-modal-box { background: #151515; border: 1px solid #222; padding: 20px 16px; border-radius: 12px; width: 100% !important; max-width: 460px !important; margin: 20px auto !important; color: #e5e7eb; box-sizing: border-box; }
    .checkout-modal-box .checkout-form { display: grid !important; gap: 10px !important; }
    .checkout-modal-box h2 { margin: 0 0 16px !important; font-size: 18px !important; color: #fff !important; font-family: 'Bahnschrift Light', sans-serif; }
    .coupon-picker { background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; margin-top: 8px; }
    .coupon-picker .cp-title { font-size: 13px; font-weight: 700; color: #fbbf24; margin-bottom: 8px; }
    .coupon-picker select { width: 100%; padding: 10px 12px; background: #151515; border: 1px solid #333; border-radius: 6px; color: #e5e7eb; font-family: inherit; font-size: 13px; }
    .coupon-disabled-notice { background: #1a1a1a; border: 1px dashed #f59e0b; border-radius: 8px; padding: 12px; margin-top: 8px; font-size: 13px; color: #fbbf24; }
    .block-notice { margin-bottom: 12px; padding: 12px 14px; background: #1a1a1a; border: 1px dashed #f59e0b; border-radius: 8px; font-size: 13px; color: #fbbf24; line-height: 1.7; }
    .block-notice a { color: #60a5fa; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <main>
    <div id="cart-list" style="display:grid; gap:12px; color:#e5e7eb;">로딩중...</div>
    <div id="cart-summary" style="margin-top:24px; display:none;"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const listEl = document.getElementById('cart-list');
    const summaryEl = document.getElementById('cart-summary');
    let globalShipping = 0;
    let selectedIndexes = new Set();
    let cachedAccount = { bank: '', number: '', holder: '' };
    const won = n => '₩ ' + Number(n || 0).toLocaleString();

    const TARGET_DISCOUNT = { 'all': 0, 'wholesale': 50, 'vip': 30 };
    const TARGET_SHIPPING = {
      'all':       { method: '택배', feeType: 'setting' },
      'wholesale': { method: '해운', feeType: 'collect' },
      'vip':       { method: '택배', feeType: 'free' },
    };

    // ⭐ [요청10] 등급별 구매 가능 여부
    // 일반회원: 일반상품(all)만
    // 도매회원: 도매상품(wholesale)만 (일반상품 열람만, 구매 불가)
    // VIP회원: 일반상품(all) + VIP상품(vip)
    function canPurchase(memberGrade, targetGrade) {
      const g = memberGrade || '일반회원';
      const tg = targetGrade || 'all';
      if (tg === 'all') return g === '일반회원' || g === 'VIP회원';
      if (tg === 'wholesale') return g === '도매회원';
      if (tg === 'vip') return g === 'VIP회원';
      return false;
    }

    // ⭐ [이슈4] 사용자별 장바구니 키
    function getCartKey() {
      const m = getMember();
      return m?.id ? `cart_${m.id}` : 'cart_guest';
    }
    function getCart() { try { return JSON.parse(localStorage.getItem(getCartKey()) || '[]'); } catch { return []; } }
    function saveCart(cart) { localStorage.setItem(getCartKey(), JSON.stringify(cart)); }
    function getMember() { try { return JSON.parse(localStorage.getItem('member') || 'null'); } catch { return null; } }
    function isLoggedInMember() { const m = getMember(); return !!(m && m.id); }

    async function loadShipping() {
      const { data } = await db.from('settings').select('value').eq('key', 'shipping_fee').maybeSingle();
      globalShipping = data ? Number(data.value) || 0 : 0;
    }
    async function loadAccountInfo() {
      try {
        const { data } = await db.from('settings').select('key, value').in('key', ['account_bank', 'account_number', 'account_holder']);
        const map = {}; (data || []).forEach(row => { map[row.key] = row.value || ''; });
        cachedAccount = { bank: map.account_bank || '', number: map.account_number || '', holder: map.account_holder || '' };
      } catch {}
    }

    function getItemPricing(item) {
      const targetGrade = item.target_grade || 'all';
      const basePrice = Number(item.original_price ?? item.base_price ?? item.product_price ?? 0);
      const discountRate = TARGET_DISCOUNT[targetGrade] ?? 0;
      const finalPrice = Math.round(basePrice * (100 - discountRate) / 100);
      const shipPolicy = TARGET_SHIPPING[targetGrade] || TARGET_SHIPPING.all;
      let shippingFeePerGroup = 0, shippingLabel = '', shippingMethod = shipPolicy.method;
      if (shipPolicy.feeType === 'setting') { shippingFeePerGroup = globalShipping; shippingLabel = globalShipping > 0 ? won(globalShipping) : '무료'; }
      else if (shipPolicy.feeType === 'collect') { shippingFeePerGroup = 0; shippingLabel = '착불'; }
      else { shippingFeePerGroup = 0; shippingLabel = '무료'; }
      return { targetGrade, basePrice, discountRate, finalPrice, shippingFeePerGroup, shippingLabel, shippingMethod };
    }

    function recalcCartPrices(cart) {
      cart.forEach(it => {
        if (it.original_price == null) it.original_price = Number(it.product_price ?? 0);
        const pricing = getItemPricing(it);
        it.product_price = pricing.finalPrice;
        it.discount_rate = pricing.discountRate;
        it.target_grade = pricing.targetGrade;
      });
      saveCart(cart);
      return cart;
    }

    function isAllWholesale(selectedCart) {
      if (selectedCart.length === 0) return false;
      return selectedCart.every(it => (it.target_grade || 'all') === 'wholesale');
    }

    function render() {
      const cart = recalcCartPrices(getCart());
      const member = getMember();
      const memberGrade = member?.grade || '일반회원';

      if (cart.length === 0) {
        listEl.innerHTML = '<p style="text-align:center; padding:40px; color:#666;">장바구니가 비어있습니다.</p>';
        summaryEl.style.display = 'none';
        return;
      }
      selectedIndexes.forEach(idx => { if (idx >= cart.length) selectedIndexes.delete(idx); });

      listEl.innerHTML = cart.map((it, idx) => {
        const checked = selectedIndexes.has(idx);
        const pricing = getItemPricing(it);
        const showDiscount = pricing.discountRate > 0;
        const targetBadge = pricing.targetGrade === 'wholesale'
          ? `<span style="background:#f59e0b; color:#fff; font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; margin-left:4px;">도매전용</span>`
          : pricing.targetGrade === 'vip'
          ? `<span style="background:#a855f7; color:#fff; font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; margin-left:4px;">VIP전용</span>`
          : '';
        return `
          <div style="background:#151515; border:1px solid ${checked ? '#10b981' : '#222'}; padding:14px; border-radius:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
            <input type="checkbox" class="cart-check" data-idx="${idx}" ${checked ? 'checked' : ''}>
            <div style="width:70px; height:70px; border-radius:8px; flex-shrink:0; background-color:#0f0f0f; background-size:cover; background-position:center; background-image:url('${(it.main_image || '').replace(/'/g,"\\'")}'); border:1px solid #222;"></div>
            <div style="flex:1; font-size:14px; line-height:1.6; min-width:150px;">
              <b style="color:#fff; font-family:'Bahnschrift Light',sans-serif;">${it.product_name}</b>${targetBadge}
              ${it.product_code ? `<span style="color:#666; font-size:12px;">[${it.product_code}]</span>` : ''}
              <br>
              ${it.selected_color ? `색상: ${it.selected_color} · ` : ''}${it.selected_size ? `사이즈: ${it.selected_size}` : ''}
              ${it.selected_hem ? `<br>밑단: ${it.selected_hem}` : ''}
              ${it.selected_other ? `<br>기타: ${it.selected_other}` : ''}
              <br>
              ${showDiscount ? `<span style="color:#9ca3af; text-decoration:line-through; font-size:12px;">${won(pricing.basePrice)}</span> ` : ''}
              <span style="font-family:'Bahnschrift Light',sans-serif;">${won(it.product_price)}</span> ×
              <span style="display:inline-flex; align-items:center; gap:2px; margin:0 4px;">
                <button class="qty-minus" data-idx="${idx}" style="width:26px; height:26px; background:#1a1a1a; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-weight:700;">−</button>
                <input type="number" min="1" value="${it.quantity}" data-idx="${idx}" class="qty-input" style="width:48px; padding:2px 6px; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:4px; color:#e5e7eb; text-align:center;">
                <button class="qty-plus" data-idx="${idx}" style="width:26px; height:26px; background:#1a1a1a; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-weight:700;">+</button>
              </span>
              = <b style="color:#ef4444; font-family:'Bahnschrift Light',sans-serif;">${won(it.product_price * it.quantity)}</b>
              ${showDiscount ? `<span style="background:#ef4444; color:#fff; font-size:10px; font-weight:700; padding:2px 5px; border-radius:3px; margin-left:4px;">-${pricing.discountRate}%</span>` : ''}
              <div style="font-size:11px; color:#9ca3af; margin-top:2px;">배송: ${pricing.shippingMethod} / ${pricing.shippingLabel}</div>
            </div>
            <button data-idx="${idx}" class="del-btn" style="padding:8px 14px; background:#dc2626; color:#fff; border:0; border-radius:8px; cursor:pointer; font-size:13px;">삭제</button>
          </div>`;
      }).join('');

      const selectedCart = cart.filter((_, idx) => selectedIndexes.has(idx));
      const subTotal = selectedCart.reduce((s, it) => s + it.product_price * it.quantity, 0);
      const selectedQty = selectedCart.reduce((s, it) => s + it.quantity, 0);
      const totalQty = cart.reduce((s, it) => s + it.quantity, 0);

      const shippingGroups = new Set();
      let shippingFee = 0;
      const shippingDetail = [];
      selectedCart.forEach(it => {
        const pricing = getItemPricing(it);
        if (shippingGroups.has(pricing.targetGrade)) return;
        shippingGroups.add(pricing.targetGrade);
        if (pricing.shippingFeePerGroup > 0) shippingFee += pricing.shippingFeePerGroup;
        shippingDetail.push({ method: pricing.shippingMethod, label: pricing.shippingLabel, fee: pricing.shippingFeePerGroup, targetGrade: pricing.targetGrade });
      });

      const total = subTotal + shippingFee;

      const qtyByGroup = {};
      selectedCart.forEach(it => {
        const tg = it.target_grade || 'all';
        if (!qtyByGroup[tg]) qtyByGroup[tg] = { qty: 0, minQty: 0 };
        qtyByGroup[tg].qty += it.quantity;
        const mq = Number(it.min_qty || 1);
        if (mq > qtyByGroup[tg].minQty) qtyByGroup[tg].minQty = mq;
      });
      const shortGroups = [];
      Object.entries(qtyByGroup).forEach(([tg, g]) => {
        if (g.minQty > 1 && g.qty < g.minQty) shortGroups.push({ targetGrade: tg, need: g.minQty, have: g.qty });
      });

      // ⭐ [요청10] 등급별 구매 가능 여부
      const illegalItems = selectedCart.filter(it => !canPurchase(memberGrade, it.target_grade || 'all'));
      const purchaseBlocked = illegalItems.length > 0;

      const canOrder = selectedCart.length > 0 && shortGroups.length === 0 && !purchaseBlocked;
      const allChecked = selectedIndexes.size === cart.length && cart.length > 0;

      let gradeInfoHtml = '';
      if (memberGrade === '도매회원') {
        gradeInfoHtml = `<div class="grade-info-card wholesale"><span class="gi-label">🏭 도매회원</span><span class="gi-detail">도매전용 상품만 구매 가능 · 일반상품은 열람만 · 배송: 해운/착불</span></div>`;
      } else if (memberGrade === 'VIP회원') {
        gradeInfoHtml = `<div class="grade-info-card vip"><span class="gi-label">⭐ VIP회원</span><span class="gi-detail">일반 + VIP전용 상품 구매 가능 · VIP상품 30% 할인 · 배송: 택배/무료</span></div>`;
      }

      const shippingLinesHtml = shippingDetail.map(sd => {
        let label = sd.label;
        if (sd.targetGrade === 'wholesale') label = '착불 (해운)';
        else if (sd.targetGrade === 'vip') label = '무료 (택배)';
        else label = sd.fee > 0 ? `${won(sd.fee)} (택배)` : '무료 (택배)';
        return `<div style="font-size:12px; color:#9ca3af;">· ${label}</div>`;
      }).join('');

      let shortMsgHtml = '';
      if (shortGroups.length > 0) {
        shortMsgHtml = shortGroups.map(g => {
          const label = g.targetGrade === 'wholesale' ? '도매상품' : g.targetGrade === 'vip' ? 'VIP상품' : '일반상품';
          return `<div style="color:#f59e0b; font-size:12px;">· ${label}: 최소 ${g.need}개 필요 (현재 ${g.have}개)</div>`;
        }).join('');
      }

      let blockNoticeHtml = '';
      if (purchaseBlocked) {
        const illegalNames = illegalItems.map(it => it.product_name).join(', ');
        blockNoticeHtml = `<div class="block-notice">⚠️ 현재 회원 등급에서 구매할 수 없는 상품이 포함되어 있습니다.<br><span style="color:#fbbf24; font-size:12px;">(${illegalNames})</span></div>`;
      }

      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `
        ${gradeInfoHtml}
        ${blockNoticeHtml}
        <div style="background:#151515; border:1px solid #222; padding:20px; border-radius:12px; font-size:14px; line-height:1.8; color:#e5e7eb;">
          <div style="display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; border-bottom:1px solid #222; margin-bottom:16px;">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; font-weight:600;">
              <input type="checkbox" id="check-all" class="cart-check" ${allChecked ? 'checked' : ''}>
              전체 선택 (${selectedIndexes.size}/${cart.length})
            </label>
            <span style="font-size:12px; color:#888;">전체 총 수량: ${totalQty}개</span>
          </div>
          <div class="rule-card">
            <span class="rule-text">📦 상품별 최소 주문수량 확인</span>
            <span class="rule-status" style="color:${canOrder ? '#10b981' : '#f59e0b'};">${canOrder ? '✅ 주문 가능' : (selectedCart.length === 0 ? '상품을 선택하세요' : '⚠️ 주문 불가')}</span>
            ${shortMsgHtml}
          </div>
          <div style="text-align:right;">
            <div>선택 상품 합계: <b style="font-family:'Bahnschrift Light',sans-serif;">${won(subTotal)}</b></div>
            <div style="margin-top:2px;">배송비: <b style="font-family:'Bahnschrift Light',sans-serif;">${shippingFee > 0 ? won(shippingFee) : '무료'}</b></div>
            ${shippingLinesHtml}
            <hr style="border:0; border-top:1px solid #222; margin:12px 0;">
            <p style="font-size:18px; margin-bottom:16px;">총 합계: <b style="color:#ef4444; font-size:22px; font-family:'Bahnschrift Light',sans-serif;">${won(total)}</b></p>
            <button id="checkout-btn" style="padding:14px 28px; background:${canOrder ? '#e5e7eb' : '#333'}; color:${canOrder ? '#111' : '#777'}; border:0; border-radius:8px; cursor:${canOrder ? 'pointer' : 'not-allowed'}; font-weight:600; font-size:15px; font-family:inherit;">
              ${canOrder ? `선택한 상품 주문 (${selectedQty}개)` : (selectedCart.length === 0 ? '상품을 선택하세요' : '주문 조건 확인')}
            </button>
          </div>
        </div>`;

      listEl.querySelectorAll('.cart-check').forEach(cb => {
        cb.onchange = () => {
          const idx = Number(cb.dataset.idx);
          if (cb.checked) selectedIndexes.add(idx); else selectedIndexes.delete(idx);
          render();
        };
      });
      document.getElementById('check-all').onchange = e => {
        if (e.target.checked) cart.forEach((_, idx) => selectedIndexes.add(idx));
        else selectedIndexes.clear();
        render();
      };
      listEl.querySelectorAll('.qty-minus').forEach(btn => {
        btn.onclick = () => {
          const cart = getCart(); const idx = Number(btn.dataset.idx);
          if (cart[idx].quantity > 1) { cart[idx].quantity--; saveCart(cart); if (isLoggedInMember()) pushCartToServer(cart); render(); if (document.getElementById('app-header')) renderHeader('cart'); }
        };
      });
      listEl.querySelectorAll('.qty-plus').forEach(btn => {
        btn.onclick = () => {
          const cart = getCart(); const idx = Number(btn.dataset.idx);
          cart[idx].quantity++; saveCart(cart); if (isLoggedInMember()) pushCartToServer(cart); render(); if (document.getElementById('app-header')) renderHeader('cart');
        };
      });
      listEl.querySelectorAll('.qty-input').forEach(inp => {
        inp.onchange = () => {
          const cart = getCart(); const idx = Number(inp.dataset.idx);
          cart[idx].quantity = Math.max(1, Number(inp.value) || 1);
          saveCart(cart); if (isLoggedInMember()) pushCartToServer(cart); render(); if (document.getElementById('app-header')) renderHeader('cart');
        };
      });
      listEl.querySelectorAll('.del-btn').forEach(btn => {
        btn.onclick = () => {
          const cart = getCart(); const idx = Number(btn.dataset.idx);
          cart.splice(idx, 1); saveCart(cart);
          if (isLoggedInMember()) pushCartToServer(cart);
          const newSel = new Set();
          selectedIndexes.forEach(i => { if (i < idx) newSel.add(i); else if (i > idx) newSel.add(i - 1); });
          selectedIndexes = newSel;
          render();
          if (document.getElementById('app-header')) renderHeader('cart');
        };
      });
      document.getElementById('checkout-btn').onclick = () => {
        if (selectedCart.length === 0) { alert('주문할 상품을 선택해주세요.'); return; }
        if (purchaseBlocked) { alert('현재 회원 등급에서 구매할 수 없는 상품이 포함되어 있습니다.\n상품 구성을 다시 확인해주세요.'); return; }
        if (!canOrder) {
          const detail = shortGroups.map(g => {
            const label = g.targetGrade === 'wholesale' ? '도매상품' : g.targetGrade === 'vip' ? 'VIP상품' : '일반상품';
            return `${label}: 최소 ${g.need}개 (현재 ${g.have}개)`;
          }).join('\n');
          alert(`상품 그룹별 최소 주문수량을 확인해주세요.\n\n${detail}`);
          return;
        }
        showCheckoutModal(selectedCart);
      };
    }

    async function loadUsableCoupons() {
      const m = getMember(); if (!m || !m.id) return [];
      try {
        const { data } = await db.from('coupons').select('*').eq('member_id', m.id).eq('is_used', false).gte('expires_at', new Date().toISOString()).order('created_at', { ascending: false });
        return data || [];
      } catch { return []; }
    }

    async function showCheckoutModal(cart) {
      const subTotal = cart.reduce((s, it) => s + it.product_price * it.quantity, 0);
      const shippingGroups = new Set();
      let totalShippingFee = 0;
      cart.forEach(it => {
        const pricing = getItemPricing(it);
        if (shippingGroups.has(pricing.targetGrade)) return;
        shippingGroups.add(pricing.targetGrade);
        totalShippingFee += pricing.shippingFeePerGroup;
      });
      const m = getMember();
      const memberGrade = m?.grade || '일반회원';
      const allWholesale = isAllWholesale(cart);
      const showCoupon = !allWholesale && memberGrade !== '도매회원';
      const coupons = showCoupon ? await loadUsableCoupons() : [];
      const inputStyle = 'width:100%; padding:10px 12px; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:8px; color:#e5e7eb; font-family:inherit; font-size:14px; box-sizing:border-box;';
      const labelStyle = 'font-size:13px; font-weight:600; color:#ccc; display:block; margin-bottom:4px;';
      const shipGroupsSet = new Set();
      const shippingLabelLines = [];
      cart.forEach(it => {
        const pricing = getItemPricing(it);
        if (shipGroupsSet.has(pricing.targetGrade)) return;
        shipGroupsSet.add(pricing.targetGrade);
        let label;
        if (pricing.targetGrade === 'wholesale') label = '착불 (해운)';
        else if (pricing.targetGrade === 'vip') label = '무료 (택배)';
        else label = pricing.shippingFeePerGroup > 0 ? won(pricing.shippingFeePerGroup) + ' (택배)' : '무료 (택배)';
        shippingLabelLines.push(label);
      });
      const shippingDisplay = shippingLabelLines.join(' / ');

      const modal = document.createElement('div');
      modal.className = 'checkout-modal-backdrop';
      let couponSectionHtml = '';
      if (allWholesale) couponSectionHtml = `<div class="coupon-disabled-notice">도매전용 상품은 쿠폰 사용 불가</div>`;
      else if (coupons.length > 0) {
        couponSectionHtml = `<div class="coupon-picker"><div class="cp-title">🎟️ 쿠폰 사용</div><select id="coupon-select"><option value="">쿠폰 선택 안 함</option>
          ${coupons.map(c => { const label = c.type === 'percent' ? `${c.discount_value}% 할인` : `${Number(c.discount_value).toLocaleString()}원 할인`; return `<option value="${c.id}" data-type="${c.type}" data-value="${c.discount_value}">${label} (${c.code})</option>`; }).join('')}
        </select></div>`;
      }
      modal.innerHTML = `<div class="checkout-modal-box"><h2>주문 정보 입력</h2>
        <form id="checkout-form" class="checkout-form">
          <label style="${labelStyle}">주문자 이름 *</label><input name="customer_name" required value="${m?.name || ''}" style="${inputStyle}">
          <label style="${labelStyle}">연락처 *</label><input name="customer_phone" type="tel" required value="${m?.phone || ''}" style="${inputStyle}">
          <label style="${labelStyle}">우편번호</label><input name="postcode" value="${m?.postcode || ''}" style="${inputStyle}">
          <label style="${labelStyle}">주소 *</label><input name="address" required value="${m?.address || ''}" style="${inputStyle}">
          <label style="${labelStyle}">상세주소</label><input name="address_detail" value="${m?.address_detail || ''}" style="${inputStyle}">
          <label style="${labelStyle}">입금자명 *</label><input name="depositor_name" required style="${inputStyle}">
          <label style="${labelStyle}">요청사항</label><textarea name="memo" style="${inputStyle} min-height:60px;"></textarea>
          ${couponSectionHtml}
          <div id="price-summary" style="text-align:right; font-size:14px; font-weight:600; color:#ef4444; line-height:1.7; margin-top:8px;">
            <div>상품: <b id="p-subtotal" style="font-family:'Bahnschrift Light',sans-serif;">${won(subTotal)}</b></div>
            <div id="p-discount-row" style="display:none;">쿠폰 할인: <b id="p-discount">₩ 0</b></div>
            <div>배송비: <b>${shippingDisplay}</b></div>
            <div style="font-size:17px;">총액: <b id="p-total" style="font-family:'Bahnschrift Light',sans-serif;">${won(subTotal + totalShippingFee)}</b></div>
          </div>
          <button type="submit" style="padding:12px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-family:inherit; font-size:15px;">주문 완료</button>
          <button type="button" id="close-modal" style="padding:10px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-family:inherit;">취소</button>
        </form></div>`;
      document.body.appendChild(modal);
      const prevBodyOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      const closeModal = () => { document.body.style.overflow = prevBodyOverflow; modal.remove(); };
      modal.querySelector('#close-modal').onclick = closeModal;
      const couponSelect = modal.querySelector('#coupon-select');
      function calcDiscount(sub, type, value) {
        if (type === 'percent') return Math.floor(sub * (Number(value) / 100));
        if (type === 'fixed') return Math.min(sub, Number(value));
        return 0;
      }
      function updatePriceUI() {
        let discount = 0;
        if (couponSelect && couponSelect.value) {
          const opt = couponSelect.selectedOptions[0];
          discount = calcDiscount(subTotal, opt.dataset.type, Number(opt.dataset.value));
        }
        const finalTotal = Math.max(0, subTotal - discount) + totalShippingFee;
        modal.querySelector('#p-discount-row').style.display = discount > 0 ? 'block' : 'none';
        modal.querySelector('#p-discount').textContent = won(discount);
        modal.querySelector('#p-total').textContent = won(finalTotal);
      }
      if (couponSelect) { couponSelect.addEventListener('change', updatePriceUI); updatePriceUI(); }

      modal.querySelector('#checkout-form').onsubmit = async ev => {
        ev.preventDefault();
        const f = ev.target;
        const mg = getMember()?.grade || '일반회원';
        // ⭐ [요청10] 등급 구매 검증
        for (const it of cart) {
          if (!canPurchase(mg, it.target_grade || 'all')) {
            alert(`현재 등급에서는 "${it.product_name}"을(를) 구매할 수 없습니다.`); return;
          }
        }
        let couponIdToUse = null, discountAmount = 0;
        if (couponSelect && couponSelect.value) {
          const opt = couponSelect.selectedOptions[0];
          couponIdToUse = couponSelect.value;
          discountAmount = calcDiscount(subTotal, opt.dataset.type, Number(opt.dataset.value));
        }
        const finalTotal = Math.max(0, subTotal - discountAmount) + totalShippingFee;
        const orderNumber = generateOrderNumber();
        const groupShipFeeAssigned = {};
        const rows = cart.map((it, idx) => {
          const tg = it.target_grade || 'all';
          const pricing = getItemPricing(it);
          let rowShipFee = 0;
          if (!groupShipFeeAssigned[tg]) { rowShipFee = pricing.shippingFeePerGroup; groupShipFeeAssigned[tg] = true; }
          const lineTotal = it.product_price * it.quantity;
          const rowTotal = idx === 0 ? Math.max(0, lineTotal - discountAmount) + rowShipFee : lineTotal + rowShipFee;
          return {
            order_number: orderNumber, product_id: it.product_id, product_code: it.product_code || '',
            product_name: it.product_name, product_price: it.product_price, quantity: it.quantity,
            total_price: rowTotal, customer_name: f.customer_name.value.trim(), customer_phone: f.customer_phone.value.trim(),
            depositor_name: f.depositor_name.value.trim(), memo: f.memo.value.trim(),
            address: f.address.value.trim(), address_detail: f.address_detail.value.trim(), postcode: f.postcode.value.trim(),
            selected_color: it.selected_color, selected_size: it.selected_size, selected_hem: it.selected_hem, selected_other: it.selected_other,
            shipping_fee: rowShipFee, grade_discount: pricing.discountRate, status: '입금대기',
          };
        });
        const { error } = await db.from('orders').insert(rows);
        if (error) { alert('❌ 주문 실패: ' + error.message); return; }
        if (couponIdToUse) {
          try { await db.from('coupons').update({ is_used: true, used_at: new Date().toISOString(), used_order_number: orderNumber }).eq('id', couponIdToUse); } catch {}
        }
        const remainingCart = getCart().filter((_, idx) => !selectedIndexes.has(idx));
        saveCart(remainingCart);
        if (isLoggedInMember()) pushCartToServer(remainingCart);
        selectedIndexes.clear();
        if (document.getElementById('app-header')) renderHeader('cart');
        showOrderComplete(modal, orderNumber, finalTotal, closeModal);
        render();
      };
    }

    function generateOrderNumber() {
      const d = new Date();
      const parts = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: '2-digit', month: '2-digit', day: '2-digit' }).formatToParts(d);
      const get = t => parts.find(p => p.type === t)?.value || '00';
      return `ORD-${get('year')}${get('month')}${get('day')}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
    }

    function showOrderComplete(modal, orderNumber, total, closeModal) {
      const box = modal.querySelector('.checkout-modal-box');
      const acc = cachedAccount;
      const hasAccount = acc.bank || acc.number || acc.holder;
      const accountHtml = hasAccount ? `<b>입금 계좌 안내</b><br>
        ${acc.bank ? `은행: <b>${acc.bank}</b><br>` : ''}
        ${acc.number ? `계좌: <b>${acc.number}</b><br>` : ''}
        ${acc.holder ? `예금주: <b>${acc.holder}</b><br>` : ''}
        입금액: <b>${won(total)}</b>` : `<b>입금 계좌 안내</b><br><span style="color:#888;">관리자가 계좌 정보를 등록하지 않았습니다.</span><br>입금액: <b>${won(total)}</b>`;
      box.innerHTML = `<h2 style="margin-bottom:16px; color:#10b981;">✅ 주문 접수 완료</h2>
        <div style="background:#0f0f0f; padding:16px; border-radius:8px; margin-bottom:16px; line-height:1.8; font-size:14px; border:1px solid #222;">
          <div style="font-size:13px; color:#888;">주문번호</div>
          <div style="font-size:18px; font-weight:700; color:#60a5fa; margin-bottom:8px; letter-spacing:1px;">${orderNumber}</div>
          <hr style="border:0; border-top:1px solid #222; margin:8px 0;">
          ${accountHtml}
        </div>
        <button id="go-main" style="width:100%; padding:12px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-family:inherit;">메인으로</button>`;
      box.querySelector('#go-main').onclick = () => { closeModal(); location.href = 'index.html'; };
    }

    (async () => {
      await loadShipping();
      await loadAccountInfo();
      render();
      if (isLoggedInMember()) {
        try { await syncCartFromServer(); render(); } catch {}
      }
    })();
  </script>
</body>
</html>
