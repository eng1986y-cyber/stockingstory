<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>장바구니 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js" defer></script>
</head>
<body>
  <header style="display:flex; justify-content:space-between; align-items:center;">
    <h1><a href="index.html">🛍️ 심플몰</a></h1>
    <a href="index.html" style="padding:8px 14px; background:#eee; border-radius:6px; text-decoration:none; color:#222; font-size:14px;">
      계속 쇼핑
    </a>
  </header>

  <main>
    <div id="cart-list" style="display:grid; gap:12px;">로딩중...</div>
    <div id="cart-summary" style="margin-top:24px; display:none;"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const listEl = document.getElementById('cart-list');
    const summaryEl = document.getElementById('cart-summary');

    function getCart() { return JSON.parse(localStorage.getItem('cart') || '[]'); }
    function saveCart(cart) { localStorage.setItem('cart', JSON.stringify(cart)); }

    function getMemberField(key) {
      try {
        const m = JSON.parse(localStorage.getItem('member') || '{}');
        return m[key] || '';
      } catch { return ''; }
    }

    function render() {
      const cart = getCart();
      if (cart.length === 0) {
        listEl.innerHTML = '<p style="text-align:center; padding:40px; color:#888;">장바구니가 비어있습니다.</p>';
        summaryEl.style.display = 'none';
        return;
      }

      listEl.innerHTML = cart.map((it, idx) => `
        <div style="background:#fff; padding:14px; border-radius:8px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <img src="${it.main_image}" style="width:70px; height:70px; object-fit:cover; border-radius:6px;">
          <div style="flex:1; font-size:14px; line-height:1.6; min-width:150px;">
            <b>${it.product_name}</b><br>
            ${it.selected_color ? `색상: ${it.selected_color} · ` : ''}${it.selected_size ? `사이즈: ${it.selected_size}` : ''}
            ${it.selected_extras?.length ? `<br>추가옵션: ${it.selected_extras.join(', ')}` : ''}
            <br>
            ${Number(it.product_price).toLocaleString()}원 ×
            <input type="number" min="1" value="${it.quantity}" data-idx="${idx}"
              class="qty-input"
              style="width:55px; padding:4px; border:1px solid #ddd; border-radius:4px; margin:0 4px;">
            = <b style="color:#e53935;">${(it.product_price * it.quantity).toLocaleString()}원</b>
          </div>
          <button data-idx="${idx}" class="del-btn"
            style="padding:8px 12px; background:#e53935; color:#fff; border:0; border-radius:6px; cursor:pointer; font-size:13px;">
            삭제
          </button>
        </div>
      `).join('');

      const subTotal = cart.reduce((s, it) => s + it.product_price * it.quantity, 0);
      // 묶음배송: 상품별 배송비 중 최댓값 1회만
      const shippingTotal = Math.max(...cart.map(it => Number(it.shipping_fee) || 0));
      const total = subTotal + shippingTotal;

      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `
        <div style="background:#fff; padding:20px; border-radius:8px; text-align:right; font-size:14px; line-height:1.8;">
          <div>상품 합계: <b>${subTotal.toLocaleString()}원</b></div>
          <div>배송비: <b>${shippingTotal > 0 ? shippingTotal.toLocaleString() + '원 (묶음배송)' : '무료'}</b></div>
          <hr style="border:0; border-top:1px solid #eee; margin:12px 0;">
          <p style="font-size:18px; margin-bottom:16px;">
            총 합계: <b style="color:#e53935; font-size:22px;">${total.toLocaleString()}원</b>
          </p>
          <button id="checkout-btn"
            style="padding:14px 28px; background:#03c75a; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600; font-size:15px;">
            전체 주문하기 (무통장입금)
          </button>
        </div>
      `;

      listEl.querySelectorAll('.qty-input').forEach(inp => {
        inp.addEventListener('change', () => {
          const cart = getCart();
          const idx = Number(inp.dataset.idx);
          cart[idx].quantity = Math.max(1, Number(inp.value) || 1);
          saveCart(cart);
          render();
        });
      });

      listEl.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cart = getCart();
          cart.splice(Number(btn.dataset.idx), 1);
          saveCart(cart);
          render();
        });
      });

      document.getElementById('checkout-btn').onclick = () => showCheckoutModal(cart);
    }

    function showCheckoutModal(cart) {
      const subTotal = cart.reduce((s, it) => s + it.product_price * it.quantity, 0);
      const maxShipping = Math.max(...cart.map(it => Number(it.shipping_fee) || 0));
      const total = subTotal + maxShipping;

      const modal = document.createElement('div');
      modal.style.cssText = `position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:10px;`;
      modal.innerHTML = `
        <div style="background:#fff; padding:20px; border-radius:10px; width:100%; max-width:420px; max-height:90vh; overflow-y:auto;">
          <h2 style="margin-bottom:16px; font-size:18px;">주문 정보 입력</h2>
          <p style="margin-bottom:12px; font-size:14px; color:#555;">
            총 <b>${cart.length}개</b> 상품 · <b>${total.toLocaleString()}원</b>
            ${maxShipping > 0 ? `<br><span style="font-size:12px; color:#888;">(배송비 ${maxShipping.toLocaleString()}원 포함, 묶음배송)</span>` : ''}
          </p>
          <form id="checkout-form" style="display:grid; gap:10px;">
            <input name="customer_name" placeholder="주문자 이름" required value="${getMemberField('name')}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <input name="customer_phone" type="tel" inputmode="numeric" placeholder="연락처 (010-0000-0000)" required value="${getMemberField('phone')}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <input name="depositor_name" placeholder="입금자명" required
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <textarea name="memo" placeholder="요청사항 (선택)"
              style="padding:10px; border:1px solid #ddd; border-radius:6px; min-height:60px;"></textarea>

            <button type="submit"
              style="padding:12px; background:#03c75a; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">
              주문 완료 (무통장입금)
            </button>
            <button type="button" id="close-modal"
              style="padding:10px; background:#eee; border:0; border-radius:6px; cursor:pointer;">
              취소
            </button>
          </form>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('#close-modal').onclick = () => modal.remove();

      modal.querySelector('#checkout-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;

        const groupId = 'g_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);

        // 묶음배송: 배송비는 첫 상품 행에만 포함
        const rows = cart.map((it, idx) => ({
          product_id: it.product_id,
          product_name: it.product_name,
          product_price: it.product_price,
          quantity: it.quantity,
          total_price: idx === 0
            ? it.product_price * it.quantity + maxShipping
            : it.product_price * it.quantity,
          customer_name: f.customer_name.value.trim(),
          customer_phone: f.customer_phone.value.trim(),
          depositor_name: f.depositor_name.value.trim(),
          memo: f.memo.value.trim(),
          selected_color: it.selected_color,
          selected_size: it.selected_size,
          selected_extras: it.selected_extras,
          shipping_fee: idx === 0 ? maxShipping : 0,
          group_id: groupId,
        }));

        const { error } = await db.from('orders').insert(rows);
        if (error) { alert('❌ 주문 실패: ' + error.message); return; }

        localStorage.removeItem('cart');

        modal.querySelector('div').innerHTML = `
          <h2 style="margin-bottom:16px; color:#03c75a;">✅ 주문 접수 완료</h2>
          <div style="background:#f8f8f8; padding:16px; border-radius:8px; margin-bottom:16px; line-height:1.7; font-size:14px;">
            상품 합계: ${subTotal.toLocaleString()}원<br>
            배송비: ${maxShipping > 0 ? maxShipping.toLocaleString() + '원 (묶음배송)' : '무료'}<br>
            <b>총액: ${total.toLocaleString()}원</b>
            <hr style="border:0; border-top:1px solid #ddd; margin:8px 0;">
            <b>입금 계좌 안내</b><br>
            은행: <b>○○은행</b><br>
            계좌: <b>123-456-789012</b><br>
            예금주: <b>홍길동</b><br>
            입금액: <b>${total.toLocaleString()}원</b><br>
            입금자명: <b>${f.depositor_name.value}</b>
          </div>
          <p style="font-size:13px; color:#666; margin-bottom:16px;">
            위 계좌로 입금해주시면 확인 후 배송 준비됩니다.
          </p>
          <button onclick="location.href='index.html'"
            style="width:100%; padding:12px; background:#222; color:#fff; border:0; border-radius:6px; cursor:pointer;">
            메인으로
          </button>
        `;
        setTimeout(() => {
          listEl.innerHTML = '';
          summaryEl.style.display = 'none';
        }, 100);
      });
    }

    render();
  </script>
</body>
</html>
