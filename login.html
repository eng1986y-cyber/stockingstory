<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>로그인 - 스타킹스토리 심플라이프</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    .auth-wrap { max-width: 400px; margin: 40px auto; padding: 0 16px; }
    .auth-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #222;
    }
    body.dark .auth-title { color: #fff; }
    .auth-form {
      display: grid;
      gap: 10px;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
    }
    body.dark .auth-form {
      background: #151515;
      border: 1px solid #222;
      border-radius: 12px;
    }
    .auth-form input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    body.dark .auth-form input {
      background: #0f0f0f;
      border-color: #2a2a2a;
      color: #e5e7eb;
    }
    body.dark .auth-form input::placeholder { color: #555; }
    body.dark .auth-form input:focus {
      outline: none;
      border-color: #555;
      box-shadow: 0 0 0 3px rgba(255,255,255,.05);
    }
    .auth-form button {
      padding: 14px;
      background: #03c75a;
      color: #fff;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      font-family: inherit;
    }
    .auth-form button:hover { background: #02b151; }
    .auth-link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
    }
    .auth-link a {
      color: #1976d2;
      text-decoration: none;
    }
    body.dark .auth-link a { color: #60a5fa; }
    #msg { margin-top: 12px; font-weight: 600; text-align: center; }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div class="auth-wrap">
      <h2 class="auth-title">로그인</h2>
      <form id="login-form" class="auth-form">
        <input name="username" placeholder="아이디" required>
        <input name="password" type="password" placeholder="비밀번호" required>
        <button type="submit">로그인</button>
      </form>
      <p id="msg"></p>
      <div class="auth-link">
        <a href="signup.html">회원가입 하러가기</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const form = document.getElementById('login-form');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '로그인 중...';
      msg.style.color = '#888';

      const username = form.username.value.trim();
      const password = form.password.value;

      const { data, error } = await db
        .from('members')
        .select('*')
        .eq('username', username)
        .eq('password', password)
        .maybeSingle();

      if (error) {
        msg.style.color = '#ef4444';
        msg.textContent = '❌ ' + error.message;
        return;
      }
      if (!data) {
        msg.style.color = '#ef4444';
        msg.textContent = '❌ 아이디 또는 비밀번호가 틀렸습니다.';
        return;
      }

      const status = data.status || '정상';

      if (status === '정지') {
        msg.style.color = '#ef4444';
        msg.innerHTML = `❌ <b>정지된 계정</b>입니다.<br>관리자에게 문의하세요.`;
        return;
      }
      if (status === '탈퇴') {
        msg.style.color = '#ef4444';
        msg.textContent = '❌ 탈퇴한 계정입니다.';
        return;
      }

      localStorage.setItem('member', JSON.stringify({
        id: data.id,
        username: data.username,
        name: data.name,
        phone: data.phone,
        email: data.email,
        address: data.address || '',
        address_detail: data.address_detail || '',
        postcode: data.postcode || '',
        status: status,
      }));

      msg.style.color = '#10b981';
      msg.textContent = '✅ 로그인 성공! 이동 중...';
      setTimeout(() => location.href = 'index.html', 800);
    });
  </script>
</body>
</html>
