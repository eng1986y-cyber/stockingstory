<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>상품 상세 - Simple life' StockingStory</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }

    .checkout-modal-backdrop { position: fixed !important; top: 0; left: 0; right: 0; bottom: 0; width: 100vw !important; height: 100vh !important; height: 100dvh !important; background: rgba(0,0,0,.8); z-index: 999999 !important; display: flex !important; align-items: flex-start !important; justify-content: center !important; padding: 10px !important; overflow-y: auto !important; -webkit-overflow-scrolling: touch; box-sizing: border-box; }
    .checkout-modal-box { background: #151515; border: 1px solid #222; padding: 20px 16px; border-radius: 12px; width: 100% !important; max-width: 460px !important; margin: 20px auto !important; color: #e5e7eb; box-sizing: border-box; position: relative; }
    .checkout-modal-box .checkout-form { display: grid !important; gap: 10px !important; background: none !important; padding: 0 !important; border: 0 !important; max-width: none !important; width: 100% !important; }
    .checkout-modal-box h2 { margin: 0 0 16px !important; font-size: 18px !important; color: #fff !important; }
    @media (max-width: 768px) {
      .checkout-modal-backdrop { align-items: flex-start !important; padding: 0 !important; padding-top: 10px !important; padding-bottom: 10px !important; }
      .checkout-modal-box { margin: 0 auto !important; border-radius: 8px !important; max-height: none !important; }
    }

    .coupon-picker { background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; margin-top: 8px; }
    .coupon-picker .cp-title { font-size: 13px; font-weight: 700; color: #fbbf24; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .coupon-picker select { width: 100%; padding: 10px 12px; background: #151515; border: 1px solid #333; border-radius: 6px; color: #e5e7eb; font-family: inherit; font-size: 13px; }

    /* 도매전용 상품 쿠폰 비활성화 안내 */
    .coupon-disabled-notice {
      background: #1a1a1a; border: 1px dashed #f59e0b; border-radius: 8px;
      padding: 12px; margin-top: 8px; font-size: 13px; color: #fbbf24;
      display: flex; align-items: center; gap: 8px;
    }

    /* ⬇️⬇️ 배송기간 참고용 달력 스타일 (전체폭, 높이 최대화) ⬇️⬇️ */
    .ship-cal-box {
      background: #151515;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
      margin-top: 16px;
      box-sizing: border-box;
      width: 100%;
    }
    .ship-cal-box .scal-title {
      font-size: 16px; font-weight: 700; color: #e5e7eb;
      margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
    }
    .ship-cal-box .scal-desc {
      font-size: 13px; color: #9ca3af; line-height: 1.7;
      margin-bottom: 16px;
    }
    .ship-cal-box .scal-head {
      display: flex; justify-content: space-between; align-items: center;
      color: #e5e7eb; font-size: 18px; font-weight: 700;
      margin-bottom: 16px;
    }
    .ship-cal-box .scal-head button {
      background: #222; color: #e5e7eb; border: 1px solid #333;
      border-radius: 8px; padding: 10px 20px; cursor: pointer;
      font-family: inherit; font-size: 18px; line-height: 1; font-weight: 700;
    }
    .ship-cal-box .scal-head button:hover { background: #2a2a2a; }

    .ship-cal-box .scal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: minmax(70px, 1fr);
      gap: 6px;
      width: 100%;
    }
    .ship-cal-box .scal-dow {
      text-align: center;
      font-size: 14px;
      color: #888;
      padding: 10px 0;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ship-cal-box .scal-day {
      text-align: center;
      padding: 0;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      color: #e5e7eb;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      min-height: 70px;
    }
    .ship-cal-box .scal-day.empty { background: transparent; }
    .ship-cal-box .scal-day.past { color: #444; background: #111; }
    .ship-cal-box .scal-day.today {
      border: 2px solid #fbbf24; color: #fbbf24;
      background: #1f1a0a;
    }
    .ship-cal-box .scal-day.sunday { color: #f87171; }
    .ship-cal-box .scal-day.saturday { color: #60a5fa; }
    .ship-cal-box .scal-day.past.sunday,
    .ship-cal-box .scal-day.past.saturday { color: #444; }

    .ship-cal-box .scal-legend {
      display: flex; flex-wrap: wrap; gap: 16px;
      margin-top: 16px; padding-top: 14px;
      border-top: 1px dashed #333;
      font-size: 12px; color: #9ca3af;
    }
    .ship-cal-box .scal-legend span { display: flex; align-items: center; gap: 6px; }
    .ship-cal-box .scal-legend .lg-box {
      display: inline-block; width: 14px; height: 14px; border-radius: 3px;
    }
    .ship-cal-box .scal-legend .lg-sun { background: #f87171; }
    .ship-cal-box .scal-legend .lg-sat { background: #60a5fa; }

    @media (max-width: 768px) {
      .ship-cal-box { padding: 14px; }
      .ship-cal-box .scal-title { font-size: 15px; }
      .ship-cal-box .scal-desc { font-size: 12px; margin-bottom: 12px; }
      .ship-cal-box .scal-head { font-size: 15px; margin-bottom: 12px; }
      .ship-cal-box .scal-head button { padding: 8px 14px; font-size: 16px; }
      .ship-cal-box .scal-grid {
        grid-auto-rows: minmax(48px, 1fr);
        gap: 4px;
      }
      .ship-cal-box .scal-dow { font-size: 12px; padding: 6px 0; }
      .ship-cal-box .scal-day { font-size: 15px; min-height: 48px; }
    }

    /* ⬇️⬇️ 사이즈 상세 테이블 스타일 ⬇️⬇️ */
    .size-detail-box {
      background: #151515;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
      margin-top: 16px;
      box-sizing: border-box;
      width: 100%;
    }
    .size-detail-box .sd-title {
      font-size: 16px; font-weight: 700; color: #e5e7eb;
      margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
    }
    .size-detail-box .sd-title .sd-hint {
      font-size: 12px; font-weight: 400; color: #9ca3af;
    }
    .size-detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .size-detail-table thead th {
      background: #1a1a1a;
      color: #fbbf24;
      font-weight: 700;
      font-size: 13px;
      padding: 12px 8px;
      text-align: center;
      border-bottom: 1px solid #333;
      white-space: nowrap;
    }
    .size-detail-table tbody td {
      padding: 12px 8px;
      text-align: center;
      color: #e5e7eb;
      font-size: 14px;
      border-bottom: 1px solid #222;
      word-break: break-all;
    }
    .size-detail-table tbody tr:last-child td { border-bottom: none; }
    .size-detail-table tbody tr:hover td { background: #1a1a1a; }
    .size-detail-table tbody td:first-child {
      font-weight: 700;
      color: #fff;
    }
    @media (max-width: 768px) {
      .size-detail-box { padding: 14px; }
      .size-detail-box .sd-title { font-size: 15px; }
      .size-detail-table thead th { font-size: 11px; padding: 10px 4px; }
      .size-detail-table tbody td { font-size: 12px; padding: 10px 4px; }
    }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <main id="product-detail" style="color:#e5e7eb;">로딩중...</main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    const TARGET_DISCOUNT = { 'all': 0, 'wholesale': 50, 'vip': 30 };
    const TARGET_SHIPPING = {
      'all':       { method: '택배', feeType: 'setting' },
      'wholesale': { method: '해운', feeType: 'collect' },
      'vip':       { method: '택배', feeType: 'free' },
    };

    let MIN_QTY = 6;
    let currentProduct = null;
    let globalShipping = 0;
    let selectedItems = [];
    let cachedAccount = { bank: '', number: '', holder: '' };

    let scalY = new Date().getFullYear();
    let scalM = new Date().getMonth();

    function getMember() { try { return JSON.parse(localStorage.getItem('member') || 'null'); } catch { return null; } }
    function isLoggedIn() {
      const m = getMember();
      return !!(m && m.id);
    }
    function isNewProduct(product) {
      if (!product || !product.created_at) return false;
      const created = new Date(product.created_at).getTime();
      if (isNaN(created)) return false;
      return (Date.now() - created) < 7 * 24 * 60 * 60 * 1000;
    }
    function shouldHidePrice(product) { return !isLoggedIn() && isNewProduct(product); }

    // ⭐ 도매전용 상품인지 확인
    function isWholesaleProduct(product) {
      return (product?.target_grade || 'all') === 'wholesale';
    }

    async function loadShippingFee() {
      const { data } = await db.from('settings').select('value').eq('key', 'shipping_fee').maybeSingle();
      globalShipping = data ? Number(data.value) || 0 : 0;
    }

    async function loadAccountInfo() {
      try {
        const { data } = await db.from('settings').select('key, value').in('key', ['account_bank', 'account_number', 'account_holder']);
        const map = {};
        (data || []).forEach(row => { map[row.key] = row.value || ''; });
        cachedAccount = {
          bank: map.account_bank || '',
          number: map.account_number || '',
          holder: map.account_holder || ''
        };
      } catch (e) {
        cachedAccount = { bank: '', number: '', holder: '' };
      }
    }

    function getPricing(product) {
      const tg = product.target_grade || 'all';
      const basePrice = Number(product.price);
      const discountRate = TARGET_DISCOUNT[tg] ?? 0;
      const finalPrice = Math.round(basePrice * (100 - discountRate) / 100);
      const shipPolicy = TARGET_SHIPPING[tg] || TARGET_SHIPPING.all;
      let shippingFee = 0, shippingLabel = '', shippingMethod = shipPolicy.method;
      if (shipPolicy.feeType === 'setting') {
        shippingFee = globalShipping;
        shippingLabel = globalShipping > 0 ? globalShipping.toLocaleString() + '원' : '무료';
      } else if (shipPolicy.feeType === 'collect') {
        shippingFee = 0;
        shippingLabel = '착불';
      } else {
        shippingFee = 0;
        shippingLabel = '무료';
      }
      return { targetGrade: tg, basePrice, discountRate, finalPrice, shippingFee, shippingLabel, shippingMethod };
    }

    function buildSizeDetailHtml(sizeDetail) {
      if (!Array.isArray(sizeDetail) || sizeDetail.length === 0) return '';
      const rows = sizeDetail.filter(r => r && (r.size || r.weight || r.height));
      if (rows.length === 0) return '';
      return `
        <div class="size-detail-box">
          <div class="sd-title"> 사이즈 상세 정보 <span class="sd-hint">(권장 사이즈 안내)</span></div>
          <table class="size-detail-table">
            <thead>
              <tr>
                <th>사이즈</th>
                <th>권장몸무게</th>
                <th>신장</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>${(r.size || '-').replace(/</g,'&lt;')}</td>
                  <td>${(r.weight || '-').replace(/</g,'&lt;')}</td>
                  <td>${(r.height || '-').replace(/</g,'&lt;')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    async function loadProduct() {
      const detailEl = document.getElementById('product-detail');
      if (!id) { detailEl.innerHTML = '<p>상품 ID가 없습니다.</p>'; return; }
      await loadShippingFee();
      await loadAccountInfo();
      const { data, error } = await db.from('products').select('*').eq('id', id).single();
      if (error || !data) { detailEl.innerHTML = '<p>상품이 없습니다.</p>'; return; }

      currentProduct = data;
      MIN_QTY = Number(data.min_qty) || 1;

      const member = getMember();
      const memberGrade = member?.grade || '일반회원';
      if (data.target_grade === 'wholesale' && memberGrade !== '도매회원') {
        detailEl.innerHTML = `<div style="max-width:420px; margin:40px auto; text-align:center; background:#151515; border:1px solid #222; padding:32px 20px; border-radius:12px;">
          <div style="font-size:36px; margin-bottom:12px;">🔒</div>
          <h2 style="color:#fff; font-size:18px; margin:0 0 8px;">도매회원 전용 상품</h2>
          <p style="color:#9ca3af; font-size:13px; line-height:1.7;">이 상품은 <b>도매회원</b>만 구매할 수 있습니다.</p>
          <a href="index.html" style="display:inline-block; margin-top:16px; padding:10px 20px; background:#e5e7eb; color:#111; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px;">메인으로</a>
        </div>`;
        return;
      }
      if (data.target_grade === 'vip' && memberGrade !== 'VIP회원') {
        detailEl.innerHTML = `<div style="max-width:420px; margin:40px auto; text-align:center; background:#151515; border:1px solid #222; padding:32px 20px; border-radius:12px;">
          <div style="font-size:36px; margin-bottom:12px;">🔒</div>
          <h2 style="color:#fff; font-size:18px; margin:0 0 8px;">VIP회원 전용 상품</h2>
          <p style="color:#9ca3af; font-size:13px; line-height:1.7;">이 상품은 <b>VIP회원</b>만 구매할 수 있습니다.</p>
          <a href="index.html" style="display:inline-block; margin-top:16px; padding:10px 20px; background:#e5e7eb; color:#111; border-radius:8px; text-decoration:none; font-weight:600; font-size:14px;">메인으로</a>
        </div>`;
        return;
      }

      const hidePrice = shouldHidePrice(data);
      const isNew = isNewProduct(data);
      const pricing = getPricing(data);
      const hasDiscount = pricing.discountRate > 0;

      const { data: sharedImageRows } = await db
        .from('settings')
        .select('key,value')
        .in('key', ['global_product_detail_notice_image', 'global_product_detail_footer_image']);
      const sharedImageMap = {};
      (sharedImageRows || []).forEach(row => { sharedImageMap[row.key] = row.value || ''; });
      const sharedNoticeImage = sharedImageMap.global_product_detail_notice_image || '';
      const sharedFooterImage = sharedImageMap.global_product_detail_footer_image || '';

      const detailImgs = (data.detail_images || []).map(url => `<img src="${url}" alt="상세" loading="lazy" style="width:100%; display:block; margin-top:8px; border-radius:8px;">`).join('');

      let shippingLabel = '';
      if (pricing.targetGrade === 'wholesale') {
        shippingLabel = `<span style="color:#f59e0b; font-weight:700;">배송방법: 해운 / 배송비: 착불</span>`;
      } else if (pricing.targetGrade === 'vip') {
        shippingLabel = `<span style="color:#10b981; font-weight:700;">배송방법: 택배 / 배송비: 무료</span>`;
      } else {
        shippingLabel = pricing.shippingFee > 0
          ? `<span style="color:#888;">배송비 ${pricing.shippingFee.toLocaleString()}원</span>`
          : `<span style="color:#10b981;">무료배송</span>`;
      }

      const colors = data.colors || [], sizes = data.sizes || [], hemOptions = data.hem_option || [], otherOptions = data.other_option || [];

      function buildSelect(name, label, options) {
        if (!options.length) return '';
        return `
          <div>
            <label style="font-size:13px; font-weight:600; color:#ccc; display:block; margin-bottom:4px;">${label}</label>
            <select data-opt-name="${name}" style="width:100%; padding:10px 12px; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:8px; color:#e5e7eb; font-family:inherit; font-size:14px;">
              <option value="">${label} 선택</option>
              ${options.map(o => `<option value="${o}">${o}</option>`).join('')}
            </select>
          </div>
        `;
      }

      const row1 = (colors.length || sizes.length) ? `
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
          ${buildSelect('color', '색상', colors)}
          ${buildSelect('size', '사이즈', sizes)}
        </div>
      ` : '';
      const row2 = (hemOptions.length || otherOptions.length) ? `
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
          ${buildSelect('hem', '밑단선택', hemOptions)}
          ${buildSelect('other', '기타옵션', otherOptions)}
        </div>
      ` : '';

      const shareBtn = `<button id="share-btn" style="padding:8px 12px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit;">🔗 공유</button>`;

      const minQtyNotice = MIN_QTY > 1 ? `
        <div style="margin-top:12px; padding:10px 12px; background:#1a1a1a; border:1px solid #333; border-radius:8px; font-size:12px; color:#f59e0b; line-height:1.6;">
          ⚠️ 최소 주문수량은 <b>${MIN_QTY}개</b>입니다.<br>
          (다른 옵션 및 디자인과 자유롭게 교차/혼합 구매가능)
        </div>
      ` : '';

      const newBadge = isNew ? `<span style="display:inline-block; margin-left:8px; background:#e53935; color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:4px; vertical-align:middle;">NEW</span>` : '';
      const gradeBadge = (data.target_grade === 'wholesale')
        ? `<span style="display:inline-block; margin-left:8px; background:#f59e0b; color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:4px; vertical-align:middle;">도매전용</span>`
        : (data.target_grade === 'vip')
        ? `<span style="display:inline-block; margin-left:8px; background:#a855f7; color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:4px; vertical-align:middle;">VIP전용</span>`
        : '';

      const discountInfo = hasDiscount ? `
        <div style="display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:6px;">
          <span style="color:#9ca3af; text-decoration:line-through; font-size:14px;">${pricing.basePrice.toLocaleString()}원</span>
          <span style="background:#ef4444; color:#fff; font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px;">${pricing.discountRate}% 할인</span>
        </div>
      ` : '';

      const priceHtml = hidePrice
        ? `<div style="background:#1a1a1a; border:1px solid #333; border-radius:8px; padding:14px 16px; margin:0 0 16px; display:flex; align-items:center; gap:10px;">
             <span style="font-size:24px;">🔒</span>
             <div>
               <div style="color:#e5e7eb; font-weight:700; font-size:15px;">로그인 후 가격 확인 가능</div>
               <div style="color:#9ca3af; font-size:12px; margin-top:2px;">신상품은 등록 후 7일간 회원에게만 가격이 공개됩니다.</div>
               <a href="login.html" style="display:inline-block; margin-top:8px; padding:6px 12px; background:#e5e7eb; color:#111; text-decoration:none; border-radius:6px; font-size:13px; font-weight:600;">로그인 하기 →</a>
             </div>
           </div>`
        : `<div style="margin:0 0 8px;">
             ${discountInfo}
             <p style="color:#ef4444; font-weight:700; font-size:24px; margin:0;">${pricing.finalPrice.toLocaleString()}원</p>
           </div>`;

      const sizeDetailHtml = buildSizeDetailHtml(data.size_detail);

      detailEl.innerHTML = `
        <div style="background:#151515; border:1px solid #222; border-radius:12px; padding:16px;">
          <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:stretch;">
            <div style="flex:1 1 320px; min-width:0;">
              <img src="${data.main_image}" alt="${data.name}" style="width:100%; border-radius:8px; display:block;">
            </div>
            <div style="flex:1 1 320px; min-width:0; display:flex; flex-direction:column; justify-content:space-between;">
              <div>
                ${data.product_code ? `<div style="color:#666; font-size:12px; margin-bottom:4px;">제품번호: ${data.product_code}</div>` : ''}
                <div style="display:flex; justify-content:space-between; align-items:start; gap:8px;">
                  <h2 style="margin:0 0 12px; font-size:22px; color:#fff; flex:1;">${data.name}${gradeBadge}${newBadge}</h2>
                  ${shareBtn}
                </div>
                ${priceHtml}
                <p style="margin:0 0 16px;">${shippingLabel}</p>
                ${minQtyNotice}
                ${hidePrice ? '' : `
                  <div style="margin-top:12px; font-size:13px; font-weight:600; color:#fff; margin-bottom:8px;">옵션 선택 (필수) <span style="color:#ef4444;">*</span></div>
                  ${row1}
                  ${row2}
                  <div id="selected-items" style="margin-top:12px;"></div>
                `}
              </div>
              ${hidePrice ? '' : `
                <div style="margin-top:20px;">
                  <div id="total-preview" style="text-align:right; font-size:14px; font-weight:600; color:#ef4444; line-height:1.6; margin-bottom:16px;"></div>
                  <div style="display:flex; gap:8px;">
                    <button id="cart-btn" style="flex:1; padding:14px; background:#1a1a1a; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-weight:600; font-size:15px; font-family:inherit;">장바구니</button>
                    <button id="buy-btn" style="flex:1; padding:14px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-size:15px; font-family:inherit;">바로 구매</button>
                  </div>
                </div>
              `}
              ${hidePrice ? `
                <div style="margin-top:20px; padding:14px; background:#1a1a1a; color:#666; border:1px dashed #333; border-radius:8px; font-weight:600; font-size:14px; text-align:center;">
                  🔒 로그인 후 구매 가능
                </div>
              ` : ''}
            </div>
          </div>
        </div>

        ${sharedNoticeImage ? `<div class="global-product-detail-notice" style="margin-top:16px;"><img src="${sharedNoticeImage}" alt="상품 공지" loading="lazy" style="display:block;width:100%;height:auto;border-radius:8px;"></div>` : ''}

        <div class="ship-cal-box" id="ship-cal-box">
          <div class="scal-title">배송기간 참고 달력</div>
          <div id="scal-root"></div>
          <div class="scal-legend">
            <span><span class="lg-box lg-sun"></span> 일요일 (배송 지연 가능)</span>
            <span><span class="lg-box lg-sat"></span> 토요일 (배송 지연 가능)</span>
          </div>
        </div>

        ${sizeDetailHtml}

        ${detailImgs ? `<div style="margin-top:8px;">${detailImgs}</div>` : ''}
        ${sharedFooterImage ? `<div class="global-product-detail-footer" style="margin-top:16px;"><img src="${sharedFooterImage}" alt="상품 사용설명 및 배송안내" loading="lazy" style="display:block;width:100%;height:auto;border-radius:8px;"></div>` : ''}
      `;

      const shareEl = document.getElementById('share-btn');
      if (shareEl) shareEl.onclick = () => shareProduct(data);

      if (!hidePrice) {
        detailEl.querySelectorAll('select[data-opt-name]').forEach(sel => {
          sel.addEventListener('change', () => handleOptionChange());
        });
        document.getElementById('cart-btn').addEventListener('click', () => handleOrder('cart'));
        document.getElementById('buy-btn').addEventListener('click', () => handleOrder('single'));
        renderSelectedItems();
      }

      const now = new Date();
      scalY = now.getFullYear();
      scalM = now.getMonth();
      renderShipCalendar();
    }

    function renderShipCalendar() {
      const root = document.getElementById('scal-root');
      if (!root) return;

      const today = new Date(); today.setHours(0, 0, 0, 0);
      const y = scalY, m = scalM;
      const firstDow = new Date(y, m, 1).getDay();
      const lastDate = new Date(y, m + 1, 0).getDate();

      let html = `
        <div class="scal-head">
          <button type="button" data-dir="-1">‹</button>
          <span>${y}년 ${m + 1}월</span>
          <button type="button" data-dir="1">›</button>
        </div>
        <div class="scal-grid">
          ${['일', '월', '화', '수', '목', '금', '토'].map((d, i) => {
            return `<div class="scal-dow" style="${i === 0 ? 'color:#f87171;' : i === 6 ? 'color:#60a5fa;' : ''}">${d}</div>`;
          }).join('')}
      `;
      for (let i = 0; i < firstDow; i++) html += `<div class="scal-day empty"></div>`;
      for (let d = 1; d <= lastDate; d++) {
        const dt = new Date(y, m, d);
        const dow = dt.getDay();
        const isPast = dt < today;
        const isToday = dt.getTime() === today.getTime();
        const cls = ['scal-day'];
        if (isPast) cls.push('past');
        if (isToday) cls.push('today');
        if (dow === 0) cls.push('sunday');
        if (dow === 6) cls.push('saturday');
        html += `<div class="${cls.join(' ')}">${d}</div>`;
      }
      html += `</div>`;

      root.innerHTML = html;

      root.querySelectorAll('.scal-head button').forEach(btn => {
        btn.addEventListener('click', () => {
          const dir = Number(btn.dataset.dir);
          let nm = scalM + dir, ny = scalY;
          if (nm < 0) { nm = 11; ny--; }
          if (nm > 11) { nm = 0; ny++; }
          scalY = ny; scalM = nm;
          renderShipCalendar();
        });
      });
    }

    function handleOptionChange() {
      const detailEl = document.getElementById('product-detail');
      const selects = detailEl.querySelectorAll('select[data-opt-name]');
      const vals = {};
      selects.forEach(s => { vals[s.dataset.optName] = s.value; });
      const anySelected = Object.values(vals).some(v => v);
      if (!anySelected) return;
      const allRequired = Array.from(selects).every(s => s.value);
      if (!allRequired) return;
      const item = { color: vals.color || null, size: vals.size || null, hem: vals.hem || null, other: vals.other || null, qty: 1 };
      const dupIdx = selectedItems.findIndex(it => it.color === item.color && it.size === item.size && it.hem === item.hem && it.other === item.other);
      if (dupIdx >= 0) selectedItems[dupIdx].qty += 1;
      else selectedItems.push(item);
      selects.forEach(s => { s.value = ''; });
      renderSelectedItems();
    }

    function getUnitPrice() {
      return getPricing(currentProduct).finalPrice;
    }

    function renderSelectedItems() {
      const el = document.getElementById('selected-items');
      if (!el) return;
      if (selectedItems.length === 0) { el.innerHTML = ''; updateTotalPreview(); return; }
      const unitPrice = getUnitPrice();
      el.innerHTML = `
        <div style="background:#0f0f0f; border:1px solid #222; border-radius:8px; overflow:hidden;">
          ${selectedItems.map((it, idx) => {
            const opts = [];
            if (it.color) opts.push(it.color);
            if (it.size) opts.push(it.size);
            if (it.hem) opts.push(it.hem);
            if (it.other) opts.push(it.other);
            const label = opts.length ? opts.join(' / ') : '기본';
            const lineTotal = it.qty * unitPrice;
            return `
              <div style="padding:12px; ${idx > 0 ? 'border-top:1px solid #222;' : ''}">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                  <span style="font-size:14px; color:#e5e7eb; font-weight:500;">${label}</span>
                  <button class="item-del" data-idx="${idx}" style="background:none; border:0; color:#888; cursor:pointer; font-size:16px; padding:0; line-height:1;">✕</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="display:inline-flex; align-items:center; border:1px solid #333; border-radius:4px; overflow:hidden; background:#151515;">
                    <button class="qty-minus" data-idx="${idx}" style="width:32px; height:32px; background:none; color:#e5e7eb; border:0; cursor:pointer; font-size:16px; font-weight:700; font-family:inherit;">−</button>
                    <input type="number" class="qty-input-item" data-idx="${idx}" value="${it.qty}" min="1" style="width:44px; padding:0; background:none; border:0; color:#e5e7eb; text-align:center; font-family:inherit; height:32px; border-left:1px solid #333; border-right:1px solid #333;">
                    <button class="qty-plus" data-idx="${idx}" style="width:32px; height:32px; background:none; color:#e5e7eb; border:0; cursor:pointer; font-size:16px; font-weight:700; font-family:inherit;">+</button>
                  </div>
                  <span style="font-size:15px; font-weight:700; color:#fff;">${lineTotal.toLocaleString()}원</span>
                </div>
              </div>
            `;
          }).join('')}
          <div style="padding:12px; background:#151515; border-top:1px solid #222; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:14px; color:#ccc;">총 <b style="color:#e5e7eb;">${selectedItems.reduce((s, it) => s + it.qty, 0)}개</b></span>
            <span style="font-size:16px; font-weight:700;">총 금액 <b style="color:#ef4444;">${(selectedItems.reduce((s, it) => s + it.qty, 0) * unitPrice).toLocaleString()}원</b></span>
          </div>
        </div>
      `;
      el.querySelectorAll('.item-del').forEach(btn => {
        btn.addEventListener('click', () => { selectedItems.splice(Number(btn.dataset.idx), 1); renderSelectedItems(); });
      });
      el.querySelectorAll('.qty-minus').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.idx);
          if (selectedItems[idx].qty > 1) { selectedItems[idx].qty--; renderSelectedItems(); }
        });
      });
      el.querySelectorAll('.qty-plus').forEach(btn => {
        btn.addEventListener('click', () => { selectedItems[Number(btn.dataset.idx)].qty++; renderSelectedItems(); });
      });
      el.querySelectorAll('.qty-input-item').forEach(inp => {
        inp.addEventListener('change', () => {
          const idx = Number(inp.dataset.idx);
          selectedItems[idx].qty = Math.max(1, Number(inp.value) || 1);
          renderSelectedItems();
        });
      });
      updateTotalPreview();
    }

    function updateTotalPreview() {
      const el = document.getElementById('total-preview');
      if (!el) return;
      const totalQty = selectedItems.reduce((s, it) => s + it.qty, 0);
      const sub = selectedItems.reduce((s, it) => s + it.qty * getUnitPrice(), 0);
      if (totalQty === 0) { el.innerHTML = ''; return; }
      const pricing = getPricing(currentProduct);
      const sum = sub + pricing.shippingFee;
      el.innerHTML = `
        상품: ${sub.toLocaleString()}원<br>
        배송비: ${pricing.shippingLabel}${pricing.shippingMethod ? ` (${pricing.shippingMethod})` : ''}<br>
        <span style="font-size:17px;">합계: ${sum.toLocaleString()}원</span>
      `;
    }

    async function shareProduct(p) {
      const url = `${location.origin}${location.pathname}?id=${p.id}`;
      const shareData = { title: p.name, url };
      if (navigator.share) { try { await navigator.share(shareData); } catch (e) {} }
      else {
        try { await navigator.clipboard.writeText(url); alert('✅ 상품 링크가 복사되었습니다.\n' + url); }
        catch (e) { prompt('아래 링크를 복사하세요:', url); }
      }
    }

    function handleOrder(mode) {
      const p = currentProduct;
      if (!p) return;
      if (shouldHidePrice(p)) { alert('로그인 후 이용 가능합니다.'); return; }
      if (selectedItems.length === 0) { alert('옵션을 선택해주세요.'); return; }
      const totalQty = selectedItems.reduce((s, it) => s + it.qty, 0);
      const pricing = getPricing(p);
      const unitPrice = pricing.finalPrice;

      if (mode === 'cart') {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let merged = 0, added = 0;
        selectedItems.forEach(sel => {
          const dupIdx = cart.findIndex(it => it.product_id === p.id && it.selected_color === sel.color && it.selected_size === sel.size && it.selected_hem === sel.hem && it.selected_other === sel.other);
          if (dupIdx >= 0) { cart[dupIdx].quantity += sel.qty; merged++; }
          else {
            cart.push({
              product_id: p.id,
              product_code: p.product_code || '',
              product_name: p.name,
              original_price: Number(p.price),
              product_price: unitPrice,
              target_grade: pricing.targetGrade,
              discount_rate: pricing.discountRate,
              min_qty: Number(p.min_qty) || 1,
              main_image: p.main_image,
              quantity: sel.qty,
              selected_color: sel.color, selected_size: sel.size, selected_hem: sel.hem, selected_other: sel.other,
            });
            added++;
          }
        });
        localStorage.setItem('cart', JSON.stringify(cart));

        if (isLoggedInMember()) {
          pushCartToServer(cart);
        }

        let msg = '✅ 장바구니에 담았습니다!';
        if (merged > 0) msg = `✅ 장바구니에 추가되었습니다.\n(중복 ${merged}개 옵션은 수량이 합산됨)`;
        alert(msg);
        if (document.getElementById('app-header')) renderHeader('product');
        selectedItems = [];
        renderSelectedItems();
        return;
      }

      if (MIN_QTY > 1 && totalQty < MIN_QTY) {
        alert(`최소 주문수량은 ${MIN_QTY}개입니다.\n(다른 옵션 및 디자인과 자유롭게 교차/혼합 구매가능)\n현재: ${totalQty}개`);
        return;
      }

      const items = selectedItems.map(sel => ({
        product_id: p.id,
        product_code: p.product_code || '',
        product_name: p.name,
        product_price: unitPrice,
        original_price: Number(p.price),
        target_grade: pricing.targetGrade,
        discount_rate: pricing.discountRate,
        min_qty: Number(p.min_qty) || 1,
        quantity: sel.qty,
        selected_color: sel.color, selected_size: sel.size, selected_hem: sel.hem, selected_other: sel.other,
      }));
      showCheckoutModal(items);
    }

    async function loadUsableCoupons() {
      const m = getMember();
      if (!m || !m.id) return [];
      try {
        const { data, error } = await db
          .from('coupons')
          .select('*')
          .eq('member_id', m.id)
          .eq('is_used', false)
          .gte('expires_at', new Date().toISOString())
          .order('created_at', { ascending: false });
        if (error) return [];
        return data || [];
      } catch { return []; }
    }

    async function showCheckoutModal(items) {
      const subTotal = items.reduce((s, it) => s + it.product_price * it.quantity, 0);
      const pricing = getPricing(currentProduct);
      const shippingFee = pricing.shippingFee;

      const m = getMember();

      // ⭐⭐⭐ 도매전용 상품이면 쿠폰 사용 불가 ⭐⭐⭐
      const isWholesale = isWholesaleProduct(currentProduct);
      const coupons = isWholesale ? [] : await loadUsableCoupons();

      const inputStyle = 'width:100%; padding:10px 12px; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:8px; color:#e5e7eb; font-family:inherit; font-size:14px; box-sizing:border-box;';
      const labelStyle = 'font-size:13px; font-weight:600; color:#ccc; display:block; margin-bottom:4px;';

      const modal = document.createElement('div');
      modal.className = 'checkout-modal-backdrop';

      // ⭐ 쿠폰 섹션 HTML
      let couponSectionHtml = '';
      if (isWholesale) {
        couponSectionHtml = `
          <div class="coupon-disabled-notice">
            🏭 도매전용 상품은 쿠폰 사용이 불가합니다.
          </div>
        `;
      } else if (coupons.length > 0) {
        couponSectionHtml = `
          <div class="coupon-picker">
            <div class="cp-title">🎟️ 쿠폰 사용</div>
            <select id="coupon-select">
              <option value="">쿠폰 선택 안 함</option>
              ${coupons.map(c => {
                const label = c.type === 'percent'
                  ? `${c.discount_value}% 할인`
                  : `${Number(c.discount_value).toLocaleString()}원 할인`;
                return `<option value="${c.id}" data-type="${c.type}" data-value="${c.discount_value}">${label} (${c.code})</option>`;
              }).join('')}
            </select>
          </div>
        `;
      }

      modal.innerHTML = `
        <div class="checkout-modal-box">
          <h2>주문 정보 입력</h2>
          <form id="checkout-form" class="checkout-form">
            <label style="${labelStyle}">주문자 이름 *</label>
            <input name="customer_name" required value="${m?.name || ''}" style="${inputStyle}">
            <label style="${labelStyle}">연락처 *</label>
            <input name="customer_phone" type="tel" inputmode="numeric" required value="${m?.phone || ''}" style="${inputStyle}">
            <label style="${labelStyle}">우편번호</label>
            <input name="postcode" value="${m?.postcode || ''}" style="${inputStyle}">
            <label style="${labelStyle}">주소 *</label>
            <input name="address" required value="${m?.address || ''}" style="${inputStyle}">
            <label style="${labelStyle}">상세주소</label>
            <input name="address_detail" value="${m?.address_detail || ''}" style="${inputStyle}">
            <label style="${labelStyle}">입금자명 *</label>
            <input name="depositor_name" required style="${inputStyle}">
            <label style="${labelStyle}">요청사항</label>
            <textarea name="memo" style="${inputStyle} min-height:60px;"></textarea>

            ${couponSectionHtml}

            <div id="price-summary" style="text-align:right; font-size:14px; font-weight:600; color:#ef4444; line-height:1.7; margin-top:8px;">
              <div>상품: <b id="p-subtotal">${subTotal.toLocaleString()}</b>원</div>
              <div id="p-discount-row" style="display:none;">쿠폰 할인: <b id="p-discount">0</b>원</div>
              <div>배송비: <b>${pricing.shippingLabel}${pricing.shippingMethod ? ` (${pricing.shippingMethod})` : ''}</b></div>
              <div style="font-size:17px;">총액: <b id="p-total">${(subTotal + shippingFee).toLocaleString()}</b>원</div>
            </div>

            <button type="submit" style="padding:12px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-family:inherit; font-size:15px;">주문 완료</button>
            <button type="button" id="close-modal" style="padding:10px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-family:inherit; font-size:14px;">취소</button>
          </form>
        </div>
      `;
      document.body.appendChild(modal);

      const prevBodyOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      const closeModal = () => {
        document.body.style.overflow = prevBodyOverflow;
        modal.remove();
      };
      modal.querySelector('#close-modal').onclick = closeModal;

      const couponSelect = modal.querySelector('#coupon-select');

      function calcDiscount(sub, type, value) {
        if (type === 'percent') return Math.floor(sub * (Number(value) / 100));
        if (type === 'fixed') return Math.min(sub, Number(value));
        return 0;
      }

      function updatePriceUI() {
        let discount = 0;
        if (couponSelect && couponSelect.value) {
          const opt = couponSelect.selectedOptions[0];
          discount = calcDiscount(subTotal, opt.dataset.type, Number(opt.dataset.value));
        }
        const finalTotal = Math.max(0, subTotal - discount) + shippingFee;
        modal.querySelector('#p-discount-row').style.display = discount > 0 ? 'block' : 'none';
        modal.querySelector('#p-discount').textContent = discount.toLocaleString();
        modal.querySelector('#p-total').textContent = finalTotal.toLocaleString();
      }

      if (couponSelect) {
        couponSelect.addEventListener('change', updatePriceUI);
        updatePriceUI();
      }

      modal.querySelector('#checkout-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;

        let couponIdToUse = null;
        let discountAmount = 0;
        // ⭐ 도매전용이면 couponSelect가 없으므로 자동으로 쿠폰 미사용
        if (couponSelect && couponSelect.value) {
          const opt = couponSelect.selectedOptions[0];
          couponIdToUse = couponSelect.value;
          discountAmount = calcDiscount(subTotal, opt.dataset.type, Number(opt.dataset.value));
        }
        const finalTotal = Math.max(0, subTotal - discountAmount) + shippingFee;

        const orderNumber = generateOrderNumber();
        const rows = items.map((it, idx) => ({
          order_number: orderNumber,
          product_id: it.product_id,
          product_code: it.product_code,
          product_name: it.product_name,
          product_price: it.product_price,
          quantity: it.quantity,
          total_price: idx === 0
            ? Math.max(0, it.product_price * it.quantity - discountAmount) + shippingFee
            : it.product_price * it.quantity,
          customer_name: f.customer_name.value.trim(),
          customer_phone: f.customer_phone.value.trim(),
          depositor_name: f.depositor_name.value.trim(),
          memo: f.memo.value.trim(),
          address: f.address.value.trim(),
          address_detail: f.address_detail.value.trim(),
          postcode: f.postcode.value.trim(),
          selected_color: it.selected_color,
          selected_size: it.selected_size,
          selected_hem: it.selected_hem,
          selected_other: it.selected_other,
          shipping_fee: idx === 0 ? shippingFee : 0,
          grade_discount: it.discount_rate || 0,
          status: '입금대기',
        }));
        const { error } = await db.from('orders').insert(rows);
        if (error) { alert('❌ 주문 실패: ' + error.message); return; }

        if (couponIdToUse) {
          try {
            await db.from('coupons').update({
              is_used: true,
              used_at: new Date().toISOString(),
              used_order_number: orderNumber,
            }).eq('id', couponIdToUse);
          } catch (couponErr) {
            console.warn('쿠폰 사용 처리 실패:', couponErr);
          }
        }

        showOrderComplete(modal, orderNumber, finalTotal, closeModal);
        selectedItems = [];
        renderSelectedItems();
      });
    }

    function generateOrderNumber() {
      const d = new Date();
      const parts = new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        year: '2-digit', month: '2-digit', day: '2-digit',
      }).formatToParts(d);
      const get = (t) => parts.find(p => p.type === t)?.value || '00';
      const ymd = get('year') + get('month') + get('day');
      return `ORD-${ymd}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
    }

    function showOrderComplete(modal, orderNumber, total, closeModal) {
      const box = modal.querySelector('.checkout-modal-box');
      const acc = cachedAccount;
      const hasAccount = acc.bank || acc.number || acc.holder;
      const accountHtml = hasAccount ? `
        <b>입금 계좌 안내</b><br>
        ${acc.bank ? `은행: <b>${acc.bank}</b><br>` : ''}
        ${acc.number ? `계좌: <b>${acc.number}</b>
          <button id="copy-account" style="margin-left:6px; padding:3px 8px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-size:11px; font-family:inherit;">복사</button><br>` : ''}
        ${acc.holder ? `예금주: <b>${acc.holder}</b><br>` : ''}
        입금액: <b>${total.toLocaleString()}원</b>
      ` : `<b>입금 계좌 안내</b><br><span style="color:#888;">관리자가 계좌 정보를 등록하지 않았습니다.</span><br>입금액: <b>${total.toLocaleString()}원</b>`;

      box.innerHTML = `
        <h2 style="margin-bottom:16px; color:#10b981;">✅ 주문 접수 완료</h2>
        <div style="background:#0f0f0f; padding:16px; border-radius:8px; margin-bottom:16px; line-height:1.8; font-size:14px; border:1px solid #222;">
          <div style="font-size:13px; color:#888;">주문번호</div>
          <div style="font-size:18px; font-weight:700; color:#60a5fa; margin-bottom:8px; letter-spacing:1px; display:flex; align-items:center; flex-wrap:wrap; gap:6px;">
            <span id="order-number-text">${orderNumber}</span>
            <button id="copy-order-number" style="padding:3px 8px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-size:11px; font-family:inherit;">복사</button>
          </div>
          <hr style="border:0; border-top:1px solid #222; margin:8px 0;">
          ${accountHtml}
        </div>
        <p style="font-size:12px; color:#666; margin-bottom:16px;">주문번호를 꼭 저장해두세요.</p>
        <button id="go-main" style="width:100%; padding:12px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-family:inherit;">메인으로</button>
      `;
      box.querySelector('#copy-order-number').onclick = () => { navigator.clipboard.writeText(orderNumber).then(() => alert('주문번호가 복사되었습니다.')); };
      const copyAccBtn = box.querySelector('#copy-account');
      if (copyAccBtn) {
        copyAccBtn.onclick = () => { navigator.clipboard.writeText(acc.number).then(() => alert('계좌번호가 복사되었습니다.')); };
      }
      box.querySelector('#go-main').onclick = () => { closeModal(); location.href = 'index.html'; };
    }

    loadProduct();
  </script>
</body>
</html>
