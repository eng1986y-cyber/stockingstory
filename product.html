<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>상품 상세 - Simple life' StockingStory</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }

    .checkout-modal-backdrop { position: fixed !important; top: 0; left: 0; right: 0; bottom: 0; width: 100vw !important; height: 100vh !important; height: 100dvh !important; background: rgba(0,0,0,.8); z-index: 999999 !important; display: flex !important; align-items: flex-start !important; justify-content: center !important; padding: 10px !important; overflow-y: auto !important; -webkit-overflow-scrolling: touch; box-sizing: border-box; }
    .checkout-modal-box { background: #151515; border: 1px solid #222; padding: 20px 16px; border-radius: 12px; width: 100% !important; max-width: 460px !important; margin: 20px auto !important; color: #e5e7eb; box-sizing: border-box; position: relative; }
    .checkout-modal-box .checkout-form { display: grid !important; gap: 10px !important; background: none !important; padding: 0 !important; border: 0 !important; max-width: none !important; width: 100% !important; }
    .checkout-modal-box h2 { margin: 0 0 16px !important; font-size: 18px !important; color: #fff !important; }
    @media (max-width: 768px) {
      .checkout-modal-backdrop { align-items: flex-start !important; padding: 0 !important; padding-top: 10px !important; padding-bottom: 10px !important; }
      .checkout-modal-box { margin: 0 auto !important; border-radius: 8px !important; max-height: none !important; }
    }

    /* ⭐ 쿠폰 선택 UI */
    .coupon-picker {
      background: #0f0f0f; border: 1px solid #2a2a2a;
      border-radius: 8px; padding: 12px;
      margin-top: 8px;
    }
    .coupon-picker .cp-title {
      font-size: 13px; font-weight: 700; color: #fbbf24;
      margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    .coupon-picker select {
      width: 100%; padding: 10px 12px;
      background: #151515; border: 1px solid #333;
      border-radius: 6px; color: #e5e7eb;
      font-family: inherit; font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="app-header"></div>
  <main id="product-detail" style="color:#e5e7eb;">로딩중...</main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    let MIN_QTY = 6;
    let currentProduct = null;
    let globalShipping = 0;
    let selectedItems = [];

    function isLoggedIn() {
      try { const m = JSON.parse(localStorage.getItem('member') || 'null'); return !!(m && m.id); }
      catch { return false; }
    }
    function isNewProduct(product) {
      if (!product || !product.created_at) return false;
      const created = new Date(product.created_at).getTime();
      if (isNaN(created)) return false;
      return (Date.now() - created) < 7 * 24 * 60 * 60 * 1000;
    }
    function shouldHidePrice(product) { return !isLoggedIn() && isNewProduct(product); }
    function getMember() { try { return JSON.parse(localStorage.getItem('member') || 'null'); } catch { return null; } }

    async function loadShippingFee() {
      const { data } = await db.from('settings').select('value').eq('key', 'shipping_fee').maybeSingle();
      globalShipping = data ? Number(data.value) || 0 : 0;
    }

    async function loadProduct() {
      const detailEl = document.getElementById('product-detail');
      if (!id) { detailEl.innerHTML = '<p>상품 ID가 없습니다.</p>'; return; }
      await loadShippingFee();
      const { data, error } = await db.from('products').select('*').eq('id', id).single();
      if (error || !data) { detailEl.innerHTML = '<p>상품이 없습니다.</p>'; return; }

      currentProduct = data;
      MIN_QTY = Number(data.min_qty) || 1;

      const hidePrice = shouldHidePrice(data);
      const isNew = isNewProduct(data);

      const detailImgs = (data.detail_images || []).map(url => `<img src="${url}" alt="상세" loading="lazy" style="width:100%; display:block; margin-top:8px; border-radius:8px;">`).join('');
      const shippingLabel = globalShipping > 0 ? `<span style="color:#888;">배송비 ${globalShipping.toLocaleString()}원</span>` : `<span style="color:#10b981;">무료배송</span>`;
      const colors = data.colors || [], sizes = data.sizes || [], hemOptions = data.hem_option || [], otherOptions = data.other_option || [];

      function buildSelect(name, label, options) {
        if (!options.length) return '';
        return `
          <div>
            <label style="font-size:13px; font-weight:600; color:#ccc; display:block; margin-bottom:4px;">${label}</label>
            <select data-opt-name="${name}" style="width:100%; padding:10px 12px; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:8px; color:#e5e7eb; font-family:inherit; font-size:14px;">
              <option value="">${label} 선택</option>
              ${options.map(o => `<option value="${o}">${o}</option>`).join('')}
            </select>
          </div>
        `;
      }

      const row1 = (colors.length || sizes.length) ? `
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
          ${buildSelect('color', '색상', colors)}
          ${buildSelect('size', '사이즈', sizes)}
        </div>
      ` : '';
      const row2 = (hemOptions.length || otherOptions.length) ? `
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
          ${buildSelect('hem', '밑단선택', hemOptions)}
          ${buildSelect('other', '기타옵션', otherOptions)}
        </div>
      ` : '';

      const shareBtn = `<button id="share-btn" style="padding:8px 12px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit;">🔗 공유</button>`;
      const minQtyNotice = MIN_QTY > 1 ? `<div style="margin-top:12px; padding:10px 12px; background:#1a1a1a; border:1px solid #333; border-radius:8px; font-size:12px; color:#f59e0b; line-height:1.6;">⚠️ 최소 주문 수량은 <b>${MIN_QTY}개</b>입니다. 옵션 및 기타 제품을 추가해주시기 바랍니다.</div>` : '';
      const newBadge = isNew ? `<span style="display:inline-block; margin-left:8px; background:#e53935; color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:4px; vertical-align:middle;">NEW</span>` : '';

      const priceHtml = hidePrice
        ? `<div style="background:#1a1a1a; border:1px solid #333; border-radius:8px; padding:14px 16px; margin:0 0 16px; display:flex; align-items:center; gap:10px;">
             <span style="font-size:24px;">🔒</span>
             <div>
               <div style="color:#e5e7eb; font-weight:700; font-size:15px;">로그인 후 가격 확인 가능</div>
               <div style="color:#9ca3af; font-size:12px; margin-top:2px;">신상품은 등록 후 7일간 회원에게만 가격이 공개됩니다.</div>
               <a href="login.html" style="display:inline-block; margin-top:8px; padding:6px 12px; background:#e5e7eb; color:#111; text-decoration:none; border-radius:6px; font-size:13px; font-weight:600;">로그인 하기 →</a>
             </div>
           </div>`
        : `<p style="color:#ef4444; font-weight:700; font-size:24px; margin:0 0 8px;">${Number(data.price).toLocaleString()}원</p>`;

      detailEl.innerHTML = `
        <div style="background:#151515; border:1px solid #222; border-radius:12px; padding:16px;">
          <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:stretch;">
            <div style="flex:1 1 320px; min-width:0;">
              <img src="${data.main_image}" alt="${data.name}" style="width:100%; border-radius:8px; display:block;">
            </div>
            <div style="flex:1 1 320px; min-width:0; display:flex; flex-direction:column; justify-content:space-between;">
              <div>
                ${data.product_code ? `<div style="color:#666; font-size:12px; margin-bottom:4px;">제품번호: ${data.product_code}</div>` : ''}
                <div style="display:flex; justify-content:space-between; align-items:start; gap:8px;">
                  <h2 style="margin:0 0 12px; font-size:22px; color:#fff; flex:1;">${data.name}${newBadge}</h2>
                  ${shareBtn}
                </div>
                ${priceHtml}
                <p style="margin:0 0 16px;">${shippingLabel}</p>
                ${minQtyNotice}
                ${hidePrice ? '' : `
                  <div style="margin-top:12px; font-size:13px; font-weight:600; color:#fff; margin-bottom:8px;">옵션 선택 (필수) <span style="color:#ef4444;">*</span></div>
                  ${row1}
                  ${row2}
                  <div id="selected-items" style="margin-top:12px;"></div>
                `}
              </div>
              ${hidePrice ? '' : `
                <div style="margin-top:20px;">
                  <div id="total-preview" style="text-align:right; font-size:14px; font-weight:600; color:#ef4444; line-height:1.6; margin-bottom:16px;"></div>
                  <div style="display:flex; gap:8px;">
                    <button id="cart-btn" style="flex:1; padding:14px; background:#1a1a1a; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-weight:600; font-size:15px; font-family:inherit;">장바구니</button>
                    <button id="buy-btn" style="flex:1; padding:14px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-size:15px; font-family:inherit;">바로 구매</button>
                  </div>
                </div>
              `}
              ${hidePrice ? `
                <div style="margin-top:20px; padding:14px; background:#1a1a1a; color:#666; border:1px dashed #333; border-radius:8px; font-weight:600; font-size:14px; text-align:center;">
                  🔒 로그인 후 구매 가능
                </div>
              ` : ''}
            </div>
          </div>
        </div>
        ${detailImgs ? `<div style="margin-top:16px;">${detailImgs}</div>` : ''}
      `;

      const shareEl = document.getElementById('share-btn');
      if (shareEl) shareEl.onclick = () => shareProduct(data);

      if (!hidePrice) {
        detailEl.querySelectorAll('select[data-opt-name]').forEach(sel => {
          sel.addEventListener('change', () => handleOptionChange());
        });
        document.getElementById('cart-btn').addEventListener('click', () => handleOrder('cart'));
        document.getElementById('buy-btn').addEventListener('click', () => handleOrder('single'));
        renderSelectedItems();
      }
    }

    function handleOptionChange() {
      const detailEl = document.getElementById('product-detail');
      const selects = detailEl.querySelectorAll('select[data-opt-name]');
      const vals = {};
      selects.forEach(s => { vals[s.dataset.optName] = s.value; });
      const anySelected = Object.values(vals).some(v => v);
      if (!anySelected) return;
      const allRequired = Array.from(selects).every(s => s.value);
      if (!allRequired) return;
      const item = { color: vals.color || null, size: vals.size || null, hem: vals.hem || null, other: vals.other || null, qty: 1 };
      const dupIdx = selectedItems.findIndex(it => it.color === item.color && it.size === item.size && it.hem === item.hem && it.other === item.other);
      if (dupIdx >= 0) selectedItems[dupIdx].qty += 1;
      else selectedItems.push(item);
      selects.forEach(s => { s.value = ''; });
      renderSelectedItems();
    }

    function renderSelectedItems() {
      const el = document.getElementById('selected-items');
      if (!el) return;
      if (selectedItems.length === 0) { el.innerHTML = ''; updateTotalPreview(); return; }
      el.innerHTML = `
        <div style="background:#0f0f0f; border:1px solid #222; border-radius:8px; overflow:hidden;">
          ${selectedItems.map((it, idx) => {
            const opts = [];
            if (it.color) opts.push(it.color);
            if (it.size) opts.push(it.size);
            if (it.hem) opts.push(it.hem);
            if (it.other) opts.push(it.other);
            const label = opts.length ? opts.join(' / ') : '기본';
            const lineTotal = it.qty * currentProduct.price;
            return `
              <div style="padding:12px; ${idx > 0 ? 'border-top:1px solid #222;' : ''}">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                  <span style="font-size:14px; color:#e5e7eb; font-weight:500;">${label}</span>
                  <button class="item-del" data-idx="${idx}" style="background:none; border:0; color:#888; cursor:pointer; font-size:16px; padding:0; line-height:1;">✕</button>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="display:inline-flex; align-items:center; border:1px solid #333; border-radius:4px; overflow:hidden; background:#151515;">
                    <button class="qty-minus" data-idx="${idx}" style="width:32px; height:32px; background:none; color:#e5e7eb; border:0; cursor:pointer; font-size:16px; font-weight:700; font-family:inherit;">−</button>
                    <input type="number" class="qty-input-item" data-idx="${idx}" value="${it.qty}" min="1" style="width:44px; padding:0; background:none; border:0; color:#e5e7eb; text-align:center; font-family:inherit; height:32px; border-left:1px solid #333; border-right:1px solid #333;">
                    <button class="qty-plus" data-idx="${idx}" style="width:32px; height:32px; background:none; color:#e5e7eb; border:0; cursor:pointer; font-size:16px; font-weight:700; font-family:inherit;">+</button>
                  </div>
                  <span style="font-size:15px; font-weight:700; color:#fff;">${lineTotal.toLocaleString()}원</span>
                </div>
              </div>
            `;
          }).join('')}
          <div style="padding:12px; background:#151515; border-top:1px solid #222; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:14px; color:#ccc;">총 <b style="color:#e5e7eb;">${selectedItems.reduce((s, it) => s + it.qty, 0)}개</b></span>
            <span style="font-size:16px; font-weight:700;">총 금액 <b style="color:#ef4444;">${selectedItems.reduce((s, it) => s + it.qty * currentProduct.price, 0).toLocaleString()}원</b></span>
          </div>
        </div>
      `;
      el.querySelectorAll('.item-del').forEach(btn => {
        btn.addEventListener('click', () => { selectedItems.splice(Number(btn.dataset.idx), 1); renderSelectedItems(); });
      });
      el.querySelectorAll('.qty-minus').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.idx);
          if (selectedItems[idx].qty > 1) { selectedItems[idx].qty--; renderSelectedItems(); }
        });
      });
      el.querySelectorAll('.qty-plus').forEach(btn => {
        btn.addEventListener('click', () => { selectedItems[Number(btn.dataset.idx)].qty++; renderSelectedItems(); });
      });
      el.querySelectorAll('.qty-input-item').forEach(inp => {
        inp.addEventListener('change', () => {
          const idx = Number(inp.dataset.idx);
          selectedItems[idx].qty = Math.max(1, Number(inp.value) || 1);
          renderSelectedItems();
        });
      });
      updateTotalPreview();
    }

    function updateTotalPreview() {
      const el = document.getElementById('total-preview');
      if (!el) return;
      const totalQty = selectedItems.reduce((s, it) => s + it.qty, 0);
      const sub = selectedItems.reduce((s, it) => s + it.qty * currentProduct.price, 0);
      if (totalQty === 0) { el.innerHTML = ''; return; }
      const sum = sub + globalShipping;
      el.innerHTML = `
        상품: ${sub.toLocaleString()}원<br>
        배송비: ${globalShipping > 0 ? globalShipping.toLocaleString() + '원' : '무료'}<br>
        <span style="font-size:17px;">합계: ${sum.toLocaleString()}원</span>
      `;
    }

    async function shareProduct(p) {
      const url = `${location.origin}${location.pathname}?id=${p.id}`;
      const shareData = { title: p.name, url };
      if (navigator.share) { try { await navigator.share(shareData); } catch (e) {} }
      else {
        try { await navigator.clipboard.writeText(url); alert('✅ 상품 링크가 복사되었습니다.\n' + url); }
        catch (e) { prompt('아래 링크를 복사하세요:', url); }
      }
    }

    function handleOrder(mode) {
      const p = currentProduct;
      if (!p) return;
      if (shouldHidePrice(p)) { alert('로그인 후 이용 가능합니다.'); return; }
      if (selectedItems.length === 0) { alert('옵션을 선택해주세요.'); return; }
      const totalQty = selectedItems.reduce((s, it) => s + it.qty, 0);
      if (mode === 'cart') {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let merged = 0, added = 0;
        selectedItems.forEach(sel => {
          const dupIdx = cart.findIndex(it => it.product_id === p.id && it.selected_color === sel.color && it.selected_size === sel.size && it.selected_hem === sel.hem && it.selected_other === sel.other);
          if (dupIdx >= 0) { cart[dupIdx].quantity += sel.qty; merged++; }
          else {
            cart.push({
              product_id: p.id, product_code: p.product_code || '', product_name: p.name,
              product_price: p.price, main_image: p.main_image, quantity: sel.qty,
              selected_color: sel.color, selected_size: sel.size, selected_hem: sel.hem, selected_other: sel.other,
            });
            added++;
          }
        });
        localStorage.setItem('cart', JSON.stringify(cart));
        let msg = '✅ 장바구니에 담았습니다!';
        if (merged > 0) msg = `✅ 장바구니에 추가되었습니다.\n(중복 ${merged}개 옵션은 수량이 합산됨)`;
        alert(msg);
        if (document.getElementById('app-header')) renderHeader('product');
        selectedItems = [];
        renderSelectedItems();
        return;
      }
      if (MIN_QTY > 1 && totalQty < MIN_QTY) {
        alert(`구매가능최소수량은 ${MIN_QTY}개입니다. 기타옵션 및 기타제품 추가해주시기 바랍니다.\n(현재: ${totalQty}개)`);
        return;
      }
      const items = selectedItems.map(sel => ({
        product_id: p.id, product_code: p.product_code || '', product_name: p.name,
        product_price: p.price, quantity: sel.qty,
        selected_color: sel.color, selected_size: sel.size, selected_hem: sel.hem, selected_other: sel.other,
      }));
      showCheckoutModal(items);
    }

    async function loadUsableCoupons() {
      const m = getMember();
      if (!m || !m.id) return [];
      try {
        const { data, error } = await db
          .from('coupons')
          .select('*')
          .eq('member_id', m.id)
          .eq('is_used', false)
          .gte('expires_at', new Date().toISOString())
          .order('created_at', { ascending: false });
        if (error) return [];
        return data || [];
      } catch { return []; }
    }

    async function showCheckoutModal(items) {
      const subTotal = items.reduce((s, it) => s + it.product_price * it.quantity, 0);
      const m = getMember();
      const coupons = await loadUsableCoupons();
      const inputStyle = 'width:100%; padding:10px 12px; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:8px; color:#e5e7eb; font-family:inherit; font-size:14px; box-sizing:border-box;';
      const labelStyle = 'font-size:13px; font-weight:600; color:#ccc; display:block; margin-bottom:4px;';

      const modal = document.createElement('div');
      modal.className = 'checkout-modal-backdrop';
      modal.innerHTML = `
        <div class="checkout-modal-box">
          <h2>주문 정보 입력</h2>
          <form id="checkout-form" class="checkout-form">
            <label style="${labelStyle}">주문자 이름 *</label>
            <input name="customer_name" required value="${m?.name || ''}" style="${inputStyle}">
            <label style="${labelStyle}">연락처 *</label>
            <input name="customer_phone" type="tel" inputmode="numeric" required value="${m?.phone || ''}" style="${inputStyle}">
            <label style="${labelStyle}">우편번호</label>
            <input name="postcode" value="${m?.postcode || ''}" style="${inputStyle}">
            <label style="${labelStyle}">주소 *</label>
            <input name="address" required value="${m?.address || ''}" style="${inputStyle}">
            <label style="${labelStyle}">상세주소</label>
            <input name="address_detail" value="${m?.address_detail || ''}" style="${inputStyle}">
            <label style="${labelStyle}">입금자명 *</label>
            <input name="depositor_name" required style="${inputStyle}">
            <label style="${labelStyle}">요청사항</label>
            <textarea name="memo" style="${inputStyle} min-height:60px;"></textarea>

            ${coupons.length > 0 ? `
              <div class="coupon-picker">
                <div class="cp-title">🎟️ 쿠폰 사용</div>
                <select id="coupon-select">
                  <option value="">쿠폰 선택 안 함</option>
                  ${coupons.map(c => {
                    const label = c.type === 'percent'
                      ? `${c.discount_value}% 할인`
                      : `${Number(c.discount_value).toLocaleString()}원 할인`;
                    return `<option value="${c.id}" data-type="${c.type}" data-value="${c.discount_value}">${label} (${c.code})</option>`;
                  }).join('')}
                </select>
              </div>
            ` : ''}

            <div id="price-summary" style="text-align:right; font-size:14px; font-weight:600; color:#ef4444; line-height:1.7; margin-top:8px;">
              <div>상품: <b id="p-subtotal">${subTotal.toLocaleString()}</b>원</div>
              <div id="p-discount-row" style="display:none;">쿠폰 할인: <b id="p-discount">0</b>원</div>
              <div>배송비: <b>${globalShipping > 0 ? globalShipping.toLocaleString() + '원' : '무료'}</b></div>
              <div style="font-size:17px;">총액: <b id="p-total">${(subTotal + globalShipping).toLocaleString()}</b>원</div>
            </div>

            <button type="submit" style="padding:12px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-family:inherit; font-size:15px;">주문 완료</button>
            <button type="button" id="close-modal" style="padding:10px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-family:inherit; font-size:14px;">취소</button>
          </form>
        </div>
      `;
      document.body.appendChild(modal);

      const prevBodyOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      const closeModal = () => {
        document.body.style.overflow = prevBodyOverflow;
        modal.remove();
      };
      modal.querySelector('#close-modal').onclick = closeModal;

      const couponSelect = modal.querySelector('#coupon-select');

      function calcDiscount(sub, type, value) {
        if (type === 'percent') return Math.floor(sub * (Number(value) / 100));
        if (type === 'fixed') return Math.min(sub, Number(value));
        return 0;
      }

      function updatePriceUI() {
        let discount = 0;
        if (couponSelect && couponSelect.value) {
          const opt = couponSelect.selectedOptions[0];
          discount = calcDiscount(subTotal, opt.dataset.type, Number(opt.dataset.value));
        }
        const finalTotal = Math.max(0, subTotal - discount) + globalShipping;
        modal.querySelector('#p-discount-row').style.display = discount > 0 ? 'block' : 'none';
        modal.querySelector('#p-discount').textContent = discount.toLocaleString();
        modal.querySelector('#p-total').textContent = finalTotal.toLocaleString();
      }

      if (couponSelect) {
        couponSelect.addEventListener('change', updatePriceUI);
        updatePriceUI();
      }

      modal.querySelector('#checkout-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;

        let couponIdToUse = null;
        let discountAmount = 0;
        if (couponSelect && couponSelect.value) {
          const opt = couponSelect.selectedOptions[0];
          couponIdToUse = couponSelect.value;
          discountAmount = calcDiscount(subTotal, opt.dataset.type, Number(opt.dataset.value));
        }
        const finalTotal = Math.max(0, subTotal - discountAmount) + globalShipping;

        const orderNumber = generateOrderNumber();
        const rows = items.map((it, idx) => ({
          order_number: orderNumber, product_id: it.product_id, product_code: it.product_code,
          product_name: it.product_name, product_price: it.product_price, quantity: it.quantity,
          total_price: idx === 0 ? Math.max(0, it.product_price * it.quantity - discountAmount) + globalShipping : it.product_price * it.quantity,
          customer_name: f.customer_name.value.trim(), customer_phone: f.customer_phone.value.trim(),
          depositor_name: f.depositor_name.value.trim(), memo: f.memo.value.trim(),
          address: f.address.value.trim(), address_detail: f.address_detail.value.trim(), postcode: f.postcode.value.trim(),
          selected_color: it.selected_color, selected_size: it.selected_size,
          selected_hem: it.selected_hem, selected_other: it.selected_other,
          shipping_fee: idx === 0 ? globalShipping : 0, status: '입금대기',
        }));
        const { error } = await db.from('orders').insert(rows);
        if (error) { alert('❌ 주문 실패: ' + error.message); return; }

        if (couponIdToUse) {
          try {
            await db.from('coupons').update({
              is_used: true,
              used_at: new Date().toISOString(),
              used_order_number: orderNumber,
            }).eq('id', couponIdToUse);
          } catch (couponErr) {
            console.warn('쿠폰 사용 처리 실패:', couponErr);
          }
        }

        showOrderComplete(modal, orderNumber, finalTotal, closeModal);
        selectedItems = [];
        renderSelectedItems();
      });
    }

    function generateOrderNumber() {
      const d = new Date();
      const parts = new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        year: '2-digit', month: '2-digit', day: '2-digit',
      }).formatToParts(d);
      const get = (t) => parts.find(p => p.type === t)?.value || '00';
      const ymd = get('year') + get('month') + get('day');
      return `ORD-${ymd}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
    }

    function showOrderComplete(modal, orderNumber, total, closeModal) {
      const box = modal.querySelector('.checkout-modal-box');
      box.innerHTML = `
        <h2 style="margin-bottom:16px; color:#10b981;">✅ 주문 접수 완료</h2>
        <div style="background:#0f0f0f; padding:16px; border-radius:8px; margin-bottom:16px; line-height:1.8; font-size:14px; border:1px solid #222;">
          <div style="font-size:13px; color:#888;">주문번호</div>
          <div style="font-size:18px; font-weight:700; color:#60a5fa; margin-bottom:8px; letter-spacing:1px; display:flex; align-items:center; flex-wrap:wrap; gap:6px;">
            <span id="order-number-text">${orderNumber}</span>
            <button id="copy-order-number" style="padding:3px 8px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-size:11px; font-family:inherit;">복사</button>
          </div>
          <hr style="border:0; border-top:1px solid #222; margin:8px 0;">
          <b>입금 계좌 안내</b><br>
          은행: <b>○○은행</b><br>
          계좌: <b>123-456-789012</b>
          <button id="copy-account" style="margin-left:6px; padding:3px 8px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-size:11px; font-family:inherit;">복사</button>
          <br>예금주: <b>홍길동</b><br>
          입금액: <b>${total.toLocaleString()}원</b>
        </div>
        <p style="font-size:12px; color:#666; margin-bottom:16px;">주문번호를 꼭 저장해두세요.</p>
        <button id="go-main" style="width:100%; padding:12px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-family:inherit;">메인으로</button>
      `;
      box.querySelector('#copy-order-number').onclick = () => { navigator.clipboard.writeText(orderNumber).then(() => alert('주문번호가 복사되었습니다.')); };
      box.querySelector('#copy-account').onclick = () => { navigator.clipboard.writeText('123-456-789012').then(() => alert('계좌번호가 복사되었습니다.')); };
      box.querySelector('#go-main').onclick = () => { closeModal(); location.href = 'index.html'; };
    }

    loadProduct();
  </script>
</body>
</html>
