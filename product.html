<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>상품 상세 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <main id="product-detail" style="color:#e5e7eb;">로딩중...</main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    let MIN_QTY = 1;
    let currentProduct = null;
    let globalShipping = 0;
    let selectedItems = [];   // ⭐ 선택한 옵션 목록

    function getMember() {
      try { return JSON.parse(localStorage.getItem('member') || 'null'); }
      catch { return null; }
    }

    async function loadShippingFee() {
      const { data } = await db.from('settings').select('value').eq('key', 'shipping_fee').maybeSingle();
      globalShipping = data ? Number(data.value) || 0 : 0;
    }

    const inputStyle = 'width:100%; padding:10px 12px; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:8px; color:#e5e7eb; font-family:inherit; font-size:14px;';
    const labelStyle = 'font-size:13px; font-weight:600; color:#ccc; display:block; margin-bottom:4px;';

    async function loadProduct() {
      const detailEl = document.getElementById('product-detail');
      if (!id) { detailEl.innerHTML = '<p>상품 ID가 없습니다.</p>'; return; }
      await loadShippingFee();
      const { data, error } = await db.from('products').select('*').eq('id', id).single();
      if (error || !data) { detailEl.innerHTML = '<p>상품이 없습니다.</p>'; return; }

      currentProduct = data;
      MIN_QTY = Number(data.min_qty) || 1;

      const detailImgs = (data.detail_images || [])
        .map(url => `<img src="${url}" alt="상세" loading="lazy" style="width:100%; display:block; margin-top:8px; border-radius:8px;">`)
        .join('');

      const shippingLabel = globalShipping > 0
        ? `<span style="color:#888;">배송비 ${globalShipping.toLocaleString()}원</span>`
        : `<span style="color:#10b981;">무료배송</span>`;

      const colors = data.colors || [];
      const sizes = data.sizes || [];
      const hemOptions = data.hem_option || [];
      const otherOptions = data.other_option || [];

      const colorSel = colors.length ? `
        <div style="margin-bottom:8px;">
          <label style="${labelStyle}">색상</label>
          <select id="opt-color" style="${inputStyle}">
            <option value="">색상 선택</option>
            ${colors.map(c => `<option>${c}</option>`).join('')}
          </select>
        </div>
      ` : '';

      const sizeSel = sizes.length ? `
        <div style="margin-bottom:8px;">
          <label style="${labelStyle}">사이즈</label>
          <select id="opt-size" style="${inputStyle}">
            <option value="">사이즈 선택</option>
            ${sizes.map(s => `<option>${s}</option>`).join('')}
          </select>
        </div>
      ` : '';

      const hemSel = hemOptions.length ? `
        <div style="margin-bottom:8px;">
          <label style="${labelStyle}">밑단선택</label>
          <select id="opt-hem" style="${inputStyle}">
            <option value="">밑단선택</option>
            ${hemOptions.map(h => `<option>${h}</option>`).join('')}
          </select>
        </div>
      ` : '';

      const otherSel = otherOptions.length ? `
        <div style="margin-bottom:8px;">
          <label style="${labelStyle}">기타옵션</label>
          <select id="opt-other" style="${inputStyle}">
            <option value="">기타옵션</option>
            ${otherOptions.map(o => `<option>${o}</option>`).join('')}
          </select>
        </div>
      ` : '';

      const hasOptions = colors.length || sizes.length || hemOptions.length || otherOptions.length;

      // ⭐ 공유 버튼
      const shareBtn = `
        <button id="share-btn"
          style="padding:8px 12px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit;">
          🔗 공유
        </button>
      `;

      // ⭐ 옵션 선택 영역 (네이버 스타일)
      const optionBox = hasOptions ? `
        <div style="background:#0f0f0f; border:1px solid #222; border-radius:8px; padding:12px; margin-top:12px;">
          <div style="font-size:13px; font-weight:600; color:#fff; margin-bottom:8px;">옵션 선택</div>
          ${colorSel}${sizeSel}${hemSel}${otherSel}
          <button id="add-option-btn"
            style="width:100%; padding:10px; background:#1a1a1a; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px; font-family:inherit; margin-top:4px;">
            + 옵션 추가
          </button>
        </div>
        <div id="selected-items" style="margin-top:12px;"></div>
      ` : '';

      // ⭐ 최소수량 안내 (min_qty > 1 인 경우만)
      const minQtyNotice = MIN_QTY > 1 ? `
        <div style="margin-top:12px; padding:10px 12px; background:#1a1a1a; border:1px solid #333; border-radius:8px; font-size:12px; color:#f59e0b; line-height:1.6;">
          ⚠️ 최소 주문 수량은 <b>${MIN_QTY}개</b>입니다. 옵션 및 기타 제품을 추가해주시기 바랍니다.
        </div>
      ` : '';

      detailEl.innerHTML = `
        <div style="background:#151515; border:1px solid #222; border-radius:12px; padding:16px;">
          <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:stretch;">
            <div style="flex:1 1 320px; min-width:0;">
              <img src="${data.main_image}" alt="${data.name}"
                style="width:100%; border-radius:8px; display:block;">
            </div>
            <div style="flex:1 1 320px; min-width:0; display:flex; flex-direction:column; justify-content:space-between;">
              <div>
                ${data.product_code ? `<div style="color:#666; font-size:12px; margin-bottom:4px;">제품번호: ${data.product_code}</div>` : ''}
                <div style="display:flex; justify-content:space-between; align-items:start; gap:8px;">
                  <h2 style="margin:0 0 12px; font-size:22px; color:#fff; flex:1;">${data.name}</h2>
                  ${shareBtn}
                </div>
                <p style="color:#ef4444; font-weight:700; font-size:24px; margin:0 0 8px;">
                  ${Number(data.price).toLocaleString()}원
                </p>
                <p style="margin:0 0 16px;">${shippingLabel}</p>

                ${minQtyNotice}
                ${optionBox}
              </div>

              <div style="margin-top:20px;">
                <div id="total-preview" style="text-align:right; font-size:14px; font-weight:600; color:#ef4444; line-height:1.6; margin-bottom:16px;"></div>
                <div style="display:flex; gap:8px;">
                  <button id="cart-btn"
                    style="flex:1; padding:14px; background:#1a1a1a; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-weight:600; font-size:15px; font-family:inherit;">
                    장바구니
                  </button>
                  <button id="buy-btn"
                    style="flex:1; padding:14px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-size:15px; font-family:inherit;">
                    바로 구매
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        ${detailImgs ? `<div style="margin-top:16px;">${detailImgs}</div>` : ''}
      `;

      // 공유 버튼
      const shareEl = document.getElementById('share-btn');
      if (shareEl) {
        shareEl.onclick = () => shareProduct(data);
      }

      // 옵션 추가
      const addBtn = document.getElementById('add-option-btn');
      if (addBtn) {
        addBtn.onclick = () => {
          const color = document.getElementById('opt-color');
          const size = document.getElementById('opt-size');
          const hem = document.getElementById('opt-hem');
          const other = document.getElementById('opt-other');
          const colorV = color ? color.value : null;
          const sizeV = size ? size.value : null;
          const hemV = hem ? hem.value : null;
          const otherV = other ? other.value : null;

          // 아무것도 선택 안 하면 알림
          if (!colorV && !sizeV && !hemV && !otherV) {
            alert('옵션을 선택하세요.');
            return;
          }

          // 같은 옵션 중복 체크
          const dup = selectedItems.find(it =>
            it.color === colorV && it.size === sizeV && it.hem === hemV && it.other === otherV
          );
          if (dup) {
            alert('이미 추가된 옵션입니다.');
            return;
          }

          selectedItems.push({ color: colorV, size: sizeV, hem: hemV, other: otherV, qty: 1 });
          renderSelectedItems();

          // 선택 초기화
          if (color) color.value = '';
          if (size) size.value = '';
          if (hem) hem.value = '';
          if (other) other.value = '';
        };
      }

      document.getElementById('cart-btn').addEventListener('click', () => handleOrder('cart'));
      document.getElementById('buy-btn').addEventListener('click', () => handleOrder('single'));

      renderSelectedItems();
    }

    // ⭐ 선택된 옵션 리스트 렌더
    function renderSelectedItems() {
      const el = document.getElementById('selected-items');
      if (!el) return;

      if (selectedItems.length === 0) {
        el.innerHTML = '';
        updateTotalPreview();
        return;
      }

      el.innerHTML = selectedItems.map((it, idx) => {
        const opts = [];
        if (it.color) opts.push(it.color);
        if (it.size) opts.push(it.size);
        if (it.hem) opts.push(it.hem);
        if (it.other) opts.push(it.other);
        const label = opts.length ? opts.join(' / ') : '기본';

        return `
          <div style="background:#0f0f0f; border:1px solid #222; border-radius:8px; padding:10px 12px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
            <div style="font-size:13px; color:#e5e7eb; flex:1; min-width:100px;">
              ${label}
            </div>
            <div style="display:flex; align-items:center; gap:4px;">
              <button class="qty-minus" data-idx="${idx}"
                style="width:28px; height:28px; background:#1a1a1a; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-weight:700; font-size:14px; font-family:inherit;">
                −
              </button>
              <input type="number" class="qty-input-item" data-idx="${idx}" value="${it.qty}" min="1"
                style="width:48px; padding:4px; background:#0f0f0f; border:1px solid #2a2a2a; border-radius:4px; color:#e5e7eb; text-align:center; font-family:inherit;">
              <button class="qty-plus" data-idx="${idx}"
                style="width:28px; height:28px; background:#1a1a1a; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-weight:700; font-size:14px; font-family:inherit;">
                +
              </button>
              <button class="qty-del" data-idx="${idx}"
                style="width:28px; height:28px; background:#7f1d1d; color:#fff; border:0; border-radius:4px; cursor:pointer; font-weight:700; font-size:14px; font-family:inherit; margin-left:4px;">
                ×
              </button>
            </div>
          </div>
        `;
      }).join('');

      // 수량 +/-
      el.querySelectorAll('.qty-minus').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.idx);
          if (selectedItems[idx].qty > 1) selectedItems[idx].qty--;
          renderSelectedItems();
        });
      });
      el.querySelectorAll('.qty-plus').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.idx);
          selectedItems[idx].qty++;
          renderSelectedItems();
        });
      });
      el.querySelectorAll('.qty-input-item').forEach(inp => {
        inp.addEventListener('change', () => {
          const idx = Number(inp.dataset.idx);
          selectedItems[idx].qty = Math.max(1, Number(inp.value) || 1);
          renderSelectedItems();
        });
      });
      el.querySelectorAll('.qty-del').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedItems.splice(Number(btn.dataset.idx), 1);
          renderSelectedItems();
        });
      });

      updateTotalPreview();
    }

    function updateTotalPreview() {
      const el = document.getElementById('total-preview');
      if (!el) return;
      const totalQty = selectedItems.reduce((s, it) => s + it.qty, 0);
      const sub = selectedItems.reduce((s, it) => s + it.qty * currentProduct.price, 0);
      const sum = sub + globalShipping;

      if (totalQty === 0) {
        el.innerHTML = '';
        return;
      }

      el.innerHTML = `
        총 ${totalQty}개 · 상품: ${sub.toLocaleString()}원<br>
        배송비: ${globalShipping > 0 ? globalShipping.toLocaleString() + '원' : '무료'}<br>
        <span style="font-size:17px;">합계: ${sum.toLocaleString()}원</span>
      `;
    }

    // ⭐ 공유 기능
    async function shareProduct(p) {
      const url = `${location.origin}${location.pathname}?id=${p.id}`;
      const shareData = {
        title: p.name,
        text: `${p.name} - ${Number(p.price).toLocaleString()}원`,
        url: url,
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (e) {
          // 사용자가 취소한 경우 무시
        }
      } else {
        // 폴백: URL 복사
        try {
          await navigator.clipboard.writeText(url);
          alert('✅ 상품 링크가 복사되었습니다.\n' + url);
        } catch (e) {
          prompt('아래 링크를 복사하세요:', url);
        }
      }
    }

    // ⭐ 주문/장바구니 처리
    function handleOrder(mode) {
      const p = currentProduct;
      if (!p) return;

      if (selectedItems.length === 0) {
        if (MIN_QTY > 1) {
          alert(`구매가능최소수량은 ${MIN_QTY}개입니다. 기타옵션 및 기타제품 추가해주시기 바랍니다.`);
        } else {
          alert('옵션을 선택해주세요.');
        }
        return;
      }

      const totalQty = selectedItems.reduce((s, it) => s + it.qty, 0);

      // 최소 수량 체크 (min_qty > 1 인 경우만)
      if (MIN_QTY > 1 && totalQty < MIN_QTY) {
        alert(`구매가능최소수량은 ${MIN_QTY}개입니다. 기타옵션 및 기타제품 추가해주시기 바랍니다.`);
        return;
      }

      if (mode === 'cart') {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let addedCount = 0;
        let mergedCount = 0;

        selectedItems.forEach(sel => {
          const dupIdx = cart.findIndex(it =>
            it.product_id === p.id &&
            it.selected_color === sel.color &&
            it.selected_size === sel.size &&
            it.selected_hem === sel.hem &&
            it.selected_other === sel.other
          );

          if (dupIdx >= 0) {
            // ⭐ 중복이면 수량만 추가
            cart[dupIdx].quantity += sel.qty;
            mergedCount++;
          } else {
            cart.push({
              product_id: p.id,
              product_code: p.product_code || '',
              product_name: p.name,
              product_price: p.price,
              main_image: p.main_image,
              quantity: sel.qty,
              selected_color: sel.color,
              selected_size: sel.size,
              selected_hem: sel.hem,
              selected_other: sel.other,
            });
            addedCount++;
          }
        });

        localStorage.setItem('cart', JSON.stringify(cart));

        let msg = '✅ 장바구니에 담았습니다!';
        if (mergedCount > 0) msg = `✅ 장바구니에 추가되었습니다.\n(중복 ${mergedCount}개 옵션은 수량이 합산됨)`;
        alert(msg);

        if (document.getElementById('app-header')) renderHeader('product');
        selectedItems = [];
        renderSelectedItems();
        return;
      }

      // 바로 구매
      const items = selectedItems.map(sel => ({
        product_id: p.id,
        product_code: p.product_code || '',
        product_name: p.name,
        product_price: p.price,
        quantity: sel.qty,
        selected_color: sel.color,
        selected_size: sel.size,
        selected_hem: sel.hem,
        selected_other: sel.other,
      }));

      showCheckoutModal(items);
    }

    function showCheckoutModal(items) {
      const subTotal = items.reduce((s, it) => s + it.product_price * it.quantity, 0);
      const total = subTotal + globalShipping;
      const m = getMember();

      const modal = document.createElement('div');
      modal.style.cssText = `position:fixed; inset:0; background:rgba(0,0,0,.75); display:flex; align-items:center; justify-content:center; z-index:1000; padding:10px;`;
      modal.innerHTML = `
        <div style="background:#151515; border:1px solid #222; padding:24px; border-radius:12px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; color:#e5e7eb;">
          <h2 style="margin:0 0 16px; font-size:18px; color:#fff;">주문 정보 입력</h2>
          <form id="checkout-form" style="display:grid; gap:10px; background:none; padding:0; border:0; max-width:none;">
            <label style="${labelStyle}">주문자 이름 *</label>
            <input name="customer_name" required value="${m?.name || ''}" style="${inputStyle}">
            <label style="${labelStyle}">연락처 *</label>
            <input name="customer_phone" type="tel" inputmode="numeric" required value="${m?.phone || ''}" style="${inputStyle}">
            <label style="${labelStyle}">우편번호</label>
            <input name="postcode" value="${m?.postcode || ''}" style="${inputStyle}">
            <label style="${labelStyle}">주소 *</label>
            <input name="address" required value="${m?.address || ''}" style="${inputStyle}">
            <label style="${labelStyle}">상세주소</label>
            <input name="address_detail" value="${m?.address_detail || ''}" style="${inputStyle}">
            <label style="${labelStyle}">입금자명 *</label>
            <input name="depositor_name" required style="${inputStyle}">
            <label style="${labelStyle}">요청사항</label>
            <textarea name="memo" style="${inputStyle} min-height:60px;"></textarea>

            <div style="text-align:right; font-size:14px; font-weight:600; color:#ef4444; line-height:1.7; margin-top:8px;">
              상품: ${subTotal.toLocaleString()}원<br>
              배송비: ${globalShipping > 0 ? globalShipping.toLocaleString() + '원' : '무료'}<br>
              <span style="font-size:17px;">총액: ${total.toLocaleString()}원</span>
            </div>

            <button type="submit" style="padding:12px; background:#e5e7eb; color:#111; border:0; border-radius:8px; cursor:pointer; font-weight:600; font-family:inherit;">주문 완료</button>
            <button type="button" id="close-modal" style="padding:10px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:8px; cursor:pointer; font-family:inherit;">취소</button>
          </form>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('#close-modal').onclick = () => modal.remove();

      modal.querySelector('#checkout-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;
        const orderNumber = generateOrderNumber();

        const rows = items.map((it, idx) => ({
          order_number: orderNumber,
          product_id: it.product_id,
          product_code: it.product_code,
          product_name: it.product_name,
          product_price: it.product_price,
          quantity: it.quantity,
          total_price: idx === 0 ? it.product_price * it.quantity + globalShipping : it.product_price * it.quantity,
          customer_name: f.customer_name.value.trim(),
          customer_phone: f.customer_phone.value.trim(),
          depositor_name: f.depositor_name.value.trim(),
          memo: f.memo.value.trim(),
          address: f.address.value.trim(),
          address_detail: f.address_detail.value.trim(),
          postcode: f.postcode.value.trim(),
          selected_color: it.selected_color,
          selected_size: it.selected_size,
          selected_hem: it.selected_hem,
          selected_other: it.selected_other,
          shipping_fee: idx === 0 ? globalShipping : 0,
          status: '입금대기',
        }));

        const { error } = await db.from('orders').insert(rows);
        if (error) { alert('❌ 주문 실패: ' + error.message); return; }

        showOrderComplete(modal, orderNumber, total);
        selectedItems = [];
        renderSelectedItems();
      });
    }

    function generateOrderNumber() {
      const d = new Date();
      const ymd = d.getFullYear().toString().slice(-2) +
        String(d.getMonth()+1).padStart(2,'0') +
        String(d.getDate()).padStart(2,'0');
      const rand = Math.random().toString(36).slice(2,6).toUpperCase();
      return `ORD-${ymd}-${rand}`;
    }

    function showOrderComplete(modal, orderNumber, total) {
      modal.querySelector('div').innerHTML = `
        <h2 style="margin-bottom:16px; color:#10b981;">✅ 주문 접수 완료</h2>
        <div style="background:#0f0f0f; padding:16px; border-radius:8px; margin-bottom:16px; line-height:1.8; font-size:14px; border:1px solid #222;">
          <div style="font-size:13px; color:#888;">주문번호</div>
          <div style="font-size:18px; font-weight:700; color:#60a5fa; margin-bottom:8px; letter-spacing:1px; display:flex; align-items:center; flex-wrap:wrap; gap:6px;">
            <span id="order-number-text">${orderNumber}</span>
            <button id="copy-order-number" style="padding:3px 8px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-size:11px; font-family:inherit;">복사</button>
          </div>
          <hr style="border:0; border-top:1px solid #222; margin:8px 0;">
          <b>입금 계좌 안내</b><br>
          은행: <b>○○은행</b><br>
          계좌: <b>123-456-789012</b>
          <button id="copy-account" style="margin-left:6px; padding:3px 8px; background:#222; color:#e5e7eb; border:1px solid #333; border-radius:4px; cursor:pointer; font-size:11px; font-family:inherit;">복사</button>
          <br>예금주: <b>홍길동</b><br>
          입금액: <b>${total.toLocaleString()}원</b>
        </div>
        <p style="font-size:12px; color:#666; margin-bottom:16px;">

      `;
      modal.querySelector('#copy-order-number').onclick = () => {
        navigator.clipboard.writeText(orderNumber).then(() => alert('주문번호가 복사되었습니다.'));

      modal.querySelector('#copy-account').onclick = () => {
        navigator.clipboard.writeText('123-456-789012').then(() => alert('계좌번호가 복사되었습니다.'));
      };
    }
