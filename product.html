<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 상세 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><a href="index.html">🛍️ 심플몰</a></h1>
  </header>

  <main id="product-detail">로딩중...</main>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase 설정 (분리된 파일) -->
  <script>
  const db = supabase.createClient(
    "https://alpdhgcipjeekzrpxlbh.supabase.co",
    "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
  );
</script>

  <!-- 상세 로직 -->
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    async function loadProduct() {
      const detailEl = document.getElementById('product-detail');

      if (!id) {
        detailEl.innerHTML = '<p>상품 ID가 없습니다.</p>';
        return;
      }

      const { data, error } = await db
        .from('products')
        .select('*')
        .eq('id', id)
        .single();

      if (error || !data) {
        detailEl.innerHTML = '<p>상품이 없습니다.</p>';
        return;
      }

      const detailImgs = (data.detail_images || [])
        .map(url => `<img src="${url}" alt="상세" loading="lazy">`)
        .join('');

      detailEl.innerHTML = `
        <div class="detail-wrap">
          <img class="main-img" src="${data.main_image}" alt="${data.name}">
          <div class="info">
            <h2>${data.name}</h2>
            <p class="price">${Number(data.price).toLocaleString()}원</p>
            <p class="desc">${data.description || ''}</p>
            <button class="buy-btn" id="buy-btn">구매하기</button>
          </div>
        </div>
        <div class="detail-images">${detailImgs}</div>
      `;
    }

    loadProduct();

// ===== 무통장입금 주문 처리 =====
let currentProduct = null;

// 상품 정보 저장 (loadProduct에서)
const originalLoadProduct = loadProduct;
loadProduct = async function() {
  await originalLoadProduct();
};

// buy-btn 이벤트
document.addEventListener('click', (e) => {
  if (e.target.id === 'buy-btn') openOrderForm();
});

function openOrderForm() {
  // 현재 상품 정보 다시 조회
  db.from('products').select('*').eq('id', id).single().then(({ data }) => {
    if (!data) return alert('상품 정보를 불러올 수 없습니다.');
    currentProduct = data;
    showOrderModal(data);
  });
}

function showOrderModal(p) {
  const modal = document.createElement('div');
  modal.id = 'order-modal';
  modal.style.cssText = `
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; z-index:1000;
  `;
  modal.innerHTML = `
    <div style="background:#fff; padding:24px; border-radius:10px; width:90%; max-width:420px; max-height:90vh; overflow-y:auto;">
      <h2 style="margin-bottom:16px;">주문 정보 입력</h2>
      <p style="margin-bottom:12px; font-size:14px; color:#555;">
        <b>${p.name}</b><br>
        ${Number(p.price).toLocaleString()}원
      </p>
      <form id="order-form" style="display:grid; gap:10px;">
        <input name="customer_name" placeholder="주문자 이름" required>
        <input name="customer_phone" placeholder="연락처 (010-0000-0000)" required>
        <input name="depositor_name" placeholder="입금자명 (실제 입금할 이름)" required>
        <input name="quantity" type="number" min="1" value="1" placeholder="수량" required>
        <textarea name="memo" placeholder="요청사항 (선택)"></textarea>
        <button type="submit" style="padding:12px; background:#03c75a; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">
          주문 완료 (무통장입금)
        </button>
        <button type="button" id="close-modal"
          style="padding:10px; background:#eee; border:0; border-radius:6px; cursor:pointer;">
          취소
        </button>
      </form>
    </div>
  `;
  document.body.appendChild(modal);

  document.getElementById('close-modal').onclick = () => modal.remove();

  document.getElementById('order-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    const qty = Number(f.quantity.value);
    const total = p.price * qty;

    const { error } = await db.from('orders').insert({
      product_id: p.id,
      product_name: p.name,
      product_price: p.price,
      quantity: qty,
      total_price: total,
      customer_name: f.customer_name.value.trim(),
      customer_phone: f.customer_phone.value.trim(),
      depositor_name: f.depositor_name.value.trim(),
      memo: f.memo.value.trim(),
    });

    if (error) {
      alert('❌ 주문 실패: ' + error.message);
      return;
    }

    // 완료 화면
    modal.querySelector('div').innerHTML = `
      <h2 style="margin-bottom:16px; color:#03c75a;">✅ 주문 접수 완료</h2>
      <div style="background:#f8f8f8; padding:16px; border-radius:8px; margin-bottom:16px; line-height:1.7; font-size:14px;">
        <b>입금 계좌 안내</b><br>
        은행: <b>○○은행</b><br>
        계좌: <b>123-456-789012</b><br>
        예금주: <b>홍길동</b><br>
        입금액: <b>${total.toLocaleString()}원</b><br>
        입금자명: <b>${f.depositor_name.value}</b>
      </div>
      <p style="font-size:13px; color:#666; margin-bottom:16px;">
        위 계좌로 입금해주시면 확인 후 배송 준비됩니다.<br>
        (24시간 내 미입금 시 자동 취소될 수 있습니다.)
      </p>
      <button onclick="location.href='index.html'"
        style="width:100%; padding:12px; background:#222; color:#fff; border:0; border-radius:6px; cursor:pointer;">
        메인으로
      </button>
    `;
  });
}

  </script>
</body>
</html>
