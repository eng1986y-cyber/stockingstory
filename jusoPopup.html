<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>도로명주소 검색</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }

    body {
      overflow: hidden;
    }

    form {
      display: none;
    }

  </style>

</head>


<body>


<form
  id="jusoForm"
  name="jusoForm"
  method="post"
>

  <input
    type="hidden"
    id="confmKey"
    name="confmKey"
    value=""
  >

  <input
    type="hidden"
    id="returnUrl"
    name="returnUrl"
    value=""
  >

  <input
    type="hidden"
    id="resultType"
    name="resultType"
    value="4"
  >

</form>


<script>

/* =========================================
   YB365 도로명주소 팝업 API
========================================= */


/*
  중요
  아래 KEY 부분에
  발급받은 "도로명주소 팝업 API 승인키"를 넣으세요.
*/

const JUSO_CONFIRM_KEY =
  "U01TX0FVVEgyMDI2MTAwNzIwMTUwNDEyMDYyMjI=";


/* =========================================
   주소검색 결과 처리
========================================= */

function getParameter(name) {

  const params =
    new URLSearchParams(window.location.search);

  return params.get(name) || "";

}


/* =========================================
   주소검색 시작
========================================= */

function startJusoSearch() {

  const form =
    document.getElementById("jusoForm");


  /*
    주소검색 결과를 다시 받을
    현재 jusoPopup.html 주소
  */

  const returnUrl =
    window.location.origin +
    window.location.pathname;


  form.confmKey.value =
    JUSO_CONFIRM_KEY;


  form.returnUrl.value =
    returnUrl;


  form.resultType.value =
    "4";


  /*
    도로명주소 팝업 API

    현재 발급받은 것은
    "도로명주소 팝업 API" 승인키이므로
    addrLinkUrl.do 사용
  */

  form.action =
    "https://business.juso.go.kr/addrlink/addrLinkUrl.do";


  form.submit();

}


/* =========================================
   주소검색 결과가 돌아온 경우
========================================= */

function receiveJusoResult() {

  const inputYn =
    getParameter("inputYn");


  /*
    inputYn = Y
    → 주소 선택 완료
  */

  if(inputYn !== "Y") {

    startJusoSearch();

    return;

  }


  /* ==============================
     주소정보 받기
  ============================== */

  const roadFullAddr =
    getParameter("roadFullAddr");


  const roadAddrPart1 =
    getParameter("roadAddrPart1");


  const addrDetail =
    getParameter("addrDetail");


  const roadAddrPart2 =
    getParameter("roadAddrPart2");


  const jibunAddr =
    getParameter("jibunAddr");


  const zipNo =
    getParameter("zipNo");


  /*
    기본 주소
  */

  let address =
    roadFullAddr ||
    roadAddrPart1 ||
    "";


  /*
    주소 상세부분이 별도로 넘어오는 경우
    기존 주소 뒤에 붙이지 않는다.

    주문서에서는
    상세주소를 별도로 입력하도록 하기 때문.
  */


  /* =================================
     부모창으로 주소 전달
  ================================= */

  if(window.opener && !window.opener.closed) {

    /*
      기존 메인 페이지의
      jusoCallBack() 함수 호출
    */

    if(
      typeof window.opener.jusoCallBack ===
      "function"
    ) {

      window.opener.jusoCallBack(
        address,
        zipNo
      );

    } else {

      /*
        혹시 callback 함수가 없을 경우
        postMessage로도 전달
      */

      window.opener.postMessage(
        {
          type: "YB365_JUSO_RESULT",

          roadFullAddr: address,

          zipNo: zipNo,

          addrDetail: addrDetail,

          roadAddrPart2: roadAddrPart2,

          jibunAddr: jibunAddr
        },

        window.location.origin
      );

    }

  }


  /*
    팝업 닫기
  */

  window.close();

}


/* =========================================
   페이지 시작
========================================= */

window.addEventListener(
  "load",
  function() {

    receiveJusoResult();

  }
);

</script>


</body>

</html>
