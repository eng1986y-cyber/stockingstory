<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>전체 상품 - The Simple life' StockingStory</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    @import url('https://fonts.cdnfonts.com/css/bahnschrift');
    body { font-family: 'Bahnschrift Light', 'Bahnschrift', -apple-system, sans-serif; }
    #all-products-wrap {
      max-width: 1400px; margin: 0 auto; padding: 24px 16px 80px; box-sizing: border-box;
    }
    .ap-head {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 20px; padding: 0 4px;
    }
    .ap-head h1 {
      font-size: 22px; font-weight: 800; color: #fff; margin: 0;
      display: flex; align-items: center; gap: 10px;
    }
    .ap-head h1 .count {
      font-size: 13px; color: #fff; font-weight: 500;
    }
    .ap-toolbar {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .ap-toolbar input,
    .ap-toolbar select {
      padding: 9px 14px; border: 1px solid #e5e7eb; border-radius: 8px;
      font-size: 13px; font-family: inherit; background: #fff; color: #111827;
      box-sizing: border-box; height: 40px;
    }
    .ap-toolbar input { min-width: 220px; }
    .ap-toolbar select { min-width: 120px; }

    #all-products-list {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 16px;
      width: 100%;
    }
    @media (max-width: 1200px) {
      #all-products-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 768px) {
      #all-products-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 8px; }
    }
    #all-products-list .card {
      min-width: 0; display: block; box-sizing: border-box;
      text-decoration: none; color: inherit; position: relative;
    }
    #all-products-list .card .thumb {
      width: 100%; padding-bottom: 100%; position: relative; overflow: hidden;
      border-radius: 10px; background-color: #f0f0f0;
      background-size: cover; background-position: center;
    }
    #all-products-list .card .card-info { padding: 10px 4px; min-width: 0; }
    #all-products-list .card .name {
      font-size: 14px; font-weight: 500; color: #fff;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #all-products-list .card .price {
      color: #e53935; font-weight: 700; font-size: 15px; margin-top: 4px;
    }
    #all-products-list .card .price.locked {
      color: #1976d2; font-size: 12px; font-weight: 600;
    }
    #all-products-list .card .grade-badge {
      position: absolute; top: 8px; right: 8px; color: #fff;
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px; z-index: 2;
    }
    #all-products-list .card .grade-badge.wholesale { background: #f59e0b; }
    #all-products-list .card .grade-badge.vip { background: #a855f7; }
    #all-products-list .card .new-badge {
      position: absolute; top: 8px; left: 8px; background: #e53935; color: #fff;
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; z-index: 2;
    }

    #ap-pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 6px; margin-top: 28px; flex-wrap: wrap; min-height: 44px;
    }
    #ap-pagination button {
      min-width: 36px; height: 36px; padding: 0 12px;
      border: 1px solid #e5e7eb; background: #fff; color: #374151;
      border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
      font-family: inherit;
    }
    #ap-pagination button.active { background: #111827; color: #fff; border-color: #111827; }
    #ap-pagination button:disabled { opacity: .4; cursor: not-allowed; }

    .ap-empty {
      grid-column: 1/-1; text-align: center; padding: 60px 20px;
      color: #9ca3af; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <div id="all-products-wrap">
    <div class="ap-head">
      <h1>전체 상품 <span class="count" id="ap-count"></span></h1>
      <div class="ap-toolbar">
        <select id="ap-sort">
          <option value="latest">최신순</option>
          <option value="price_asc">가격 낮은순</option>
          <option value="price_desc">가격 높은순</option>
          <option value="name">이름순</option>
        </select>
      </div>
    </div>

    <div id="all-products-list">
      <div class="ap-empty">로딩 중...</div>
    </div>
    <div id="ap-pagination"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );

    const isPC = () => window.innerWidth >= 769;
    const PC_PER_PAGE = 30;
    const MOBILE_PER_PAGE = 12;

    let allProducts = [];
    let filtered = [];
    let currentPage = 1;

    const won = n => '₩ ' + Number(n || 0).toLocaleString();
    const bgUrl = url => url ? `url('${String(url).replace(/'/g, "\\'")}')` : 'none';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    function getMember() { try { return JSON.parse(localStorage.getItem('member') || 'null'); } catch { return null; } }
    function isLoggedIn() { const m = getMember(); return !!(m && m.id); }
    function getMemberGrade() { return getMember()?.grade || '일반회원'; }
    function isNewProduct(p) {
      if (!p || !p.created_at) return false;
      const c = new Date(p.created_at).getTime();
      return !isNaN(c) && (Date.now() - c) < 7*24*60*60*1000;
    }
    function shouldHidePrice(p) { return !isLoggedIn() && isNewProduct(p); }

    function filterByGrade(products) {
      const publicProducts = (products || []).filter(p => (p.target_grade || 'all') !== 'wholesale');
      if (!isLoggedIn()) return publicProducts.filter(p => (p.target_grade || 'all') === 'all');
      const grade = getMemberGrade();
      return publicProducts.filter(p => {
        const tg = p.target_grade || 'all';
        if (tg === 'all') return true;
        if (tg === 'vip') return grade === 'VIP회원';
        return false;
      });
    }

    async function loadAll() {
      const list = document.getElementById('all-products-list');
      const { data, error } = await db.from('products').select('*').order('created_at', { ascending: false });
      if (error) {
        list.innerHTML = `<div class="ap-empty">❌ ${esc(error.message)}</div>`;
        return;
      }
      allProducts = filterByGrade(data || []);
      document.getElementById('ap-count').textContent = `총 ${allProducts.length}개`;
      applyFilter();
    }

    function applyFilter() {
      const sort = document.getElementById('ap-sort').value;

      // 검색창과 카테고리 선택 제거: 전체 상품을 정렬만 합니다.
      filtered = [...allProducts];

      if (sort === 'price_asc') filtered.sort((a,b) => Number(a.price||0) - Number(b.price||0));
      else if (sort === 'price_desc') filtered.sort((a,b) => Number(b.price||0) - Number(a.price||0));
      else if (sort === 'name') filtered.sort((a,b) => String(a.name||'').localeCompare(String(b.name||''), 'ko'));

      currentPage = 1;
      render();
    }

    function render() {
      const list = document.getElementById('all-products-list');
      const perPage = isPC() ? PC_PER_PAGE : MOBILE_PER_PAGE;
      const totalPages = Math.ceil(filtered.length / perPage) || 1;
      const start = (currentPage - 1) * perPage;
      const items = filtered.slice(start, start + perPage);

      if (!items.length) {
        list.innerHTML = '<div class="ap-empty">조건에 맞는 상품이 없습니다.</div>';
        document.getElementById('ap-pagination').innerHTML = '';
        return;
      }

      list.innerHTML = items.map(p => {
        const tg = p.target_grade || 'all';
        const newBadge = isNewProduct(p) ? '<span class="new-badge">NEW</span>' : '';
        const gradeBadge = tg === 'wholesale' ? '<span class="grade-badge wholesale">도매</span>'
                        : tg === 'vip' ? '<span class="grade-badge vip">VIP</span>' : '';
        const hidePrice = shouldHidePrice(p);
        const priceHtml = hidePrice
          ? '<div class="price locked">🔒 로그인 후 가격 확인</div>'
          : `<div class="price">${won(p.price)}</div>`;
        return `
          <a class="card" href="product.html?id=${encodeURIComponent(p.id)}">
            <div class="thumb" style="background-image: ${bgUrl(p.main_image)};">${newBadge}${gradeBadge}</div>
            <div class="card-info">
              <div class="name">${esc(p.name || '(상품명 없음)')}</div>
              ${priceHtml}
            </div>
          </a>`;
      }).join('');

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const el = document.getElementById('ap-pagination');
      if (totalPages <= 1) { el.innerHTML = ''; return; }
      let html = `<button ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">‹</button>`;
      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 10 && Math.abs(i - currentPage) > 2 && i !== 1 && i !== totalPages) {
          if (i === 2 || i === totalPages - 1) html += '<span style="padding:0 4px;color:#9ca3af;">…</span>';
          continue;
        }
        html += `<button data-page="${i}" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
      }
      html += `<button ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">›</button>`;
      el.innerHTML = html;
      el.querySelectorAll('button[data-page]').forEach(b => {
        b.onclick = () => {
          const page = Number(b.dataset.page);
          if (page < 1 || page > totalPages) return;
          currentPage = page;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      });
    }

    document.getElementById('ap-sort').addEventListener('change', applyFilter);

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { render(); }, 200);
    });

    loadAll();
  </script>
</body>
</html>
