<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>상품 수정 - Simple life' StockingStory</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js" defer></script>
  <style>
    html, body { background: #f4f6f8 !important; color: #1f2937 !important; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; }
    .edit-header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 16px 24px; }
    .edit-header a { color: #111827; text-decoration: none; font-weight: 700; font-size: 18px; }
    .edit-wrap { max-width: 900px; margin: 40px auto; padding: 0 16px; }
    .edit-title { font-size: 22px; font-weight: 700; color: #111827; margin: 0 0 20px; }
    .login-wrap { max-width: 380px; margin: 80px auto; background: #fff; padding: 32px; border-radius: 12px; }
    .login-wrap h2 { font-size: 22px; font-weight: 700; color: #111827; margin: 0 0 6px; }
    .login-wrap form { display: grid; gap: 10px; }
    .login-wrap input { padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .login-wrap button { padding: 12px; background: #111827; color: #fff; border: 0; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .form-card { background: #fff; border-radius: 12px; padding: 24px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-grid input, .form-grid textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px;
      font-size: 14px; font-family: inherit; color: #111827; box-sizing: border-box;
    }
    .form-grid textarea { resize: vertical; min-height: 60px; }
    .btn { padding: 12px; border-radius: 8px; border: 0; cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit; text-decoration: none; display: inline-block; text-align: center; }
    .btn-primary { background: #111827; color: #fff; flex: 1; }
    .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; flex: 1; }
    .actions { display: flex; gap: 8px; grid-column: 1 / -1; margin-top: 10px; }
    .msg { font-size: 13px; font-weight: 600; margin-top: 12px; }
    .msg.success { color: #059669; }
    .msg.error { color: #dc2626; }
  </style>
</head>
<body>
  <header class="edit-header"><a href="index.html">🛍️ Simple life' StockingStory - 상품 수정</a></header>

  <div id="login-screen" style="display:none;">
    <div class="login-wrap">
      <h2>관리자 로그인</h2>
      <form id="login-form">
        <input name="email" type="email" placeholder="이메일" required>
        <input name="password" type="password" placeholder="비밀번호" required>
        <button type="submit">로그인</button>
      </form>
      <p id="login-msg" class="msg"></p>
    </div>
  </div>

  <div id="edit-screen" style="display:none;">
    <div class="edit-wrap">
      <h1 class="edit-title">상품 수정</h1>
      <div class="form-card">
        <form id="edit-form" class="form-grid">
          <input name="product_code" placeholder="제품번호">
          <input name="name" placeholder="상품명" required>
          <input name="price" type="number" placeholder="가격" required>
          <input name="main_image" placeholder="메인 이미지 URL" required>
          <input name="colors" placeholder="색상 (쉼표)">
          <input name="sizes" placeholder="사이즈 (쉼표)">
          <input name="hem_option" placeholder="밑단선택 (쉼표)">
          <input name="other_option" placeholder="기타옵션 (쉼표)">
          <input name="min_qty" type="number" min="1" placeholder="최소 주문수량 (기본 1)">
          <textarea name="detail_images" class="full" placeholder="상세 이미지 URL (줄바꿈)"></textarea>
          <div class="actions">
            <button type="submit" class="btn btn-primary">수정 완료</button>
            <a href="admin.html" class="btn btn-secondary">취소</a>
          </div>
        </form>
        <p id="msg" class="msg"></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
    document.addEventListener('DOMContentLoaded', () => {
      document.body.classList.remove('dark');
      document.documentElement.classList.remove('dark');
    });
  </script>

  <script>
    const loginScreen = document.getElementById('login-screen');
    const editScreen = document.getElementById('edit-screen');
    const loginForm = document.getElementById('login-form');
    const loginMsg = document.getElementById('login-msg');
    const form = document.getElementById('edit-form');
    const msg = document.getElementById('msg');
    const id = new URLSearchParams(location.search).get('id');

    const parseList = (str) => (str || '').split(',').map(s => s.trim()).filter(Boolean);

    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        loginScreen.style.display = 'none';
        editScreen.style.display = 'block';
        loadProduct();
      } else {
        loginScreen.style.display = 'block';
        editScreen.style.display = 'none';
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginMsg.textContent = '로그인 중...';
      const { error } = await db.auth.signInWithPassword({
        email: loginForm.email.value.trim(),
        password: loginForm.password.value,
      });
      if (error) {
        loginMsg.className = 'msg error';
        loginMsg.textContent = '❌ ' + error.message;
      } else checkSession();
    });

    async function loadProduct() {
      if (!id) { msg.textContent = '❌ 상품 ID가 없습니다.'; return; }
      const { data, error } = await db.from('products').select('*').eq('id', id).single();
      if (error || !data) { msg.textContent = '❌ 상품을 불러올 수 없습니다.'; return; }
      form.product_code.value = data.product_code || '';
      form.name.value = data.name;
      form.price.value = data.price;
      form.main_image.value = data.main_image;
      form.detail_images.value = (data.detail_images || []).join('\n');
      form.colors.value = (data.colors || []).join(',');
      form.sizes.value = (data.sizes || []).join(',');
      form.hem_option.value = (data.hem_option || []).join(',');
      form.other_option.value = (data.other_option || []).join(',');
      form.min_qty.value = data.min_qty || 1;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const detail_images = form.detail_images.value.split('\n').map(s => s.trim()).filter(Boolean);
      msg.textContent = '수정 중...';
      msg.className = 'msg';

      const { error } = await db.from('products').update({
        product_code: form.product_code.value.trim() || null,
        name: form.name.value.trim(),
        price: Number(form.price.value),
        main_image: form.main_image.value.trim(),
        detail_images,
        colors: parseList(form.colors.value),
        sizes: parseList(form.sizes.value),
        hem_option: parseList(form.hem_option.value),
        other_option: parseList(form.other_option.value),
        min_qty: Number(form.min_qty.value) || 1,
      }).eq('id', id);

      if (error) {
        msg.className = 'msg error';
        msg.textContent = '❌ ' + error.message;
      } else {
        msg.className = 'msg success';
        msg.textContent = '✅ 수정 완료!';
        setTimeout(() => location.href = 'admin.html', 800);
      }
    });

    checkSession();
  </script>
</body>
</html>
