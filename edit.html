<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>상품 수정 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js" defer></script>
</head>
<body>
  <header>
    <h1><a href="index.html">🛍️ 심플몰</a> - 상품 수정</h1>
  </header>

  <main>
    <div id="login-screen" style="display:none; max-width:360px; margin:60px auto;">
      <h2 style="margin-bottom:16px;">관리자 로그인</h2>
      <form id="login-form" style="display:grid; gap:10px; background:#fff; padding:20px; border-radius:8px;">
        <input name="email" type="email" placeholder="이메일" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <input name="password" type="password" placeholder="비밀번호" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <button type="submit" style="padding:12px; background:#222; color:#fff; border:0; border-radius:6px; cursor:pointer;">로그인</button>
      </form>
      <p id="login-msg" style="margin-top:12px; font-weight:600;"></p>
    </div>

    <div id="edit-screen" style="display:none;">
      <h2 style="margin-bottom:16px;">상품 수정</h2>
      <form id="edit-form" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:10px; background:#fff; padding:16px; border-radius:8px;">
        <input name="product_code" placeholder="제품번호" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <input name="name" placeholder="상품명" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <input name="price" type="number" placeholder="가격" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <input name="main_image" placeholder="메인 이미지 URL" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <input name="colors" placeholder="색상 (쉼표)" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <input name="sizes" placeholder="사이즈 (쉼표)" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <input name="hem_option" placeholder="밑단선택 (예: 기본, 밑단줄임)" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <input name="other_option" placeholder="기타옵션 (예: 없음, 각인가능)" style="padding:10px; border:1px solid #ddd; border-radius:6px;">

        <textarea name="description" placeholder="상품 설명" style="grid-column: 1 / -1; padding:10px; border:1px solid #ddd; border-radius:6px; min-height:60px;"></textarea>
        <textarea name="detail_images" placeholder="상세 이미지 URL (줄바꿈)" style="grid-column: 1 / -1; padding:10px; border:1px solid #ddd; border-radius:6px; min-height:60px;"></textarea>

        <div style="grid-column: 1 / -1; display:flex; gap:8px;">
          <button type="submit" style="flex:1; padding:12px; background:#1976d2; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">수정 완료</button>
          <a href="admin.html" style="flex:1; text-align:center; padding:12px; background:#999; color:#fff; border-radius:6px; text-decoration:none;">취소</a>
        </div>
      </form>
      <p id="msg" style="margin-top:12px; font-weight:600;"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const loginScreen = document.getElementById('login-screen');
    const editScreen = document.getElementById('edit-screen');
    const loginForm = document.getElementById('login-form');
    const loginMsg = document.getElementById('login-msg');
    const form = document.getElementById('edit-form');
    const msg = document.getElementById('msg');
    const id = new URLSearchParams(location.search).get('id');

    const parseList = (str) => (str || '').split(',').map(s => s.trim()).filter(Boolean);

    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        loginScreen.style.display = 'none';
        editScreen.style.display = 'block';
        loadProduct();
      } else {
        loginScreen.style.display = 'block';
        editScreen.style.display = 'none';
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginMsg.textContent = '로그인 중...';
      loginMsg.style.color = '#222';
      const { error } = await db.auth.signInWithPassword({
        email: loginForm.email.value.trim(),
        password: loginForm.password.value,
      });
      if (error) {
        loginMsg.style.color = 'crimson';
        loginMsg.textContent = '❌ ' + error.message;
      } else checkSession();
    });

    async function loadProduct() {
      if (!id) { msg.textContent = '❌ 상품 ID가 없습니다.'; return; }
      const { data, error } = await db.from('products').select('*').eq('id', id).single();
      if (error || !data) { msg.textContent = '❌ 상품을 불러올 수 없습니다.'; return; }

      form.product_code.value = data.product_code || '';
      form.name.value = data.name;
      form.price.value = data.price;
      form.description.value = data.description || '';
      form.main_image.value = data.main_image;
      form.detail_images.value = (data.detail_images || []).join('\n');
      form.colors.value = (data.colors || []).join(',');
      form.sizes.value = (data.sizes || []).join(',');
      form.hem_option.value = data.hem_option || '';
      form.other_option.value = data.other_option || '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const detail_images = form.detail_images.value.split('\n').map(s => s.trim()).filter(Boolean);

      msg.textContent = '수정 중...';
      msg.style.color = '#222';

      const { error } = await db.from('products').update({
        product_code: form.product_code.value.trim() || null,
        name: form.name.value.trim(),
        price: Number(form.price.value),
        description: form.description.value.trim(),
        main_image: form.main_image.value.trim(),
        detail_images,
        colors: parseList(form.colors.value),
        sizes: parseList(form.sizes.value),
        hem_option: form.hem_option.value.trim() || null,
        other_option: form.other_option.value.trim() || null,
      }).eq('id', id);

      if (error) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ ' + error.message;
      } else {
        msg.style.color = 'green';
        msg.textContent = '✅ 수정 완료!';
        setTimeout(() => location.href = 'admin.html', 800);
      }
    });

    checkSession();
  </script>
</body>
</html>
