<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>회원가입 - Simple life' StockingStory</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    .auth-wrap { max-width: 440px; margin: 40px auto; padding: 0 16px; }
    .auth-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; color: #222; }
    body.dark .auth-title { color: #fff; }
    .auth-form { display: grid; gap: 10px; background: #fff; padding: 24px; border-radius: 8px; }
    body.dark .auth-form { background: #151515; border: 1px solid #222; border-radius: 12px; }
    .auth-form label { font-size: 13px; color: #666; }
    body.dark .auth-form label { color: #999; }
    .auth-form input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
    body.dark .auth-form input { background: #0f0f0f; border-color: #2a2a2a; color: #e5e7eb; }
    body.dark .auth-form input::placeholder { color: #555; }
    body.dark .auth-form input:focus { outline: none; border-color: #555; box-shadow: 0 0 0 3px rgba(255,255,255,.05); }
    .auth-form button { padding: 14px; background: #03c75a; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 15px; font-family: inherit; margin-top: 4px; }
    .auth-form button:hover { background: #02b151; }
    #msg { margin-top: 12px; font-weight: 600; text-align: center; }
    .coupon-notice {
      background: #fef3c7; color: #92400e;
      padding: 12px 14px; border-radius: 8px;
      font-size: 13px; line-height: 1.6;
      margin-bottom: 16px; border: 1px dashed #f59e0b;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div class="auth-wrap">
      <h2 class="auth-title">회원가입</h2>
      <div class="coupon-notice" id="coupon-notice" style="display:none;">
        🎉 <b>신규 회원 감사 쿠폰</b><br>
        <span id="coupon-notice-text">10% 할인 쿠폰 (유효기간 30일)이 자동 발급됩니다!</span>
      </div>
      <form id="signup-form" class="auth-form">
        <label>아이디</label>
        <input name="username" placeholder="아이디" required>

        <label>비밀번호</label>
        <input name="password" type="password" placeholder="비밀번호" required>

        <label>이름</label>
        <input name="name" placeholder="이름" required>

        <label>연락처</label>
        <input name="phone" type="tel" inputmode="numeric" placeholder="010-0000-0000" required>

        <button type="submit">가입하기</button>
      </form>
      <p id="msg"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const form = document.getElementById('signup-form');
    const msg = document.getElementById('msg');

    // ⭐ 관리자 설정에서 회원가입 쿠폰 정보 로드
    let signupCouponConfig = { enabled: false, name: '가입 감사 10% 할인 쿠폰', type: 'percent', value: 10, days: 30 };

    async function loadSignupCouponConfig() {
      try {
        const keys = ['signup_coupon_enabled', 'signup_coupon_name', 'signup_coupon_type', 'signup_coupon_value', 'signup_coupon_days'];
        const { data } = await db.from('settings').select('key, value').in('key', keys);
        const map = {};
        (data || []).forEach(row => { map[row.key] = row.value; });

        // 설정이 아예 없으면 기본값으로 비활성화 (관리자가 명시적으로 켜야 함)
        signupCouponConfig = {
          enabled: map.signup_coupon_enabled === 'true',
          name: map.signup_coupon_name || '가입 감사 10% 할인 쿠폰',
          type: map.signup_coupon_type || 'percent',
          value: Number(map.signup_coupon_value) || 10,
          days: Number(map.signup_coupon_days) || 30,
        };

        const noticeEl = document.getElementById('coupon-notice');
        const noticeTextEl = document.getElementById('coupon-notice-text');
        if (signupCouponConfig.enabled && noticeEl && noticeTextEl) {
          const discountLabel = signupCouponConfig.type === 'percent'
            ? `${signupCouponConfig.value}% 할인`
            : `${signupCouponConfig.value.toLocaleString()}원 할인`;
          noticeTextEl.textContent = `${discountLabel} 쿠폰 (유효기간 ${signupCouponConfig.days}일)이 자동 발급됩니다!`;
          noticeEl.style.display = 'block';
        } else if (noticeEl) {
          noticeEl.style.display = 'none';
        }
      } catch (e) {
        console.warn('회원가입 쿠폰 설정 로드 실패:', e);
        signupCouponConfig.enabled = false;
        const noticeEl = document.getElementById('coupon-notice');
        if (noticeEl) noticeEl.style.display = 'none';
      }
    }
    loadSignupCouponConfig();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '가입 중...';
      msg.style.color = '#888';

      const payload = {
        username: form.username.value.trim(),
        password: form.password.value,
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        grade: '일반회원',
      };

      const { data: exist } = await db.from('members').select('id').eq('username', payload.username).maybeSingle();
      if (exist) {
        msg.style.color = '#ef4444';
        msg.textContent = '❌ 이미 사용 중인 아이디입니다.';
        return;
      }

      const { data, error } = await db.from('members').insert(payload).select().single();

      if (error) {
        msg.style.color = '#ef4444';
        msg.textContent = '❌ ' + error.message;
        return;
      }

      // ⭐ 관리자 설정에 따라 회원가입 쿠폰 발급
      let couponIssued = false;
      if (signupCouponConfig.enabled) {
        try {
          const now = new Date();
          const expiresAt = new Date(now.getTime() + signupCouponConfig.days * 24 * 60 * 60 * 1000);
          const prefix = signupCouponConfig.type === 'percent' ? 'WELCOME' : 'WON';
          const code = prefix + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();

          const { error: couponErr } = await db.from('coupons').insert({
            member_id: data.id,
            code: code,
            name: signupCouponConfig.name,
            type: signupCouponConfig.type,
            discount_value: signupCouponConfig.value,
            min_order_amount: 0,
            max_discount_amount: null,
            is_used: false,
            expires_at: expiresAt.toISOString(),
          });
          if (!couponErr) couponIssued = true;
          else console.warn('쿠폰 발급 실패 (가입은 완료):', couponErr);
        } catch (couponErr) {
          console.warn('쿠폰 발급 실패 (가입은 완료):', couponErr);
        }
      }

      localStorage.setItem('member', JSON.stringify({
        id: data.id,
        username: data.username,
        name: data.name,
        phone: data.phone,
        grade: data.grade || '일반회원',
      }));

      msg.style.color = '#10b981';
      if (couponIssued) {
        msg.textContent = '✅ 가입 완료! 쿠폰이 발급되었습니다.';
      } else {
        msg.textContent = '✅ 가입 완료!';
      }
      setTimeout(() => location.href = 'index.html', 1500);
    });
  </script>
</body>
</html>
