<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>회원가입 - 스타킹스토리 심플라이프</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    .auth-wrap { max-width: 440px; margin: 40px auto; padding: 0 16px; }
    .auth-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #222;
    }
    body.dark .auth-title { color: #fff; }
    .auth-form {
      display: grid;
      gap: 10px;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
    }
    body.dark .auth-form {
      background: #151515;
      border: 1px solid #222;
      border-radius: 12px;
    }
    .auth-form label {
      font-size: 13px;
      color: #666;
    }
    body.dark .auth-form label { color: #999; }
    .auth-form input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    body.dark .auth-form input {
      background: #0f0f0f;
      border-color: #2a2a2a;
      color: #e5e7eb;
    }
    body.dark .auth-form input::placeholder { color: #555; }
    body.dark .auth-form input:focus {
      outline: none;
      border-color: #555;
      box-shadow: 0 0 0 3px rgba(255,255,255,.05);
    }
    .auth-form button {
      padding: 14px;
      background: #03c75a;
      color: #fff;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      font-family: inherit;
      margin-top: 4px;
    }
    .auth-form button:hover { background: #02b151; }
    #msg { margin-top: 12px; font-weight: 600; text-align: center; }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div class="auth-wrap">
      <h2 class="auth-title">회원가입</h2>
      <form id="signup-form" class="auth-form">
        <label>아이디</label>
        <input name="username" placeholder="아이디" required>

        <label>비밀번호</label>
        <input name="password" type="password" placeholder="비밀번호" required>

        <label>이름</label>
        <input name="name" placeholder="이름" required>

        <label>연락처</label>
        <input name="phone" type="tel" inputmode="numeric" placeholder="010-0000-0000" required>

        <button type="submit">가입하기</button>
      </form>
      <p id="msg"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const form = document.getElementById('signup-form');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '가입 중...';
      msg.style.color = '#888';

      const payload = {
        username: form.username.value.trim(),
        password: form.password.value,
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
      };

      const { data: exist } = await db.from('members').select('id').eq('username', payload.username).maybeSingle();
      if (exist) {
        msg.style.color = '#ef4444';
        msg.textContent = '❌ 이미 사용 중인 아이디입니다.';
        return;
      }

      const { data, error } = await db.from('members').insert(payload).select().single();

      if (error) {
        msg.style.color = '#ef4444';
        msg.textContent = '❌ ' + error.message;
        return;
      }

      localStorage.setItem('member', JSON.stringify({
        id: data.id,
        username: data.username,
        name: data.name,
        phone: data.phone,
      }));

      msg.style.color = '#10b981';
      msg.textContent = '✅ 가입 완료! 메인으로 이동...';
      setTimeout(() => location.href = 'index.html', 1000);
    });
  </script>
</body>
</html>
