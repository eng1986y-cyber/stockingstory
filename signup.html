<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>회원가입 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/common.js" defer></script>
</head>
<body>
  <header>
    <h1><a href="index.html">🛍️ 심플몰</a></h1>
  </header>

  <main>
    <div style="max-width:400px; margin:40px auto;">
      <h2 style="margin-bottom:16px;">회원가입</h2>

      <form id="signup-form" style="display:grid; gap:10px; background:#fff; padding:24px; border-radius:8px;">
        <input name="name" placeholder="이름" required
          style="padding:12px; border:1px solid #ddd; border-radius:6px; font-size:14px;">
        <input name="phone" type="tel" inputmode="numeric" placeholder="연락처 (010-0000-0000)" required
          style="padding:12px; border:1px solid #ddd; border-radius:6px; font-size:14px;">
        <input name="email" type="email" placeholder="이메일" required
          style="padding:12px; border:1px solid #ddd; border-radius:6px; font-size:14px;">
        <button type="submit"
          style="padding:14px; background:#03c75a; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600; font-size:15px;">
          가입하기
        </button>
      </form>

      <p id="msg" style="margin-top:12px; font-weight:600; text-align:center;"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const form = document.getElementById('signup-form');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      msg.textContent = '가입 중...';
      msg.style.color = '#222';

      const name = form.name.value.trim();
      const phone = form.phone.value.trim();
      const email = form.email.value.trim();

      const { error } = await db.from('members').insert({ name, phone, email });

      if (error) {
        if (error.message.includes('duplicate')) {
          msg.style.color = 'crimson';
          msg.textContent = '❌ 이미 가입된 이메일입니다.';
        } else {
          msg.style.color = 'crimson';
          msg.textContent = '❌ ' + error.message;
        }
        return;
      }

      localStorage.setItem('member', JSON.stringify({ name, phone, email }));

      msg.style.color = 'green';
      msg.textContent = '✅ 가입 완료! 잠시 후 메인으로 이동...';

      setTimeout(() => location.href = 'index.html', 1200);
    });
  </script>
</body>
</html>
