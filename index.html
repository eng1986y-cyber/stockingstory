<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>심플 쇼핑몰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header style="display:flex; justify-content:space-between; align-items:center;">
  <h1><a href="index.html">🛍️ 심플몰</a></h1>
  <div id="header-member" style="font-size:14px;">
    <a href="signup.html" style="padding:8px 14px; background:#03c75a; color:#fff; border-radius:6px; text-decoration:none;">
      회원가입
    </a>
  </div>
</header>

  <main>
    <div id="product-list" class="grid">로딩중...</div>
  </main>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase 설정 (분리된 파일) -->
  <script>
  const db = supabase.createClient(
    "https://alpdhgcipjeekzrpxlbh.supabase.co",
    "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
  );
</script>

  <!-- 상품 목록 로직 -->
  <script>
    async function loadProducts() {
      const list = document.getElementById('product-list');

      const { data, error } = await db
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error(error);
        list.innerHTML = '<p>상품을 불러올 수 없습니다.</p>';
        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = '<p>등록된 상품이 없습니다.</p>';
        return;
      }

      list.innerHTML = data.map(p => `
        <a class="card" href="product.html?id=${p.id}">
          <img src="${p.main_image}" alt="${p.name}" loading="lazy">
          <div class="card-body">
            <h3>${p.name}</h3>
            <p class="price">${Number(p.price).toLocaleString()}원</p>
          </div>
        </a>
      `).join('');
    }

    loadProducts();

// 회원 상태 표시
(function() {
  const el = document.getElementById('header-member');
  const member = localStorage.getItem('member');
  if (member) {
    const m = JSON.parse(member);
    el.innerHTML = `
      <span style="color:#555;">안녕하세요, <b>${m.name}</b>님</span>
      <button id="logout-member"
        style="margin-left:8px; padding:6px 12px; background:#eee; border:0; border-radius:6px; cursor:pointer; font-size:13px;">
        로그아웃
      </button>
    `;
    document.getElementById('logout-member').onclick = () => {
      localStorage.removeItem('member');
      location.reload();
    };
  }
})();
  </script>
</body>
</html>
