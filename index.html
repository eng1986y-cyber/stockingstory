<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    /* 좌우 스크롤 완전 차단 */
    html, body {
      overflow-x: hidden !important;
      width: 100%;
      max-width: 100%;
    }
    body {
      position: relative;
    }
    /* 모든 요소 좌우 넘침 방지 */
    * {
      max-width: 100%;
    }
    /* main 컨테이너 좌우 여백 + 넘침 방지 */
    main {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    #product-list {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    #product-list .card {
      min-width: 0;
      overflow: hidden;
    }
    #product-list .card img {
      width: 100%;
      display: block;
    }
    #pagination {
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main>
    <!-- PC 배너 (모바일에서는 숨김) -->
    <div id="banner-wrap" style="display:none; margin-bottom:20px; width:100%; max-width:100%;">
      <div id="banner-inner" style="width:100%; max-width:100%; overflow:hidden; border-radius:12px;"></div>
    </div>

    <div id="product-list" style="display:grid; gap:12px;">로딩중...</div>
    <div id="pagination" style="display:flex; justify-content:center; gap:6px; margin-top:20px; flex-wrap:wrap;"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    // ===== 반응형 페이지 크기 설정 =====
    const isPC = () => window.innerWidth >= 769;
    const PC_PER_PAGE = 35;
    const PC_MAX_PAGES = 10;
    const MOBILE_PER_PAGE = 10;
    const MOBILE_MAX_PAGES = 5;

    let allProducts = [];
    let currentPage = 1;

    // ===== 배너 로드 =====
    async function loadBanner() {
      const wrap = document.getElementById('banner-wrap');
      const inner = document.getElementById('banner-inner');

      const { data, error } = await db
        .from('banners')
        .select('*')
        .order('id', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (error || !data || !data.image_url) {
        wrap.style.display = 'none';
        return;
      }

      wrap.style.display = isPC() ? 'block' : 'none';

      const imgHtml = `
        <img src="${data.image_url}" alt="배너"
          style="width:100%; height:700px; object-fit:cover; display:block;">
      `;

      inner.innerHTML = data.link_url
        ? `<a href="${data.link_url}" style="display:block; width:100%;">${imgHtml}</a>`
        : imgHtml;
    }

    // ===== 상품 목록 =====
    async function loadProducts() {
      const list = document.getElementById('product-list');
      const { data, error } = await db
        .from('products').select('*')
        .order('created_at', { ascending: false });

      if (error) { list.innerHTML = '<p>상품을 불러올 수 없습니다.</p>'; return; }
      if (!data || data.length === 0) {
        list.innerHTML = '<p>등록된 상품이 없습니다.</p>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      allProducts = data;
      currentPage = 1;
      applyGridColumns();
      renderPage();
    }

    function applyGridColumns() {
      const list = document.getElementById('product-list');
      // minmax(0, 1fr) 로 해야 이미지가 그리드를 넘치지 않음
      list.style.gridTemplateColumns = isPC()
        ? 'repeat(7, minmax(0, 1fr))'
        : 'repeat(2, minmax(0, 1fr))';
    }

    function getPerPage() {
      return isPC() ? PC_PER_PAGE : MOBILE_PER_PAGE;
    }
    function getMaxPages() {
      return isPC() ? PC_MAX_PAGES : MOBILE_MAX_PAGES;
    }

    function renderPage() {
      const list = document.getElementById('product-list');
      const perPage = getPerPage();
      const start = (currentPage - 1) * perPage;
      const items = allProducts.slice(start, start + perPage);

      list.innerHTML = items.map(p => `
        <a class="card" href="product.html?id=${p.id}" style="text-decoration:none; color:inherit; display:block; min-width:0;">
          <img src="${p.main_image}" alt="${p.name}" loading="lazy"
            style="width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; display:block;">
          <div style="padding:8px 4px; min-width:0;">
            <div style="font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${p.name}</div>
            <div style="color:#e53935; font-weight:700; font-size:14px; margin-top:2px;">${Number(p.price).toLocaleString()}원</div>
          </div>
        </a>
      `).join('');

      renderPagination();
    }

    function renderPagination() {
      const el = document.getElementById('pagination');
      const perPage = getPerPage();
      const maxPages = getMaxPages();
      const totalPages = Math.min(Math.ceil(allProducts.length / perPage), maxPages);

      if (totalPages <= 1) { el.innerHTML = ''; return; }

      let html = '';

      html += `<button class="page-nav" data-page="${currentPage-1}" ${currentPage===1?'disabled':''}
        style="padding:8px 14px; border:1px solid #ddd; border-radius:6px; background:${currentPage===1?'#f5f5f5':'#fff'}; color:${currentPage===1?'#bbb':'#222'}; cursor:${currentPage===1?'default':'pointer'};">이전</button>`;

      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-num" data-page="${i}"
          style="padding:8px 14px; border:1px solid ${i===currentPage?'#1976d2':'#ddd'}; border-radius:6px; background:${i===currentPage?'#1976d2':'#fff'}; color:${i===currentPage?'#fff':'#222'}; cursor:pointer; font-weight:${i===currentPage?'700':'400'};">${i}</button>`;
      }

      html += `<button class="page-nav" data-page="${currentPage+1}" ${currentPage===totalPages?'disabled':''}
        style="padding:8px 14px; border:1px solid #ddd; border-radius:6px; background:${currentPage===totalPages?'#f5f5f5':'#fff'}; color:${currentPage===totalPages?'#bbb':'#222'}; cursor:${currentPage===totalPages?'default':'pointer'};">다음</button>`;

      el.innerHTML = html;

      el.querySelectorAll('.page-num, .page-nav').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          currentPage = Number(btn.dataset.page);
          renderPage();
          // 스크롤 이동 없음
        });
      });
    }

    // ===== 화면 크기 변경 시 자동 대응 =====
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        applyGridColumns();

        const wrap = document.getElementById('banner-wrap');
        const inner = document.getElementById('banner-inner');
        if (inner.innerHTML.trim()) {
          wrap.style.display = isPC() ? 'block' : 'none';
        }

        currentPage = 1;
        renderPage();
      }, 200);
    });

    // ===== 시작 =====
    (async () => {
      await loadBanner();
      await loadProducts();
    })();
  </script>
</body>
</html>
