<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Simple life' StockingStory</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    @import url('https://fonts.cdnfonts.com/css/bahnschrift');
    html { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    body { overflow-x: hidden; width: 100%; max-width: 100%; margin: 0; font-family: 'Bahnschrift Light', 'Bahnschrift', -apple-system, sans-serif; }

    /* ⭐ 상단 히어로 배경이미지 */
    #hero-bg-section { display: none; width: 100%; position: relative; overflow: hidden; background: #111; }
    #hero-bg-section.show { display: block; }
    #hero-bg-section .hero-bg-inner { width: 100%; height: 420px; background-size: cover; background-position: center; background-repeat: no-repeat; position: relative; }
    #hero-bg-section .hero-bg-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.55) 100%); display: flex; align-items: flex-end; justify-content: center; padding: 32px 16px; box-sizing: border-box; }
    #hero-bg-section .hero-bg-text { color: #fff; text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
    #hero-bg-section .hero-bg-text h2 { font-size: 28px; font-weight: 800; margin: 0 0 8px; letter-spacing: 1px; font-family: 'Bahnschrift Light', sans-serif; }
    #hero-bg-section .hero-bg-text p { font-size: 14px; margin: 0; opacity: .9; font-family: 'Bahnschrift Light', sans-serif; }
    @media (max-width: 768px) {
      #hero-bg-section .hero-bg-inner { height: 260px; }
      #hero-bg-section .hero-bg-text h2 { font-size: 20px; }
      #hero-bg-section .hero-bg-text p { font-size: 12px; }
    }

    #banner-wrap { width: 100%; margin: 0; overflow: hidden; position: relative; background: #f0f0f0; }
    #banner-slider { position: relative; width: 100%; overflow: hidden; }
    #banner-track { display: flex; transition: transform 0.5s ease; will-change: transform; }
    .banner-slide { flex: 0 0 100%; width: 100%; position: relative; overflow: hidden; display: block; }
    .banner-slide img { width: 100%; height: 700px; object-fit: cover; display: block; pointer-events: none; }
    .banner-slide a { display: block; width: 100%; height: 100%; pointer-events: auto; }
    .banner-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.4); color: #fff; border: 0; cursor: pointer; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; z-index: 10; }
    .banner-arrow.prev { left: 20px; }
    .banner-arrow.next { right: 20px; }
    .banner-arrow[hidden] { display: none; }
    .banner-dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
    .banner-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.5); border: 0; cursor: pointer; padding: 0; }
    .banner-dot.active { background: #fff; }
    .banner-dots[hidden] { display: none; }

    #promo-video-wrap { display: none; max-width: 1400px; margin: 16px auto 0; padding: 0 16px; box-sizing: border-box; width: 100%; }
    #promo-video-inner { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 10px; overflow: hidden; }
    #promo-video-inner iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    @media (max-width: 768px) { #promo-video-wrap { padding: 0 12px; margin-top: 12px; } #promo-video-inner { border-radius: 8px; } }

    #new-item-heading { display: flex; max-width: 1400px; margin: 24px auto 0; padding: 0 16px; box-sizing: border-box; width: 100%; align-items: center; gap: 10px; }
    #new-item-heading .ni-title { font-size: 20px; font-weight: 800; color: #e53935; letter-spacing: 1px; margin: 0; font-family: 'Bahnschrift Light', sans-serif; }
    #new-item-heading .ni-sub { font-size: 13px; font-weight: 500; color: #888; margin: 0; font-family: 'Bahnschrift Light', sans-serif; }
    #new-item-heading .ni-line { flex: 1; height: 2px; background: linear-gradient(to right, #e53935, transparent); border-radius: 2px; }
    body.dark #new-item-heading .ni-sub { color: #aaa; }
    @media (max-width: 768px) {
      #new-item-heading { margin-top: 16px; padding: 0 12px; }
      #new-item-heading .ni-title { font-size: 16px; }
      #new-item-heading .ni-sub { font-size: 11px; }
    }
    #popular-item-heading { display: flex; max-width: 1400px; margin: 32px auto 0; padding: 0 16px; box-sizing: border-box; width: 100%; align-items: center; gap: 10px; }
    #popular-item-heading .ni-title { font-size: 20px; font-weight: 800; color: #f59e0b; letter-spacing: 1px; margin: 0; font-family: 'Bahnschrift Light', sans-serif; }
    #popular-item-heading .ni-sub { font-size: 13px; font-weight: 500; color: #888; margin: 0; font-family: 'Bahnschrift Light', sans-serif; }
    #popular-item-heading .ni-line { flex: 1; height: 2px; background: linear-gradient(to right, #f59e0b, transparent); border-radius: 2px; }
    body.dark #popular-item-heading .ni-sub { color: #aaa; }

    #product-container { max-width: 1400px; margin: 0 auto; padding: 0 16px; box-sizing: border-box; width: 100%; margin-top: 16px; }
    #product-list, #popular-list { display: grid; gap: 16px; width: 100%; box-sizing: border-box; }
    #product-list .card, #popular-list .card { min-width: 0; display: block; box-sizing: border-box; text-decoration: none; color: inherit; position: relative; }
    #product-list .card .thumb, #popular-list .card .thumb { width: 100%; padding-bottom: 100%; position: relative; overflow: hidden; border-radius: 10px; background-color: #f0f0f0; background-size: cover; background-position: center; }
    #product-list .card .card-info, #popular-list .card .card-info { padding: 10px 4px; min-width: 0; }
    #product-list .card .name, #popular-list .card .name { font-size: 14px; font-weight: 500; color: #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'Bahnschrift Light', sans-serif; }
    body.dark #product-list .card .name, body.dark #popular-list .card .name { color: #e5e7eb; }
    /* ⭐ 가격: ₩ + Bahnschrift Light */
    #product-list .card .price, #popular-list .card .price { color: #e53935; font-weight: 700; font-size: 15px; margin-top: 4px; font-family: 'Bahnschrift Light', sans-serif; }
    #product-list .card .price.locked, #popular-list .card .price.locked { color: #1976d2; font-size: 12px; font-weight: 600; }
    #product-list .card .new-badge { position: absolute; top: 8px; left: 8px; background: #e53935; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; z-index: 2; font-family: 'Bahnschrift Light', sans-serif; }
    #product-list .card .grade-badge { position: absolute; top: 8px; right: 8px; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px; z-index: 2; font-family: 'Bahnschrift Light', sans-serif; }
    #product-list .card .grade-badge.wholesale { background: #f59e0b; }
    #product-list .card .grade-badge.vip { background: #a855f7; }
    #popular-list .card .rank-badge { position: absolute; top: 8px; left: 8px; background: #f59e0b; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; z-index: 2; font-family: 'Bahnschrift Light', sans-serif; }
    #popular-list .card .rank-badge.rank-1 { background: #e53935; }
    #popular-list .card .rank-badge.rank-2 { background: #f97316; }
    #popular-list .card .rank-badge.rank-3 { background: #ca8a04; }

    #pagination, #popular-pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 20px; margin-bottom: 40px; flex-wrap: wrap; width: 100%; box-sizing: border-box; min-height: 50px; }

    @media (max-width: 768px) {
      .banner-slide img { height: 260px; }
      .banner-arrow { width: 38px; height: 38px; font-size: 18px; }
      .banner-arrow.prev { left: 10px; }
      .banner-arrow.next { right: 10px; }
      .banner-dots { bottom: 12px; gap: 6px; }
      .banner-dot { width: 8px; height: 8px; }
    }

    #board-section { max-width: 1400px; margin: 32px auto 0; padding: 0 16px; box-sizing: border-box; width: 100%; }
    .board-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .board-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; min-height: 320px; }
    body.dark .board-card { background: #151515; border-color: #222; }
    .board-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #eee; gap: 8px; }
    body.dark .board-card-head { border-bottom-color: #222; }
    .board-card-head h3 { font-size: 16px; font-weight: 700; color: #222; margin: 0; font-family: 'Bahnschrift Light', sans-serif; }
    body.dark .board-card-head h3 { color: #fff; }
    .board-count { font-size: 11px; color: #9ca3af; font-weight: 400; }
    .board-write-btn { padding: 6px 12px; background: #111827; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; font-family: 'Bahnschrift Light', sans-serif; }
    body.dark .board-write-btn { background: #e5e7eb; color: #111; }
    .board-list { display: flex; flex-direction: column; gap: 0; flex: 1; min-height: 200px; }
    .board-empty { text-align: center; color: #9ca3af; font-size: 13px; padding: 30px 10px; }
    .board-item { padding: 12px 4px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    body.dark .board-item { border-bottom-color: #222; }
    .board-item:hover { background: #fafafa; }
    body.dark .board-item:hover { background: #1a1a1a; }
    .board-item:last-child { border-bottom: none; }
    .board-item-title-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .board-item-title { font-size: 14px; font-weight: 600; color: #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
    body.dark .board-item-title { color: #e5e7eb; }
    .board-secret-badge { font-size: 10px; background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 4px; font-weight: 700; flex-shrink: 0; border: 1px solid #f59e0b; }
    .board-item-meta { font-size: 11px; color: #9ca3af; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
    .board-pagination { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 12px; flex-wrap: wrap; }
    .board-pagination button { min-width: 28px; height: 28px; padding: 0 8px; border: 1px solid #e5e7eb; background: #fff; color: #374151; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; }
    .board-pagination button.active { background: #111827; color: #fff; border-color: #111827; }
    .board-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .board-admin-actions button { padding: 3px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; font-family: inherit; font-weight: 600; border: 0; }
    .board-del-btn { background: #dc2626; color: #fff; }

    .board-modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 999998; display: flex; align-items: flex-start; justify-content: center; padding: 20px 10px; overflow-y: auto; }
    .board-modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 520px; margin: 20px auto; box-sizing: border-box; }
    body.dark .board-modal-box { background: #151515; color: #e5e7eb; }
    .board-modal-box h2 { margin: 0 0 16px; font-size: 18px; color: #111; font-family: 'Bahnschrift Light', sans-serif; }
    body.dark .board-modal-box h2 { color: #fff; }
    .board-modal-form { display: grid; gap: 10px; }
    .board-modal-form label { font-size: 13px; font-weight: 600; color: #374151; display: block; margin-bottom: 4px; }
    body.dark .board-modal-form label { color: #ccc; }
    .board-modal-form input, .board-modal-form textarea { width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; font-family: inherit; box-sizing: border-box; background: #fff; color: #111; }
    body.dark .board-modal-form input, body.dark .board-modal-form textarea { background: #0f0f0f; border-color: #2a2a2a; color: #e5e7eb; }
    .board-modal-form textarea { min-height: 120px; resize: vertical; }
    .board-secret-check { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #374151; cursor: pointer; padding: 8px 0; }
    .board-secret-check input { width: 18px; height: 18px; accent-color: #111827; }
    .board-modal-actions { display: flex; gap: 8px; margin-top: 6px; }
    .board-modal-actions > * { flex: 1; padding: 11px; border-radius: 8px; font-weight: 600; font-family: inherit; font-size: 14px; cursor: pointer; }
    .board-modal-submit { background: #111827; color: #fff; border: 0; }
    .board-modal-cancel { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; }
    .board-detail-content { font-size: 14px; line-height: 1.7; color: #374151; white-space: pre-wrap; word-break: break-word; padding: 12px; background: #f9fafb; border-radius: 8px; min-height: 100px; margin-bottom: 12px; }
    body.dark .board-detail-content { background: #0f0f0f; color: #d1d5db; }
    .board-detail-meta { font-size: 12px; color: #9ca3af; margin-bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    @media (max-width: 768px) {
      .board-grid { grid-template-columns: 1fr; }
      .board-card { min-height: 240px; }
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <section id="hero-bg-section">
    <div class="hero-bg-inner" id="hero-bg-inner">
      <div class="hero-bg-overlay">
        <div class="hero-bg-text">
          <h2>Simple life' StockingStory</h2>
          <p>당신의 일상에 심플함을 더하다</p>
        </div>
      </div>
    </div>
  </section>

  <div id="banner-wrap" style="display:none;">
    <div id="banner-slider">
      <div id="banner-track"></div>
      <button type="button" class="banner-arrow prev" id="banner-prev" aria-label="이전" hidden>‹</button>
      <button type="button" class="banner-arrow next" id="banner-next" aria-label="다음" hidden>›</button>
      <div class="banner-dots" id="banner-dots" hidden></div>
    </div>
  </div>

  <div id="promo-video-wrap"><div id="promo-video-inner"></div></div>

  <div id="new-item-heading">
    <h2 class="ni-title">NEW ITEM</h2>
    <span class="ni-sub">신규상품</span>
    <span class="ni-line"></span>
  </div>

  <main id="product-container">
    <div id="product-list">로딩중...</div>
    <div id="pagination"></div>
  </main>

  <div id="popular-item-heading">
    <h2 class="ni-title">BEST ITEM</h2>
    <span class="ni-sub">인기상품</span>
    <span class="ni-line"></span>
  </div>

  <main id="popular-container" style="max-width:1400px; margin:0 auto; padding:0 16px; box-sizing:border-box; width:100%; margin-top:16px;">
    <div id="popular-list">로딩중...</div>
    <div id="popular-pagination"></div>
  </main>

  <div id="board-section">
    <div class="board-grid">
      <div class="board-card">
        <div class="board-card-head">
          <h3>📢 공지사항 <span class="board-count" id="notice-count"></span></h3>
        </div>
        <div id="notice-list" class="board-list"><p class="board-empty">로딩중...</p></div>
        <div id="notice-pagination" class="board-pagination"></div>
      </div>
      <div class="board-card">
        <div class="board-card-head">
          <h3>💬 상품문의 / 게시판 <span class="board-count" id="board-count"></span></h3>
          <button type="button" id="board-write-btn" class="board-write-btn">✏️ 글쓰기</button>
        </div>
        <div id="board-list" class="board-list"><p class="board-empty">로딩중...</p></div>
        <div id="board-pagination" class="board-pagination"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
    const db = window.db;
  </script>

  <script>
    const isPC = () => window.innerWidth >= 769;
    const PC_PER_PAGE = 30, MOBILE_PER_PAGE = 10;
    const PC_MAX_PAGES = 10, MOBILE_MAX_PAGES = 5;
    let allProducts = [], filteredProducts = [], currentPage = 1;
    let popularProducts = [], popularCurrentPage = 1;
    const won = n => '₩ ' + Number(n || 0).toLocaleString();

    function getMember() { try { return JSON.parse(localStorage.getItem('member') || 'null'); } catch { return null; } }
    function isLoggedIn() { const m = getMember(); return !!(m && m.id); }
    function getMemberGrade() { return getMember()?.grade || '일반회원'; }
    function isNewProduct(p) { if (!p || !p.created_at) return false; const c = new Date(p.created_at).getTime(); return !isNaN(c) && (Date.now() - c) < 7*24*60*60*1000; }
    function shouldHidePrice(p) { return !isLoggedIn() && isNewProduct(p); }

    // ⭐ [요청9] 비로그인 시 일반상품만 / 로그인 시 등급별 필터
    // 일반회원: 일반상품(all)
    // 도매회원: 일반상품(all, 열람만) + 도매상품(wholesale)
    // VIP회원: 일반상품(all) + VIP상품(vip)
    function filterProductsByGrade(products) {
      if (!isLoggedIn()) return products.filter(p => (p.target_grade || 'all') === 'all');
      const grade = getMemberGrade();
      return products.filter(p => {
        const tg = p.target_grade || 'all';
        if (tg === 'all') return true;
        if (tg === 'wholesale') return grade === '도매회원';
        if (tg === 'vip') return grade === 'VIP회원';
        return false;
      });
    }

    async function loadPromoVideo() {
      const wrap = document.getElementById('promo-video-wrap');
      const inner = document.getElementById('promo-video-inner');
      try {
        const { data } = await db.from('settings').select('value').eq('key', 'promo_video_url').maybeSingle();
        const url = data?.value || '';
        if (!url) { wrap.style.display = 'none'; inner.innerHTML = ''; return; }
        const embed = getVideoEmbedUrl(url);
        inner.innerHTML = `<iframe src="${embed}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`;
        wrap.style.display = 'block';
      } catch { wrap.style.display = 'none'; }
    }

    async function loadHeroBg() {
      try {
        const { data } = await db.from('settings').select('value').eq('key', 'hero_bg_image').maybeSingle();
        const url = data?.value || '';
        if (!url) { document.getElementById('hero-bg-section').classList.remove('show'); return; }
        const bannerWrap = document.getElementById('banner-wrap');
        if (bannerWrap && bannerWrap.style.display !== 'none' && bannerWrap.querySelector('.banner-slide')) {
          document.getElementById('hero-bg-section').classList.remove('show');
          return;
        }
        document.getElementById('hero-bg-inner').style.backgroundImage = `url('${url}')`;
        document.getElementById('hero-bg-section').classList.add('show');
      } catch {}
    }

    const AUTO_INTERVAL = 5000;
    let bannerList = [], bannerIndex = 0, autoTimer = null;

    async function loadBanner() {
      const wrap = document.getElementById('banner-wrap');
      const track = document.getElementById('banner-track');
      const dotsEl = document.getElementById('banner-dots');
      const prevBtn = document.getElementById('banner-prev');
      const nextBtn = document.getElementById('banner-next');
      const container = document.getElementById('product-container');
      const { data, error } = await db.from('banners').select('*').order('id', { ascending: false });
      if (error || !data || data.length === 0) {
        wrap.style.display = 'none'; bannerList = [];
        if (container) container.classList.add('no-banner');
        return;
      }
      bannerList = data.filter(b => b.image_url);
      if (bannerList.length === 0) { wrap.style.display = 'none'; return; }
      wrap.style.display = 'block';
      if (container) container.classList.remove('no-banner');
      track.innerHTML = bannerList.map((b, i) => {
        const img = `<img src="${b.image_url}" alt="배너 ${i + 1}" loading="${i === 0 ? 'eager' : 'lazy'}">`;
        return b.link_url ? `<div class="banner-slide"><a href="${b.link_url}" target="_blank" rel="noopener noreferrer">${img}</a></div>` : `<div class="banner-slide">${img}</div>`;
      }).join('');
      if (bannerList.length > 1) {
        dotsEl.hidden = false; prevBtn.hidden = false; nextBtn.hidden = false;
        dotsEl.innerHTML = bannerList.map((_, i) => `<button type="button" class="banner-dot ${i === 0 ? 'active' : ''}" data-idx="${i}"></button>`).join('');
        dotsEl.querySelectorAll('.banner-dot').forEach(dot => dot.addEventListener('click', () => { goToBanner(Number(dot.dataset.idx)); restartAuto(); }));
        prevBtn.onclick = () => { goToBanner(bannerIndex - 1); restartAuto(); };
        nextBtn.onclick = () => { goToBanner(bannerIndex + 1); restartAuto(); };
        startAuto();
      } else {
        dotsEl.hidden = true; prevBtn.hidden = true; nextBtn.hidden = true; dotsEl.innerHTML = '';
        stopAuto();
      }
      bannerIndex = 0; goToBanner(0);
    }
    function goToBanner(idx) {
      const track = document.getElementById('banner-track');
      const dotsEl = document.getElementById('banner-dots');
      if (!track || bannerList.length === 0) return;
      bannerIndex = ((idx % bannerList.length) + bannerList.length) % bannerList.length;
      track.style.transform = `translateX(-${bannerIndex * 100}%)`;
      if (dotsEl) dotsEl.querySelectorAll('.banner-dot').forEach((d, i) => d.classList.toggle('active', i === bannerIndex));
    }
    function startAuto() { stopAuto(); if (bannerList.length <= 1) return; autoTimer = setInterval(() => goToBanner(bannerIndex + 1), AUTO_INTERVAL); }
    function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
    function restartAuto() { startAuto(); }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') stopAuto();
      else if (bannerList.length > 1) startAuto();
    });

    async function loadProducts() {
      const list = document.getElementById('product-list');
      const { data, error } = await db.from('products').select('*').order('created_at', { ascending: false });
      if (error) { list.innerHTML = '<p>상품을 불러올 수 없습니다.</p>'; return; }
      if (!data || data.length === 0) { list.innerHTML = '<p>등록된 상품이 없습니다.</p>'; return; }
      // ⭐ [요청9] 등급별 필터
      allProducts = filterProductsByGrade(data);
      applyGridColumns();
      currentPage = 1;
      renderPage();
    }

    function applyGridColumns() {
      const cols = isPC() ? 'repeat(6, minmax(0, 1fr))' : 'repeat(2, minmax(0, 1fr))';
      const a = document.getElementById('product-list'); if (a) a.style.gridTemplateColumns = cols;
      const b = document.getElementById('popular-list'); if (b) b.style.gridTemplateColumns = cols;
    }
    function getPerPage() { return isPC() ? PC_PER_PAGE : MOBILE_PER_PAGE; }
    function getMaxPages() { return isPC() ? PC_MAX_PAGES : MOBILE_MAX_PAGES; }
    function bgUrl(url) { if (!url) return 'none'; return `url('${String(url).replace(/'/g, "\\'")}')`; }

    function renderPage() {
      const list = document.getElementById('product-list');
      const perPage = getPerPage();
      const start = (currentPage - 1) * perPage;
      const items = (filteredProducts.length ? filteredProducts : allProducts).slice(start, start + perPage);
      const source = filteredProducts.length ? filteredProducts : allProducts;
      if (source.length === 0) {
        list.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:40px; color:#9ca3af;">표시할 상품이 없습니다.</p>';
        document.getElementById('pagination').innerHTML = ''; return;
      }
      list.innerHTML = items.map(p => {
        const hidePrice = shouldHidePrice(p);
        const isNew = isNewProduct(p);
        const tg = p.target_grade || 'all';
        const newBadge = isNew ? `<span class="new-badge">NEW</span>` : '';
        const gradeBadge = tg === 'wholesale' ? `<span class="grade-badge wholesale">도매</span>` : tg === 'vip' ? `<span class="grade-badge vip">VIP</span>` : '';
        const priceHtml = hidePrice ? `<div class="price locked">🔒 로그인 후 가격 확인</div>` : `<div class="price">${won(p.price)}</div>`;
        return `
          <a class="card" href="product.html?id=${p.id}">
            <div class="thumb" style="background-image: ${bgUrl(p.main_image)};">${newBadge}${gradeBadge}</div>
            <div class="card-info"><div class="name">${p.name}</div>${priceHtml}</div>
          </a>`;
      }).join('');
      renderPagination(source.length);
    }
    function renderPagination(totalCount) {
      const el = document.getElementById('pagination');
      const totalPages = Math.min(Math.ceil(totalCount / getPerPage()), getMaxPages());
      if (totalPages <= 1) { el.innerHTML = ''; return; }
      const btnBase = 'padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; font-family:inherit;';
      let html = `<button class="page-nav" data-page="${currentPage-1}" ${currentPage===1?'disabled':''} style="${btnBase} background:${currentPage===1?'#f5f5f5':'#fff'}; color:${currentPage===1?'#bbb':'#222'}; border:1px solid #ddd;">이전</button>`;
      for (let i = 1; i <= totalPages; i++) html += `<button class="page-num" data-page="${i}" style="${btnBase} background:${i===currentPage?'#222':'#fff'}; color:${i===currentPage?'#fff':'#222'}; border:1px solid ${i===currentPage?'#222':'#ddd'};">${i}</button>`;
      html += `<button class="page-nav" data-page="${currentPage+1}" ${currentPage===totalPages?'disabled':''} style="${btnBase} background:${currentPage===totalPages?'#f5f5f5':'#fff'}; color:${currentPage===totalPages?'#bbb':'#222'}; border:1px solid #ddd;">다음</button>`;
      el.innerHTML = html;
      el.querySelectorAll('.page-num, .page-nav').forEach(b => b.onclick = () => { if (b.disabled) return; currentPage = Number(b.dataset.page); renderPage(); });
    }

    async function loadPopularProducts() {
      const list = document.getElementById('popular-list');
      if (!list) return;
      let products = [];
      try {
        const { data } = await db.from('products').select('*').order('created_at', { ascending: false });
        products = filterProductsByGrade(data || []);
      } catch { list.innerHTML = '<p>상품을 불러올 수 없습니다.</p>'; return; }
      if (products.length === 0) {
        list.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:40px; color:#9ca3af;">등록된 상품이 없습니다.</p>';
        return;
      }
      const viewCountMap = {};
      try {
        const { data: viewData } = await db.from('product_views').select('product_id');
        (viewData || []).forEach(row => { viewCountMap[String(row.product_id)] = (viewCountMap[String(row.product_id)] || 0) + 1; });
      } catch {}
      popularProducts = products.map(p => ({ ...p, _viewCount: viewCountMap[String(p.id)] || 0 }))
        .sort((a, b) => b._viewCount !== a._viewCount ? b._viewCount - a._viewCount : new Date(b.created_at).getTime() - new Date(a.created_at).getTime());
      popularCurrentPage = 1;
      renderPopularPage();
    }
    function renderPopularPage() {
      const list = document.getElementById('popular-list');
      const perPage = getPerPage();
      const start = (popularCurrentPage - 1) * perPage;
      const items = popularProducts.slice(start, start + perPage);
      if (popularProducts.length === 0) { list.innerHTML = ''; return; }
      list.innerHTML = items.map((p, idx) => {
        const rank = start + idx + 1;
        const hidePrice = shouldHidePrice(p);
        const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
        const rankBadge = rank <= 20 ? `<span class="rank-badge ${rankClass}">#${rank}</span>` : '';
        const priceHtml = hidePrice ? `<div class="price locked">🔒 로그인 후 가격 확인</div>` : `<div class="price">${won(p.price)}</div>`;
        return `
          <a class="card" href="product.html?id=${p.id}">
            <div class="thumb" style="background-image: ${bgUrl(p.main_image)};">${rankBadge}</div>
            <div class="card-info"><div class="name">${p.name}</div>${priceHtml}</div>
          </a>`;
      }).join('');
      renderPopularPagination();
    }
    function renderPopularPagination() {
      const el = document.getElementById('popular-pagination');
      const totalPages = Math.min(Math.ceil(popularProducts.length / getPerPage()), getMaxPages());
      if (totalPages <= 1) { el.innerHTML = ''; return; }
      const btnBase = 'padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; font-family:inherit;';
      let html = `<button class="page-nav" data-page="${popularCurrentPage-1}" ${popularCurrentPage===1?'disabled':''} style="${btnBase} background:${popularCurrentPage===1?'#f5f5f5':'#fff'}; color:${popularCurrentPage===1?'#bbb':'#222'}; border:1px solid #ddd;">이전</button>`;
      for (let i = 1; i <= totalPages; i++) html += `<button class="page-num" data-page="${i}" style="${btnBase} background:${i===popularCurrentPage?'#222':'#fff'}; color:${i===popularCurrentPage?'#fff':'#222'}; border:1px solid ${i===popularCurrentPage?'#222':'#ddd'};">${i}</button>`;
      html += `<button class="page-nav" data-page="${popularCurrentPage+1}" ${popularCurrentPage===totalPages?'disabled':''} style="${btnBase} background:${popularCurrentPage===totalPages?'#f5f5f5':'#fff'}; color:${popularCurrentPage===totalPages?'#bbb':'#222'}; border:1px solid #ddd;">다음</button>`;
      el.innerHTML = html;
      el.querySelectorAll('.page-num, .page-nav').forEach(b => b.onclick = () => { if (b.disabled) return; popularCurrentPage = Number(b.dataset.page); renderPopularPage(); });
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        applyGridColumns();
        renderPage();
        if (popularProducts.length) renderPopularPage();
      }, 200);
    });

    // ===== 게시판 =====
    const NOTICE_PER_PAGE = 5, BOARD_PER_PAGE = 5;
    let noticePage = 1, boardPage = 1, noticeTotal = 0, boardTotal = 0;
    let noticesCache = [], boardCache = [];

    function getLoggedMemberForBoard() { try { return JSON.parse(localStorage.getItem('member') || 'null'); } catch { return null; } }
    function escapeBoardHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    function formatBoardDate(d) {
      if (!d) return '-';
      const dt = new Date(d);
      if (isNaN(dt.getTime())) return '-';
      const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(dt);
      const get = t => parts.find(p => p.type === t)?.value || '00';
      return `${get('year')}-${get('month')}-${get('day')}`;
    }

    async function loadNotices() {
      const listEl = document.getElementById('notice-list');
      const countEl = document.getElementById('notice-count');
      try {
        const from = (noticePage - 1) * NOTICE_PER_PAGE;
        const to = from + NOTICE_PER_PAGE - 1;
        const { data, count, error } = await db.from('notices').select('*', { count: 'exact' }).order('created_at', { ascending: false }).range(from, to);
        if (error) throw error;
        noticesCache = data || [];
        noticeTotal = count || 0;
        countEl.textContent = `총 ${noticeTotal}건`;
        if (!noticesCache.length) { listEl.innerHTML = '<p class="board-empty">등록된 공지사항이 없습니다.</p>'; document.getElementById('notice-pagination').innerHTML = ''; return; }
        listEl.innerHTML = noticesCache.map(n => `
          <div class="board-item" data-id="${n.id}" data-type="notice">
            <div class="board-item-title-row"><span class="board-item-title">📌 ${escapeBoardHtml(n.title)}</span></div>
            <div class="board-item-meta"><span>${formatBoardDate(n.created_at)}</span></div>
          </div>`).join('');
        bindBoardItemEvents('notice');
        renderBoardPagination('notice', noticeTotal, NOTICE_PER_PAGE);
      } catch { listEl.innerHTML = '<p class="board-empty">공지사항을 불러올 수 없습니다.</p>'; }
    }

    async function loadBoardPosts() {
      const listEl = document.getElementById('board-list');
      try {
        const from = (boardPage - 1) * BOARD_PER_PAGE;
        const to = from + BOARD_PER_PAGE - 1;
        const { data, count, error } = await db.from('board_posts').select('*', { count: 'exact' }).order('created_at', { ascending: false }).range(from, to);
        if (error) throw error;
        boardCache = data || [];
        boardTotal = count || 0;
        if (!boardCache.length) { listEl.innerHTML = '<p class="board-empty">등록된 문의글이 없습니다.</p>'; document.getElementById('board-pagination').innerHTML = ''; return; }
        const me = getLoggedMemberForBoard();
        listEl.innerHTML = boardCache.map(b => {
          const isSecret = !!b.is_secret;
          const isMine = me && String(me.id) === String(b.member_id);
          const titleText = isSecret && !isMine ? '🔒 비밀글입니다.' : escapeBoardHtml(b.title);
          return `
            <div class="board-item" data-id="${b.id}" data-type="board">
              <div class="board-item-title-row">
                ${isSecret ? '<span class="board-secret-badge">비밀</span>' : ''}
                <span class="board-item-title">${titleText}</span>
                ${isMine ? `<div class="board-admin-actions"><button type="button" class="board-del-btn" data-id="${b.id}">삭제</button></div>` : ''}
              </div>
              <div class="board-item-meta">
                <span>${escapeBoardHtml(b.member_name || b.member_username || '회원')}</span>
                <span>${formatBoardDate(b.created_at)}</span>
              </div>
            </div>`;
        }).join('');
        bindBoardItemEvents('board');
        renderBoardPagination('board', boardTotal, BOARD_PER_PAGE);
      } catch { listEl.innerHTML = '<p class="board-empty">게시판을 불러올 수 없습니다.</p>'; }
    }

    function renderBoardPagination(type, total, perPage) {
      const el = document.getElementById(type + '-pagination');
      const totalPages = Math.ceil(total / perPage);
      if (totalPages <= 1) { el.innerHTML = ''; return; }
      const cur = type === 'notice' ? noticePage : boardPage;
      let html = `<button ${cur === 1 ? 'disabled' : ''} data-page="${cur-1}" data-type="${type}">‹</button>`;
      for (let i = 1; i <= totalPages; i++) html += `<button class="${i === cur ? 'active' : ''}" data-page="${i}" data-type="${type}">${i}</button>`;
      html += `<button ${cur === totalPages ? 'disabled' : ''} data-page="${cur+1}" data-type="${type}">›</button>`;
      el.innerHTML = html;
      el.querySelectorAll('button').forEach(btn => btn.onclick = () => {
        if (btn.disabled) return;
        const page = Number(btn.dataset.page);
        if (type === 'notice') { noticePage = page; loadNotices(); } else { boardPage = page; loadBoardPosts(); }
      });
    }

    function bindBoardItemEvents(type) {
      const listId = type === 'notice' ? 'notice-list' : 'board-list';
      const listEl = document.getElementById(listId);
      listEl.querySelectorAll('.board-item').forEach(item => {
        item.onclick = e => {
          if (e.target.closest('.board-del-btn')) return;
          const id = item.dataset.id;
          if (type === 'notice') { const n = noticesCache.find(x => String(x.id) === String(id)); if (n) showBoardDetailModal('notice', n); }
          else {
            const b = boardCache.find(x => String(x.id) === String(id));
            if (b) {
              const me = getLoggedMemberForBoard();
              const isMine = me && String(me.id) === String(b.member_id);
              if (b.is_secret && !isMine) { alert('🔒 비밀글입니다. 작성자만 열람할 수 있습니다.'); return; }
              showBoardDetailModal('board', b);
            }
          }
        };
      });
      listEl.querySelectorAll('.board-del-btn').forEach(btn => btn.onclick = async e => {
        e.stopPropagation();
        if (!confirm('이 글을 삭제할까요?')) return;
        const { error } = await db.from('board_posts').delete().eq('id', btn.dataset.id);
        if (error) { alert('❌ 삭제 실패: ' + error.message); return; }
        alert('✅ 삭제되었습니다.');
        loadBoardPosts();
      });
    }

    function showBoardDetailModal(type, data) {
      const modal = document.createElement('div');
      modal.className = 'board-modal-backdrop';
      const title = type === 'notice' ? '📢 공지사항' : '💬 문의글';
      const author = type === 'board' ? (data.member_name || data.member_username || '회원') : '관리자';
      modal.innerHTML = `
        <div class="board-modal-box">
          <h2>${title}</h2>
          <div class="board-detail-meta">
            <span>작성자: ${escapeBoardHtml(author)}</span>
            <span>${formatBoardDate(data.created_at)}</span>
            ${data.is_secret ? '<span class="board-secret-badge">비밀글</span>' : ''}
          </div>
          <div style="font-weight:700; font-size:15px; margin-bottom:10px; color:#111; padding:0 4px;">${escapeBoardHtml(data.title)}</div>
          <div class="board-detail-content">${escapeBoardHtml(data.content)}</div>
          <div class="board-modal-actions"><button type="button" class="board-modal-cancel" id="board-detail-close">닫기</button></div>
        </div>`;
      document.body.appendChild(modal);
      modal.querySelector('#board-detail-close').onclick = () => modal.remove();
      modal.onclick = e => { if (e.target === modal) modal.remove(); };
    }

    function showBoardWriteModal() {
      const me = getLoggedMemberForBoard();
      if (!me || !me.id) { alert('로그인 후 이용 가능합니다.'); location.href = 'login.html'; return; }
      const modal = document.createElement('div');
      modal.className = 'board-modal-backdrop';
      modal.innerHTML = `
        <div class="board-modal-box">
          <h2>✏️ 문의글 작성</h2>
          <form id="board-write-form" class="board-modal-form">
            <div><label>제목 *</label><input name="title" required maxlength="100"></div>
            <div><label>내용 *</label><textarea name="content" required></textarea></div>
            <label class="board-secret-check"><input type="checkbox" name="is_secret"> 🔒 비밀글로 작성</label>
            <div class="board-modal-actions">
              <button type="submit" class="board-modal-submit">등록</button>
              <button type="button" class="board-modal-cancel" id="board-write-cancel">취소</button>
            </div>
          </form>
        </div>`;
      document.body.appendChild(modal);
      modal.querySelector('#board-write-cancel').onclick = () => modal.remove();
      modal.querySelector('#board-write-form').onsubmit = async e => {
        e.preventDefault();
        const f = e.target;
        const btn = f.querySelector('button[type="submit"]');
        btn.disabled = true; btn.textContent = '등록 중...';
        const { error } = await db.from('board_posts').insert({
          member_id: me.id, member_name: me.name || '', member_username: me.username || '',
          title: f.title.value.trim(), content: f.content.value.trim(), is_secret: f.is_secret.checked,
        });
        if (error) { alert('❌ 등록 실패: ' + error.message); btn.disabled = false; btn.textContent = '등록'; return; }
        alert('✅ 등록되었습니다.');
        modal.remove(); boardPage = 1; loadBoardPosts();
      };
    }
    document.getElementById('board-write-btn')?.addEventListener('click', showBoardWriteModal);

    (async () => {
      await Promise.all([loadBanner(), loadPromoVideo(), loadProducts(), loadPopularProducts(), loadNotices(), loadBoardPosts()]);
      await loadHeroBg();
    })();
  </script>
</body>
</html>
