<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STK스토리 심플라이프</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    html { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    body {
      overflow-x: hidden;
      width: 100%; max-width: 100%;
      margin: 0;
      background: #0a0a0a;
      color: #e5e7eb;
    }
    #banner-wrap {
      width: 100vw;
      position: relative;
      left: 50%;
      margin-left: -50vw;
      margin-bottom: 24px;
      overflow: hidden;
    }
    #product-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 16px;
      box-sizing: border-box;
      width: 100%;
      margin-top: 32px;
    }
    @media (max-width: 768px) { #product-container { margin-top: 24px; } }

    #product-list {
      display: grid;
      gap: 16px;
      width: 100%;
      box-sizing: border-box;
    }
    #product-list .card {
      min-width: 0;
      display: block;
      box-sizing: border-box;
      text-decoration: none;
      color: inherit;
      -webkit-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    #product-list .card .thumb {
      width: 100%;
      padding-bottom: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background-color: #151515;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      -webkit-background-size: cover;
      -webkit-transform: translate3d(0, 0, 0);
      transform: translate3d(0, 0, 0);
      border: 1px solid #222;
    }
    #product-list .card .thumb img { display: none; }
    #product-list .card .card-info {
      padding: 10px 4px;
      min-width: 0;
    }
    #product-list .card .name {
      font-size: 14px;
      font-weight: 500;
      color: #e5e7eb;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #product-list .card .price {
      color: #ef4444;
      font-weight: 700;
      font-size: 15px;
      margin-top: 4px;
    }
    #pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      width: 100%;
      box-sizing: border-box;
      min-height: 50px;
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <div id="banner-wrap" style="display:none;">
    <div id="banner-inner"></div>
  </div>

  <main id="product-container">
    <div id="product-list">로딩중...</div>
    <div id="pagination"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
    const db = window.db;
  </script>

  <script>
    const isPC = () => window.innerWidth >= 769;
    const PC_PER_PAGE = 30;
    const PC_MAX_PAGES = 10;
    const MOBILE_PER_PAGE = 10;
    const MOBILE_MAX_PAGES = 5;

    let allProducts = [];
    let currentPage = 1;

    async function loadBanner() {
      const wrap = document.getElementById('banner-wrap');
      const inner = document.getElementById('banner-inner');
      const { data, error } = await db.from('banners').select('*')
        .order('id', { ascending: false }).limit(1).maybeSingle();
      if (error || !data || !data.image_url) {
        wrap.style.display = 'none';
        return;
      }
      wrap.style.display = isPC() ? 'block' : 'none';
      const imgHtml = `<img src="${data.image_url}" alt="배너" style="width:100%; height:700px; object-fit:cover; display:block;">`;
      inner.innerHTML = data.link_url ? `<a href="${data.link_url}" style="display:block; width:100%;">${imgHtml}</a>` : imgHtml;
    }

    async function loadProducts() {
      const list = document.getElementById('product-list');
      const { data, error } = await db.from('products').select('*').order('created_at', { ascending: false });
      if (error) { list.innerHTML = '<p>상품을 불러올 수 없습니다.</p>'; return; }
      if (!data || data.length === 0) {
        list.innerHTML = '<p style="color:#888;">등록된 상품이 없습니다.</p>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      allProducts = data;
      currentPage = 1;
      applyGridColumns();
      renderPage();
    }

    function applyGridColumns() {
      const list = document.getElementById('product-list');
      list.style.gridTemplateColumns = isPC()
        ? 'repeat(6, minmax(0, 1fr))'
        : 'repeat(2, minmax(0, 1fr))';
    }

    function getPerPage() { return isPC() ? PC_PER_PAGE : MOBILE_PER_PAGE; }
    function getMaxPages() { return isPC() ? PC_MAX_PAGES : MOBILE_MAX_PAGES; }

    function bgUrl(url) {
      if (!url) return 'none';
      const safe = String(url).replace(/'/g, "\\'").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
      return `url('${safe}')`;
    }

    function renderPage() {
      const list = document.getElementById('product-list');
      const perPage = getPerPage();
      const start = (currentPage - 1) * perPage;
      const items = allProducts.slice(start, start + perPage);

      list.innerHTML = items.map(p => `
        <a class="card" href="product.html?id=${p.id}">
          <div class="thumb" style="background-image: ${bgUrl(p.main_image)};"></div>
          <div class="card-info">
            <div class="name">${p.name}</div>
            <div class="price">${Number(p.price).toLocaleString()}원</div>
          </div>
        </a>
      `).join('');

      renderPagination();
    }

    function renderPagination() {
      const el = document.getElementById('pagination');
      const perPage = getPerPage();
      const maxPages = getMaxPages();
      const totalPages = Math.min(Math.ceil(allProducts.length / perPage), maxPages);

      if (totalPages <= 1) { el.innerHTML = ''; return; }

      let html = '';
      const btnBase = 'padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; font-family:inherit; transition:all .15s;';

      html += `<button class="page-nav" data-page="${currentPage-1}" ${currentPage===1?'disabled':''}
        style="${btnBase} background:${currentPage===1?'#151515':'#1f1f1f'}; color:${currentPage===1?'#555':'#e5e7eb'}; border:1px solid #333; cursor:${currentPage===1?'not-allowed':'pointer'};">이전</button>`;

      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-num" data-page="${i}"
          style="${btnBase} background:${i===currentPage?'#e5e7eb':'#1f1f1f'}; color:${i===currentPage?'#111':'#e5e7eb'}; border:1px solid ${i===currentPage?'#e5e7eb':'#333'};">${i}</button>`;
      }

      html += `<button class="page-nav" data-page="${currentPage+1}" ${currentPage===totalPages?'disabled':''}
        style="${btnBase} background:${currentPage===totalPages?'#151515':'#1f1f1f'}; color:${currentPage===totalPages?'#555':'#e5e7eb'}; border:1px solid #333; cursor:${currentPage===totalPages?'not-allowed':'pointer'};">다음</button>`;

      el.innerHTML = html;

      el.querySelectorAll('.page-num, .page-nav').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          currentPage = Number(btn.dataset.page);
          renderPage();
        });
      });
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        applyGridColumns();
        const wrap = document.getElementById('banner-wrap');
        const inner = document.getElementById('banner-inner');
        if (inner.innerHTML.trim()) wrap.style.display = isPC() ? 'block' : 'none';
        const maxP = getMaxPages();
        const totalP = Math.min(Math.ceil(allProducts.length / getPerPage()), maxP);
        if (currentPage > totalP) currentPage = totalP || 1;
        renderPage();
      }, 200);
    });

    (async () => {
      await loadBanner();
      await loadProducts();
    })();
  </script>
</body>
</html>
