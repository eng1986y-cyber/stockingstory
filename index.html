<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simple life' StockingStory</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    html { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    body { overflow-x: hidden; width: 100%; max-width: 100%; margin: 0; }

    #banner-wrap { width: 100%; margin: 0; overflow: hidden; position: relative; background: #f0f0f0; }
    #banner-slider { position: relative; width: 100%; overflow: hidden; }
    #banner-track { display: flex; transition: transform 0.5s ease; will-change: transform; }
    .banner-slide { flex: 0 0 100%; width: 100%; position: relative; overflow: hidden; display: block; }
    .banner-slide img { width: 100%; height: 700px; object-fit: cover; display: block; pointer-events: none; }
    .banner-slide a { display: block; width: 100%; height: 100%; pointer-events: auto; }

    .banner-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.4); color: #fff; border: 0; cursor: pointer; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; z-index: 10; -webkit-tap-highlight-color: transparent; }
    .banner-arrow:hover { background: rgba(0,0,0,0.6); }
    .banner-arrow.prev { left: 20px; }
    .banner-arrow.next { right: 20px; }
    .banner-arrow[hidden] { display: none; }

    .banner-dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
    .banner-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.5); border: 0; cursor: pointer; padding: 0; transition: background 0.2s; -webkit-tap-highlight-color: transparent; }
    .banner-dot.active { background: #fff; }
    .banner-dots[hidden] { display: none; }

    #promo-video-wrap { display: none; max-width: 1400px; margin: 16px auto 0; padding: 0 16px; box-sizing: border-box; width: 100%; }
    #promo-video-inner { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 10px; overflow: hidden; }
    #promo-video-inner iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block; }
    @media (max-width: 768px) { #promo-video-wrap { padding: 0 12px; margin-top: 12px; } #promo-video-inner { border-radius: 8px; } }

    /* NEW ITEM 섹션 표기 */
    #new-item-heading {
      display: none;
      max-width: 1400px;
      margin: 24px auto 0;
      padding: 0 16px;
      box-sizing: border-box;
      width: 100%;
      align-items: center;
      gap: 10px;
    }
    #new-item-heading.show { display: flex; }
    #new-item-heading .ni-title {
      font-size: 20px;
      font-weight: 800;
      color: #e53935;
      letter-spacing: 1px;
      margin: 0;
    }
    #new-item-heading .ni-sub {
      font-size: 13px;
      font-weight: 500;
      color: #888;
      margin: 0;
    }
    #new-item-heading .ni-line {
      flex: 1;
      height: 2px;
      background: linear-gradient(to right, #e53935, transparent);
      border-radius: 2px;
    }
    body.dark #new-item-heading .ni-sub { color: #aaa; }
    @media (max-width: 768px) {
      #new-item-heading { margin-top: 16px; padding: 0 12px; }
      #new-item-heading .ni-title { font-size: 16px; }
      #new-item-heading .ni-sub { font-size: 11px; }
    }

    #product-container { max-width: 1400px; margin: 0 auto; padding: 0 16px; box-sizing: border-box; width: 100%; margin-top: 16px; }
    #product-container.no-banner { margin-top: 24px; }
    @media (max-width: 768px) { #product-container { margin-top: 12px; } }

    #product-list { display: grid; gap: 16px; width: 100%; box-sizing: border-box; }
    #product-list .card { min-width: 0; display: block; box-sizing: border-box; text-decoration: none; color: inherit; -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0); -webkit-backface-visibility: hidden; backface-visibility: hidden; position: relative; }
    #product-list .card .thumb { width: 100%; padding-bottom: 100%; position: relative; overflow: hidden; border-radius: 10px; background-color: #f0f0f0; background-size: cover; background-position: center; background-repeat: no-repeat; -webkit-background-size: cover; -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0); }
    #product-list .card .card-info { padding: 10px 4px; min-width: 0; }
    #product-list .card .name { font-size: 14px; font-weight: 500; color: #222; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body.dark #product-list .card .name { color: #e5e7eb; }
    #product-list .card .price { color: #e53935; font-weight: 700; font-size: 15px; margin-top: 4px; }
    #product-list .card .price.locked { color: #1976d2; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

    #product-list .card .new-badge {
      position: absolute; top: 8px; left: 8px;
      background: #e53935; color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 4px;
      letter-spacing: 0.5px; z-index: 2;
      pointer-events: none;
    }

    #pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 20px; margin-bottom: 40px; flex-wrap: wrap; width: 100%; box-sizing: border-box; min-height: 50px; }

    @media (max-width: 768px) {
      .banner-slide img { height: 260px; }
      .banner-arrow { width: 38px; height: 38px; font-size: 18px; }
      .banner-arrow.prev { left: 10px; }
      .banner-arrow.next { right: 10px; }
      .banner-dots { bottom: 12px; gap: 6px; }
      .banner-dot { width: 8px; height: 8px; }
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <div id="banner-wrap" style="display:none;">
    <div id="banner-slider">
      <div id="banner-track"></div>
      <button type="button" class="banner-arrow prev" id="banner-prev" aria-label="이전 배너" hidden>‹</button>
      <button type="button" class="banner-arrow next" id="banner-next" aria-label="다음 배너" hidden>›</button>
      <div class="banner-dots" id="banner-dots" hidden></div>
    </div>
  </div>

  <div id="promo-video-wrap">
    <div id="promo-video-inner"></div>
  </div>

  <div id="new-item-heading">
    <h2 class="ni-title">NEW ITEM</h2>
    <span class="ni-sub">따끈따끈한 신상</span>
    <span class="ni-line"></span>
  </div>

  <main id="product-container">
    <div id="product-list">로딩중...</div>
    <div id="pagination"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
    const db = window.db;
  </script>

  <script>
    const isPC = () => window.innerWidth >= 769;
    const PC_PER_PAGE = 30;
    const PC_MAX_PAGES = 10;
    const MOBILE_PER_PAGE = 10;
    const MOBILE_MAX_PAGES = 5;

    let allProducts = [];
    let currentPage = 1;

    function isLoggedIn() {
      try {
        const m = JSON.parse(localStorage.getItem('member') || 'null');
        return !!(m && m.id);
      } catch { return false; }
    }

    function isNewProduct(product) {
      if (!product || !product.created_at) return false;
      const created = new Date(product.created_at).getTime();
      if (isNaN(created)) return false;
      return (Date.now() - created) < 7 * 24 * 60 * 60 * 1000;
    }

    function shouldHidePrice(product) {
      return !isLoggedIn() && isNewProduct(product);
    }

    function getYouTubeEmbedUrl(url) {
      if (!url) return '';
      const s = String(url).trim();
      if (!s) return '';
      if (/youtube\.com\/embed\//i.test(s)) return s;
      let m = s.match(/[?&]v=([A-Za-z0-9_-]{6,})/);
      if (m) return `https://www.youtube.com/embed/${m[1]}`;
      m = s.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/);
      if (m) return `https://www.youtube.com/embed/${m[1]}`;
      m = s.match(/youtube\.com\/shorts\/([A-Za-z0-9_-]{6,})/);
      if (m) return `https://www.youtube.com/embed/${m[1]}`;
      return s;
    }

    async function loadPromoVideo() {
      const wrap = document.getElementById('promo-video-wrap');
      const inner = document.getElementById('promo-video-inner');
      try {
        const { data } = await db.from('settings').select('value').eq('key', 'promo_video_url').maybeSingle();
        const url = data?.value || '';
        if (!url) { wrap.style.display = 'none'; inner.innerHTML = ''; return; }
        const embed = getYouTubeEmbedUrl(url);
        inner.innerHTML = `<iframe src="${embed}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`;
        wrap.style.display = 'block';
      } catch (e) { wrap.style.display = 'none'; }
    }

    const AUTO_INTERVAL = 5000;
    let bannerList = [];
    let bannerIndex = 0;
    let autoTimer = null;

    async function loadBanner() {
      const wrap = document.getElementById('banner-wrap');
      const track = document.getElementById('banner-track');
      const dotsEl = document.getElementById('banner-dots');
      const prevBtn = document.getElementById('banner-prev');
      const nextBtn = document.getElementById('banner-next');
      const container = document.getElementById('product-container');

      const { data, error } = await db.from('banners').select('*').order('id', { ascending: false });

      if (error || !data || data.length === 0) {
        wrap.style.display = 'none';
        bannerList = [];
        if (container) container.classList.add('no-banner');
        return;
      }

      bannerList = data.filter(b => b.image_url);
      if (bannerList.length === 0) {
        wrap.style.display = 'none';
        if (container) container.classList.add('no-banner');
        return;
      }

      wrap.style.display = 'block';
      if (container) container.classList.remove('no-banner');

      track.innerHTML = bannerList.map((b, i) => {
        const img = `<img src="${b.image_url}" alt="배너 ${i + 1}" loading="${i === 0 ? 'eager' : 'lazy'}">`;
        return b.link_url
          ? `<div class="banner-slide"><a href="${b.link_url}" target="_blank" rel="noopener noreferrer">${img}</a></div>`
          : `<div class="banner-slide">${img}</div>`;
      }).join('');

      if (bannerList.length > 1) {
        dotsEl.hidden = false;
        prevBtn.hidden = false;
        nextBtn.hidden = false;
        dotsEl.innerHTML = bannerList.map((_, i) =>
          `<button type="button" class="banner-dot ${i === 0 ? 'active' : ''}" data-idx="${i}" aria-label="배너 ${i + 1}"></button>`
        ).join('');
        dotsEl.querySelectorAll('.banner-dot').forEach(dot => {
          dot.addEventListener('click', () => { goToBanner(Number(dot.dataset.idx)); restartAuto(); });
        });
        prevBtn.onclick = () => { goToBanner(bannerIndex - 1); restartAuto(); };
        nextBtn.onclick = () => { goToBanner(bannerIndex + 1); restartAuto(); };
        startAuto();
      } else {
        dotsEl.hidden = true; prevBtn.hidden = true; nextBtn.hidden = true; dotsEl.innerHTML = '';
        stopAuto();
      }
      bannerIndex = 0;
      goToBanner(0);
    }

    function goToBanner(idx) {
      const track = document.getElementById('banner-track');
      const dotsEl = document.getElementById('banner-dots');
      if (!track || bannerList.length === 0) return;
      const total = bannerList.length;
      bannerIndex = ((idx % total) + total) % total;
      track.style.transform = `translateX(-${bannerIndex * 100}%)`;
      if (dotsEl) {
        dotsEl.querySelectorAll('.banner-dot').forEach((d, i) => {
          d.classList.toggle('active', i === bannerIndex);
        });
      }
    }

    function startAuto() { stopAuto(); if (bannerList.length <= 1) return; autoTimer = setInterval(() => goToBanner(bannerIndex + 1), AUTO_INTERVAL); }
    function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
    function restartAuto() { startAuto(); }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') stopAuto();
      else if (bannerList.length > 1) startAuto();
    });

    (function setupSwipe() {
      const slider = document.getElementById('banner-slider');
      if (!slider) return;
      let startX = 0, startY = 0, isSwiping = false;
      slider.addEventListener('touchstart', (e) => {
        if (bannerList.length <= 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isSwiping = true;
        stopAuto();
      }, { passive: true });
      slider.addEventListener('touchmove', (e) => {
        if (!isSwiping) return;
        const dx = Math.abs(e.touches[0].clientX - startX);
        const dy = Math.abs(e.touches[0].clientY - startY);
        if (dx > dy && dx > 10) e.preventDefault();
      }, { passive: false });
      slider.addEventListener('touchend', (e) => {
        if (!isSwiping) return;
        isSwiping = false;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) goToBanner(bannerIndex + 1);
          else goToBanner(bannerIndex - 1);
        }
        if (bannerList.length > 1) startAuto();
      }, { passive: true });
    })();

    // ⭐ NEW ITEM 헤딩 표시/숨김
    function toggleNewItemHeading(show) {
      const el = document.getElementById('new-item-heading');
      if (!el) return;
      el.classList.toggle('show', !!show);
    }

    async function loadProducts() {
      const list = document.getElementById('product-list');
      // ⭐ 일반회원용: target_grade = 'all' 인 상품만 표시
      const { data, error } = await db.from('products').select('*').or('target_grade.eq.all,target_grade.is.null').order('created_at', { ascending: false });
      if (error) { list.innerHTML = '<p>상품을 불러올 수 없습니다.</p>'; return; }
      if (!data || data.length === 0) {
        list.innerHTML = '<p>등록된 상품이 없습니다.</p>';
        document.getElementById('pagination').innerHTML = '';
        toggleNewItemHeading(false);
        return;
      }
      allProducts = data;
      currentPage = 1;

      // ⭐ 신규 상품 존재 여부 확인 후 NEW ITEM 표기
      const hasNew = allProducts.some(p => isNewProduct(p));
      toggleNewItemHeading(hasNew);

      applyGridColumns();
      renderPage();
    }

    function applyGridColumns() {
      const list = document.getElementById('product-list');
      list.style.gridTemplateColumns = isPC() ? 'repeat(6, minmax(0, 1fr))' : 'repeat(2, minmax(0, 1fr))';
    }

    function getPerPage() { return isPC() ? PC_PER_PAGE : MOBILE_PER_PAGE; }
    function getMaxPages() { return isPC() ? PC_MAX_PAGES : MOBILE_MAX_PAGES; }

    function bgUrl(url) {
      if (!url) return 'none';
      const safe = String(url).replace(/'/g, "\\'").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
      return `url('${safe}')`;
    }

    function renderPage() {
      const list = document.getElementById('product-list');
      const perPage = getPerPage();
      const start = (currentPage - 1) * perPage;
      const items = allProducts.slice(start, start + perPage);

      list.innerHTML = items.map(p => {
        const hidePrice = shouldHidePrice(p);
        const isNew = isNewProduct(p);
        const newBadge = isNew ? `<span class="new-badge">NEW</span>` : '';
        const priceHtml = hidePrice
          ? `<div class="price locked">🔒 로그인 후 가격 확인</div>`
          : `<div class="price">${Number(p.price).toLocaleString()}원</div>`;
        return `
          <a class="card" href="product.html?id=${p.id}">
            <div class="thumb" style="background-image: ${bgUrl(p.main_image)};">
              ${newBadge}
            </div>
            <div class="card-info">
              <div class="name">${p.name}</div>
              ${priceHtml}
            </div>
          </a>
        `;
      }).join('');

      renderPagination();
    }

    function renderPagination() {
      const el = document.getElementById('pagination');
      const perPage = getPerPage();
      const maxPages = getMaxPages();
      const totalPages = Math.min(Math.ceil(allProducts.length / perPage), maxPages);

      if (totalPages <= 1) { el.innerHTML = ''; return; }

      let html = '';
      const btnBase = 'padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; font-family:inherit; transition:all .15s;';

      html += `<button class="page-nav" data-page="${currentPage-1}" ${currentPage===1?'disabled':''}
        style="${btnBase} background:${currentPage===1?'#f5f5f5':'#fff'}; color:${currentPage===1?'#bbb':'#222'}; border:1px solid #ddd; cursor:${currentPage===1?'not-allowed':'pointer'};">이전</button>`;

      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-num" data-page="${i}"
          style="${btnBase} background:${i===currentPage?'#222':'#fff'}; color:${i===currentPage?'#fff':'#222'}; border:1px solid ${i===currentPage?'#222':'#ddd'};">${i}</button>`;
      }

      html += `<button class="page-nav" data-page="${currentPage+1}" ${currentPage===totalPages?'disabled':''}
        style="${btnBase} background:${currentPage===totalPages?'#f5f5f5':'#fff'}; color:${currentPage===totalPages?'#bbb':'#222'}; border:1px solid #ddd; cursor:${currentPage===totalPages?'not-allowed':'pointer'};">다음</button>`;

      el.innerHTML = html;

      el.querySelectorAll('.page-num, .page-nav').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          currentPage = Number(btn.dataset.page);
          renderPage();
        });
      });
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        applyGridColumns();
        const maxP = getMaxPages();
        const totalP = Math.min(Math.ceil(allProducts.length / getPerPage()), maxP);
        if (currentPage > totalP) currentPage = totalP || 1;
        renderPage();
      }, 200);
    });

    (async () => {
      await loadBanner();
      await loadPromoVideo();
      await loadProducts();
    })();
  </script>
</body>
</html>
