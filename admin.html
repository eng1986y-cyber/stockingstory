<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>관리자 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js" defer></script>
</head>
<body>
  <header>
    <h1><a href="index.html">🛍️ 심플몰</a> - 관리자</h1>
  </header>

  <main>
    <div id="login-screen" style="display:none; max-width:360px; margin:60px auto;">
      <h2 style="margin-bottom:16px;">관리자 로그인</h2>
      <form id="login-form" style="display:grid; gap:10px; background:#fff; padding:20px; border-radius:8px;">
        <input name="email" type="email" placeholder="이메일" required
          style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <input name="password" type="password" placeholder="비밀번호" required
          style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <button type="submit"
          style="padding:12px; background:#222; color:#fff; border:0; border-radius:6px; cursor:pointer;">
          로그인
        </button>
      </form>
      <p id="login-msg" style="margin-top:12px; font-weight:600;"></p>
    </div>

    <div id="admin-screen" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2>상품 등록</h2>
        <button id="logout-btn"
          style="padding:8px 14px; background:#999; color:#fff; border:0; border-radius:6px; cursor:pointer; font-size:13px;">
          로그아웃
        </button>
      </div>

      <form id="product-form">
        <input name="name" placeholder="상품명" required>
        <input name="price" type="number" placeholder="가격 (숫자만)" required>
        <textarea name="description" placeholder="상품 설명"></textarea>
        <input name="main_image" placeholder="메인 이미지 URL (필수)" required>
        <textarea name="detail_images" placeholder="상세 이미지 URL (한 줄에 하나씩)"></textarea>
        <input name="colors" placeholder="색상 (쉼표로 구분: 빨강,파랑,검정)">
        <input name="sizes" placeholder="사이즈 (쉼표로 구분: S,M,L,XL)">
        <input name="extra_options" placeholder="추가옵션 (쉼표로 구분: 각인,포장)">
        <input name="shipping_fee" type="number" min="0" value="0" placeholder="배송비 (0이면 무료)">
        <button type="submit">등록하기</button>
      </form>

      <p id="msg" style="margin-top:12px; font-weight:600;"></p>

      <h2 style="margin:32px 0 16px;">등록된 상품</h2>
      <div id="admin-list" style="display:grid; gap:10px;">로딩중...</div>

      <h2 style="margin:32px 0 16px;">주문 목록</h2>
      <div id="order-list" style="display:grid; gap:10px;">로딩중...</div>

      <h2 style="margin:32px 0 16px;">회원 목록</h2>
      <div id="member-list" style="display:grid; gap:8px;">로딩중...</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const loginScreen = document.getElementById('login-screen');
    const adminScreen = document.getElementById('admin-screen');
    const loginForm = document.getElementById('login-form');
    const loginMsg = document.getElementById('login-msg');

    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) showAdmin();
      else showLogin();
    }

    function showLogin() {
      loginScreen.style.display = 'block';
      adminScreen.style.display = 'none';
    }

    function showAdmin() {
      loginScreen.style.display = 'none';
      adminScreen.style.display = 'block';
      loadAdminList();
      loadOrders();
      loadMembers();
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginMsg.textContent = '로그인 중...';
      loginMsg.style.color = '#222';

      const { error } = await db.auth.signInWithPassword({
        email: loginForm.email.value.trim(),
        password: loginForm.password.value,
      });

      if (error) {
        loginMsg.style.color = 'crimson';
        loginMsg.textContent = '❌ ' + error.message;
      } else {
        loginMsg.textContent = '';
        showAdmin();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await db.auth.signOut();
      showLogin();
    });

    const form = document.getElementById('product-form');
    const msg = document.getElementById('msg');
    const listEl = document.getElementById('admin-list');

    const parseList = (str) =>
      (str || '').split(',').map(s => s.trim()).filter(Boolean);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const detail_images = form.detail_images.value
        .split('\n').map(s => s.trim()).filter(Boolean);

      msg.textContent = '등록 중...';
      msg.style.color = '#222';

      const { error } = await db.from('products').insert({
        name: form.name.value.trim(),
        price: Number(form.price.value),
        description: form.description.value.trim(),
        main_image: form.main_image.value.trim(),
        detail_images,
        colors: parseList(form.colors.value),
        sizes: parseList(form.sizes.value),
        extra_options: parseList(form.extra_options.value),
        shipping_fee: Number(form.shipping_fee.value) || 0,
      });

      if (error) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ ' + error.message;
      } else {
        msg.style.color = 'green';
        msg.textContent = '✅ 등록 완료!';
        form.reset();
        loadAdminList();
      }
    });

    // ===== 상품 목록 (1줄 요약 + 클릭 펼침) =====
    async function loadAdminList() {
      const { data, error } = await db
        .from('products').select('*')
        .order('created_at', { ascending: false });

      if (error) { listEl.innerHTML = '<p>불러오기 실패</p>'; return; }
      if (!data || data.length === 0) {
        listEl.innerHTML = '<p>등록된 상품이 없습니다.</p>'; return;
      }

      listEl.innerHTML = data.map(p => `
        <div class="product-row"
          style="background:#fff; border-radius:8px; border-left:4px solid #1976d2; overflow:hidden;">
          <div class="product-summary"
            style="padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer;">
            <img src="${p.main_image}" alt="${p.name}"
              style="width:44px; height:44px; object-fit:cover; border-radius:6px; flex-shrink:0;">
            <div style="flex:1; min-width:0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <span style="font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px;">
                ${p.name}
              </span>
              <span style="font-size:13px; color:#e53935; font-weight:700; white-space:nowrap;">
                ${Number(p.price).toLocaleString()}원
              </span>
              <span style="font-size:12px; color:#888; white-space:nowrap;">
                ${p.shipping_fee > 0 ? '배송비 ' + p.shipping_fee.toLocaleString() + '원' : '무료배송'}
              </span>
            </div>
            <span class="product-arrow" style="color:#888; font-size:12px; transition:transform .2s;">▼</span>
          </div>

          <div class="product-detail" style="display:none; padding:0 14px 14px; font-size:13px; line-height:1.8; color:#333; border-top:1px solid #eee;">
            <div style="padding-top:10px;">
              ${p.description ? `<div><span style="color:#888;">설명:</span> ${p.description}</div>` : ''}
              ${(p.colors && p.colors.length) ? `<div><span style="color:#888;">색상:</span> ${p.colors.join(', ')}</div>` : ''}
              ${(p.sizes && p.sizes.length) ? `<div><span style="color:#888;">사이즈:</span> ${p.sizes.join(', ')}</div>` : ''}
              ${(p.extra_options && p.extra_options.length) ? `<div><span style="color:#888;">추가옵션:</span> ${p.extra_options.join(', ')}</div>` : ''}
              <div><span style="color:#888;">배송비:</span> ${p.shipping_fee > 0 ? p.shipping_fee.toLocaleString() + '원' : '무료'}</div>
              ${(p.detail_images && p.detail_images.length) ? `<div><span style="color:#888;">상세이미지:</span> ${p.detail_images.length}개</div>` : ''}
              <div style="color:#888; font-size:12px; margin-top:4px;">
                등록일: ${new Date(p.created_at).toLocaleString('ko-KR')}
              </div>
            </div>

            <div style="display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;">
              <a href="product.html?id=${p.id}" target="_blank" rel="noopener"
                style="flex:1; min-width:80px; text-align:center; padding:8px; background:#555; color:#fff; border-radius:6px; text-decoration:none; font-size:13px;">
                보기
              </a>
              <a href="edit.html?id=${p.id}"
                style="flex:1; min-width:80px; text-align:center; padding:8px; background:#1976d2; color:#fff; border-radius:6px; text-decoration:none; font-size:13px;">
                수정
              </a>
              <button class="del-btn" data-id="${p.id}"
                style="flex:1; min-width:80px; padding:8px; background:#e53935; color:#fff; border:0; border-radius:6px; cursor:pointer; font-size:13px;">
                삭제
              </button>
            </div>
          </div>
        </div>
      `).join('');

      listEl.querySelectorAll('.product-summary').forEach(sum => {
        sum.addEventListener('click', () => {
          const detail = sum.nextElementSibling;
          const arrow = sum.querySelector('.product-arrow');
          if (detail.style.display === 'none') {
            detail.style.display = 'block';
            arrow.style.transform = 'rotate(180deg)';
          } else {
            detail.style.display = 'none';
            arrow.style.transform = 'rotate(0deg)';
          }
        });
      });

      listEl.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('정말 삭제할까요?')) return;
          const { error } = await db.from('products').delete().eq('id', btn.dataset.id);
          if (error) alert('삭제 실패: ' + error.message);
          else loadAdminList();
        });
      });
    }

    // ===== 주문 목록 (1줄 요약 + 클릭 펼침) =====
    let currentOrders = [];

    async function loadOrders() {
      const el = document.getElementById('order-list');
      const { data, error } = await db
        .from('orders').select('*')
        .order('created_at', { ascending: false });

      if (error) { el.innerHTML = '<p>불러오기 실패: ' + error.message + '</p>'; return; }
      if (!data || data.length === 0) { el.innerHTML = '<p>주문이 없습니다.</p>'; return; }

      currentOrders = data;

      el.innerHTML = data.map(o => `
        <div class="order-row" data-id="${o.id}"
          style="background:#fff; border-radius:8px; border-left:4px solid ${statusColor(o.status)}; overflow:hidden;">
          <div class="order-summary"
            style="padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; flex-wrap:wrap;">
            <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:0; flex-wrap:wrap;">
              <span style="background:${statusColor(o.status)}; color:#fff; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; white-space:nowrap;">
                ${o.status}
              </span>
              <span style="font-size:14px; white-space:nowrap;">
                <b>${o.customer_name}</b>
              </span>
              <span style="font-size:13px; color:#555; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px;">
                ${o.product_name} × ${o.quantity}
              </span>
              <span style="font-size:14px; font-weight:700; color:#e53935; white-space:nowrap;">
                ${o.total_price.toLocaleString()}원
              </span>
            </div>
            <span class="order-arrow" style="color:#888; font-size:12px; transition:transform .2s;">▼</span>
          </div>

          <div class="order-detail" style="display:none; padding:0 14px 14px; font-size:13px; line-height:1.8; color:#333; border-top:1px solid #eee;">
            <div style="padding-top:10px;">
              <div><span style="color:#888;">연락처:</span> ${o.customer_phone}</div>
              <div><span style="color:#888;">입금자명:</span> <b>${o.depositor_name}</b></div>
              ${o.selected_color ? `<div><span style="color:#888;">색상:</span> ${o.selected_color}</div>` : ''}
              ${o.selected_size ? `<div><span style="color:#888;">사이즈:</span> ${o.selected_size}</div>` : ''}
              ${(o.selected_extras && o.selected_extras.length) ? `<div><span style="color:#888;">추가옵션:</span> ${o.selected_extras.join(', ')}</div>` : ''}
              ${o.shipping_fee > 0 ? `<div><span style="color:#888;">배송비:</span> ${o.shipping_fee.toLocaleString()}원</div>` : ''}
              ${o.group_id ? `<div><span style="color:#888;">그룹:</span> ${o.group_id.slice(-6)}</div>` : ''}
              ${o.memo ? `<div><span style="color:#888;">요청:</span> ${o.memo}</div>` : ''}
              <div style="color:#888; font-size:12px; margin-top:4px;">
                ${new Date(o.created_at).toLocaleString('ko-KR')}
              </div>
            </div>

            <div style="display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;">
              <select data-id="${o.id}" class="status-select"
                style="flex:1; min-width:100px; padding:6px; border:1px solid #ddd; border-radius:6px;">
                ${['입금대기','입금완료','배송중','완료','취소'].map(s =>
                  `<option ${s === o.status ? 'selected' : ''}>${s}</option>`
                ).join('')}
              </select>
              <button class="order-edit" data-id="${o.id}"
                style="flex:1; min-width:80px; padding:8px; background:#1976d2; color:#fff; border:0; border-radius:6px; cursor:pointer; font-size:13px;">
                수정
              </button>
              <button class="order-del" data-id="${o.id}"
                style="flex:1; min-width:80px; padding:8px; background:#e53935; color:#fff; border:0; border-radius:6px; cursor:pointer; font-size:13px;">
                삭제
              </button>
            </div>
          </div>
        </div>
      `).join('');

      el.querySelectorAll('.order-summary').forEach(sum => {
        sum.addEventListener('click', () => {
          const detail = sum.nextElementSibling;
          const arrow = sum.querySelector('.order-arrow');
          if (detail.style.display === 'none') {
            detail.style.display = 'block';
            arrow.style.transform = 'rotate(180deg)';
          } else {
            detail.style.display = 'none';
            arrow.style.transform = 'rotate(0deg)';
          }
        });
      });

      el.querySelectorAll('.status-select').forEach(sel => {
        sel.addEventListener('click', (e) => e.stopPropagation());
        sel.addEventListener('change', async () => {
          const { error } = await db.from('orders').update({ status: sel.value }).eq('id', sel.dataset.id);
          if (error) alert('상태 변경 실패: ' + error.message);
          else loadOrders();
        });
      });

      el.querySelectorAll('.order-edit').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const order = currentOrders.find(x => String(x.id) === String(btn.dataset.id));
          if (order) showOrderEditModal(order);
        });
      });

      el.querySelectorAll('.order-del').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('주문을 삭제할까요?')) return;
          const { error } = await db.from('orders').delete().eq('id', btn.dataset.id);
          if (error) alert('삭제 실패: ' + error.message);
          else loadOrders();
        });
      });
    }

    function statusColor(s) {
      return { '입금대기':'#ff9800', '입금완료':'#03c75a', '배송중':'#1976d2', '완료':'#555', '취소':'#e53935' }[s] || '#ccc';
    }

    // ===== 주문 수정 모달 =====
    function showOrderEditModal(o) {
      const modal = document.createElement('div');
      modal.style.cssText = `position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:10px;`;
      modal.innerHTML = `
        <div style="background:#fff; padding:20px; border-radius:10px; width:100%; max-width:440px; max-height:90vh; overflow-y:auto;">
          <h2 style="margin-bottom:16px; font-size:18px;">주문 수정 (ID: ${o.id})</h2>
          <form id="order-edit-form" style="display:grid; gap:10px;">
            <label style="font-size:13px; font-weight:600;">상품명</label>
            <input name="product_name" value="${o.product_name}" required
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">상품 가격</label>
            <input name="product_price" type="number" value="${o.product_price}" required
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">수량</label>
            <input name="quantity" type="number" min="1" value="${o.quantity}" required
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">배송비</label>
            <input name="shipping_fee" type="number" min="0" value="${o.shipping_fee || 0}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">주문자 이름</label>
            <input name="customer_name" value="${o.customer_name}" required
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">연락처</label>
            <input name="customer_phone" type="tel" inputmode="numeric" value="${o.customer_phone}" required
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">입금자명</label>
            <input name="depositor_name" value="${o.depositor_name}" required
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">색상</label>
            <input name="selected_color" value="${o.selected_color || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">사이즈</label>
            <input name="selected_size" value="${o.selected_size || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">추가옵션 (쉼표 구분)</label>
            <input name="selected_extras" value="${(o.selected_extras || []).join(',')}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">요청사항</label>
            <textarea name="memo"
              style="padding:10px; border:1px solid #ddd; border-radius:6px; min-height:60px;">${o.memo || ''}</textarea>

            <label style="font-size:13px; font-weight:600;">상태</label>
            <select name="status"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">
              ${['입금대기','입금완료','배송중','완료','취소'].map(s =>
                `<option ${s === o.status ? 'selected' : ''}>${s}</option>`
              ).join('')}
            </select>

            <div style="display:flex; gap:8px; margin-top:8px;">
              <button type="submit"
                style="flex:1; padding:12px; background:#1976d2; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">
                저장
              </button>
              <button type="button" id="cancel-edit"
                style="flex:1; padding:12px; background:#eee; border:0; border-radius:6px; cursor:pointer;">
                취소
              </button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('#cancel-edit').onclick = () => modal.remove();

      modal.querySelector('#order-edit-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;
        const qty = Number(f.quantity.value);
        const price = Number(f.product_price.value);
        const ship = Number(f.shipping_fee.value) || 0;

        const extrasArr = f.selected_extras.value
          .split(',').map(s => s.trim()).filter(Boolean);

        const { error } = await db.from('orders').update({
          product_name: f.product_name.value.trim(),
          product_price: price,
          quantity: qty,
          total_price: price * qty + ship,
          shipping_fee: ship,
          customer_name: f.customer_name.value.trim(),
          customer_phone: f.customer_phone.value.trim(),
          depositor_name: f.depositor_name.value.trim(),
          selected_color: f.selected_color.value.trim() || null,
          selected_size: f.selected_size.value.trim() || null,
          selected_extras: extrasArr,
          memo: f.memo.value.trim(),
          status: f.status.value,
        }).eq('id', o.id);

        if (error) { alert('❌ 수정 실패: ' + error.message); return; }
        modal.remove();
        loadOrders();
      });
    }

    // ===== 회원 목록 =====
    async function loadMembers() {
      const el = document.getElementById('member-list');
      const { data, error } = await db
        .from('members').select('*')
        .order('created_at', { ascending: false });

      if (error) { el.innerHTML = '<p>불러오기 실패</p>'; return; }
      if (!data || data.length === 0) { el.innerHTML = '<p>회원이 없습니다.</p>'; return; }

      el.innerHTML = data.map(m => `
        <div style="background:#fff; padding:10px 14px; border-radius:6px; font-size:14px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <div><b>${m.name}</b> · ${m.phone}</div>
          <div style="color:#888;">${m.email}</div>
        </div>
      `).join('');
    }

    checkSession();
  </script>
</body>
</html>
