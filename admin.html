<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>관리자 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    html, body { overflow-x: hidden; max-width: 100vw; }

    .product-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-top: 8px;
    }
    .product-left {
      flex: 0 0 480px;
      max-width: 100%;
    }
    .product-right {
      flex: 1 1 auto;
      min-width: 0;
    }

    #admin-list-wrap {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
    }

    #admin-pagination {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 900px) {
      .product-layout { flex-direction: column; }
      .product-left { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="index.html">🛍️ 심플몰</a> - 관리자</h1>
  </header>

  <main>
    <div id="login-screen" style="display:none; max-width:360px; margin:60px auto;">
      <h2 style="margin-bottom:16px;">관리자 로그인</h2>
      <form id="login-form" style="display:grid; gap:10px; background:#fff; padding:20px; border-radius:8px;">
        <input name="email" type="email" placeholder="이메일" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <input name="password" type="password" placeholder="비밀번호" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
        <button type="submit" style="padding:12px; background:#222; color:#fff; border:0; border-radius:6px; cursor:pointer;">로그인</button>
      </form>
      <p id="login-msg" style="margin-top:12px; font-weight:600;"></p>
    </div>

    <div id="admin-screen" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2>관리자</h2>
        <button id="logout-btn" style="padding:8px 14px; background:#999; color:#fff; border:0; border-radius:6px; cursor:pointer; font-size:13px;">로그아웃</button>
      </div>

      <!-- 로고 관리 -->
      <div style="background:#fff; padding:16px; border-radius:8px; margin-bottom:16px;">
        <h3 style="font-size:15px; margin-bottom:10px;">로고 / 사이트명 관리</h3>
        <div style="display:grid; gap:8px;">
          <input id="logo-site-name" placeholder="사이트명 (텍스트 로고, 예: 🛍️ 심플몰)" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
          <input id="logo-image-url" placeholder="로고 이미지 URL (입력 시 이미지가 우선)" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
          <div style="display:flex; gap:8px;">
            <button id="logo-save-btn" style="flex:1; padding:10px; background:#1976d2; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">등록/수정</button>
            <button id="logo-delete-btn" style="flex:1; padding:10px; background:#e53935; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">삭제</button>
          </div>
          <p id="logo-msg" style="font-size:13px; font-weight:600;"></p>
        </div>
        <div id="logo-preview" style="margin-top:12px; display:none;">
          <div style="font-size:12px; color:#888; margin-bottom:4px;">현재 로고:</div>
          <img id="logo-preview-img" style="max-height:60px; object-fit:contain; display:block; background:#f5f5f5; padding:6px; border-radius:6px;">
        </div>
      </div>

      <!-- 배너 관리 -->
      <div style="background:#fff; padding:16px; border-radius:8px; margin-bottom:16px;">
        <h3 style="font-size:15px; margin-bottom:10px;">배너 이미지 관리</h3>
        <div style="display:grid; gap:8px;">
          <input id="banner-image-url" placeholder="배너 이미지 URL" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
          <input id="banner-link-url" placeholder="클릭 시 이동할 링크 URL (선택)" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
          <div style="display:flex; gap:8px;">
            <button id="banner-save-btn" style="flex:1; padding:10px; background:#1976d2; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">등록/수정</button>
            <button id="banner-delete-btn" style="flex:1; padding:10px; background:#e53935; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">삭제</button>
          </div>
          <p id="banner-msg" style="font-size:13px; font-weight:600;"></p>
        </div>
        <div id="banner-preview" style="margin-top:12px; display:none;">
          <div style="font-size:12px; color:#888; margin-bottom:4px;">현재 배너:</div>
          <img id="banner-preview-img" style="width:100%; max-height:200px; object-fit:cover; border-radius:6px;">
        </div>
      </div>

      <!-- 전체 배송비 설정 -->
      <div style="background:#fff; padding:16px; border-radius:8px; margin-bottom:16px;">
        <h3 style="font-size:15px; margin-bottom:10px;">전체 배송비 설정</h3>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <input id="global-shipping" type="number" min="0" placeholder="배송비 (0=무료)"
            style="padding:10px; border:1px solid #ddd; border-radius:6px; width:200px;">
          <button id="save-shipping" style="padding:10px 20px; background:#03c75a; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">저장</button>
          <span id="shipping-msg" style="font-size:13px; font-weight:600;"></span>
        </div>
        <p style="font-size:12px; color:#888; margin-top:6px;">모든 상품에 동일하게 적용됩니다.</p>
      </div>

      <!-- 상품 등록 + 목록 -->
      <div class="product-layout">
        <div class="product-left">
          <h2 style="margin:0 0 12px;">상품 등록</h2>
          <form id="product-form"
            style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; background:#fff; padding:16px; border-radius:8px;">
            <input name="product_code" placeholder="제품번호" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <input name="name" placeholder="상품명" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <input name="price" type="number" placeholder="가격" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <input name="main_image" placeholder="메인 이미지 URL" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <input name="colors" placeholder="색상 (쉼표: 빨강,파랑)" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <input name="sizes" placeholder="사이즈 (쉼표: S,M,L)" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <input name="hem_option" placeholder="밑단선택 (쉼표: 일반,밑딤픔)" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <input name="other_option" placeholder="기타옵션 (쉼표: 유발,무발)" style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <textarea name="detail_images" placeholder="상세 이미지 URL (줄바꿈)" style="grid-column: 1 / -1; padding:10px; border:1px solid #ddd; border-radius:6px; min-height:60px;"></textarea>
            <button type="submit" style="grid-column: 1 / -1; padding:12px; background:#222; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">등록하기</button>
          </form>
          <p id="msg" style="margin-top:12px; font-weight:600;"></p>
        </div>

        <div class="product-right">
          <h2 style="margin:0 0 12px;">등록된 상품 <span id="product-count" style="font-size:14px; color:#888; font-weight:400;"></span></h2>
          <div id="admin-list-wrap">
            <div id="admin-list" style="display:grid; grid-template-columns: 1fr; gap:8px;">로딩중...</div>
          </div>
          <div id="admin-pagination"></div>
        </div>
      </div>

      <h2 style="margin:32px 0 16px;">주문 목록</h2>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input id="order-search" placeholder="주문번호로 검색" style="flex:1; padding:10px; border:1px solid #ddd; border-radius:6px; text-transform:uppercase;">
        <button id="order-search-btn" style="padding:10px 20px; background:#1976d2; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">검색</button>
        <button id="order-reset-btn" style="padding:10px 20px; background:#eee; border:0; border-radius:6px; cursor:pointer;">전체</button>
      </div>
      <div id="order-list" style="display:grid; gap:10px;">로딩중...</div>

      <!-- 회원 관리 -->
      <h2 style="margin:32px 0 16px;">회원 목록</h2>
      <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
        <input id="member-search" placeholder="아이디/이름/연락처 검색" style="flex:1; min-width:200px; padding:10px; border:1px solid #ddd; border-radius:6px;">
        <button id="member-search-btn" style="padding:10px 20px; background:#1976d2; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">검색</button>
        <button id="member-reset-btn" style="padding:10px 20px; background:#eee; border:0; border-radius:6px; cursor:pointer;">전체</button>
      </div>
      <div id="member-list" style="display:grid; gap:8px;">로딩중...</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const loginScreen = document.getElementById('login-screen');
    const adminScreen = document.getElementById('admin-screen');
    const loginForm = document.getElementById('login-form');
    const loginMsg = document.getElementById('login-msg');

    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) showAdmin();
      else showLogin();
    }

    function showLogin() {
      loginScreen.style.display = 'block';
      adminScreen.style.display = 'none';
    }

    function showAdmin() {
      loginScreen.style.display = 'none';
      adminScreen.style.display = 'block';
      loadLogo();
      loadBanner();
      loadShippingSetting();
      loadAdminList();
      loadOrders();
      loadMembers();
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginMsg.textContent = '로그인 중...';
      loginMsg.style.color = '#222';
      const { error } = await db.auth.signInWithPassword({
        email: loginForm.email.value.trim(),
        password: loginForm.password.value,
      });
      if (error) {
        loginMsg.style.color = 'crimson';
        loginMsg.textContent = '❌ ' + error.message;
      } else {
        loginMsg.textContent = '';
        showAdmin();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await db.auth.signOut();
      showLogin();
    });

    // ===== 로고 관리 =====
    let currentLogoId = null;
    async function loadLogo() {
      const { data, error } = await db.from('logos').select('*').order('id', { ascending: false }).limit(1).maybeSingle();
      const preview = document.getElementById('logo-preview');
      const img = document.getElementById('logo-preview-img');
      const siteNameInput = document.getElementById('logo-site-name');
      const imgUrlInput = document.getElementById('logo-image-url');

      if (error || !data) {
        preview.style.display = 'none';
        siteNameInput.value = '';
        imgUrlInput.value = '';
        currentLogoId = null;
        return;
      }
      currentLogoId = data.id;
      siteNameInput.value = data.site_name || '';
      imgUrlInput.value = data.image_url || '';
      if (data.image_url) {
        img.src = data.image_url;
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    }

    document.getElementById('logo-save-btn').addEventListener('click', async () => {
      const msg = document.getElementById('logo-msg');
      const siteName = document.getElementById('logo-site-name').value.trim();
      const imageUrl = document.getElementById('logo-image-url').value.trim();
      if (!siteName && !imageUrl) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ 사이트명 또는 이미지 URL 중 하나는 필요합니다.';
        return;
      }
      msg.textContent = '저장 중...';
      msg.style.color = '#222';
      let error;
      if (currentLogoId) {
        ({ error } = await db.from('logos').update({
          site_name: siteName || null,
          image_url: imageUrl || null,
          updated_at: new Date().toISOString(),
        }).eq('id', currentLogoId));
      } else {
        const res = await db.from('logos').insert({
          site_name: siteName || null,
          image_url: imageUrl || null,
        }).select().single();
        error = res.error;
        if (res.data) currentLogoId = res.data.id;
      }
      if (error) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ ' + error.message;
      } else {
        msg.style.color = 'green';
        msg.textContent = '✅ 저장 완료!';
        loadLogo();
        setTimeout(() => msg.textContent = '', 2000);
      }
    });

    document.getElementById('logo-delete-btn').addEventListener('click', async () => {
      const msg = document.getElementById('logo-msg');
      if (!currentLogoId) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ 삭제할 로고가 없습니다.';
        return;
      }
      if (!confirm('로고를 삭제할까요? (기본값으로 돌아갑니다)')) return;
      msg.textContent = '삭제 중...';
      msg.style.color = '#222';
      const { error } = await db.from('logos').delete().eq('id', currentLogoId);
      if (error) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ ' + error.message;
      } else {
        msg.style.color = 'green';
        msg.textContent = '✅ 삭제 완료!';
        document.getElementById('logo-site-name').value = '';
        document.getElementById('logo-image-url').value = '';
        document.getElementById('logo-preview').style.display = 'none';
        currentLogoId = null;
        setTimeout(() => msg.textContent = '', 2000);
      }
    });

    // ===== 배너 관리 =====
    let currentBannerId = null;
    async function loadBanner() {
      const { data, error } = await db.from('banners').select('*').order('id', { ascending: false }).limit(1).maybeSingle();
      const preview = document.getElementById('banner-preview');
      const img = document.getElementById('banner-preview-img');
      const imgUrl = document.getElementById('banner-image-url');
      const linkUrl = document.getElementById('banner-link-url');
      if (error || !data) {
        preview.style.display = 'none';
        imgUrl.value = '';
        linkUrl.value = '';
        currentBannerId = null;
        return;
      }
      currentBannerId = data.id;
      imgUrl.value = data.image_url || '';
      linkUrl.value = data.link_url || '';
      if (data.image_url) {
        img.src = data.image_url;
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    }

    document.getElementById('banner-save-btn').addEventListener('click', async () => {
      const msg = document.getElementById('banner-msg');
      const imageUrl = document.getElementById('banner-image-url').value.trim();
      const linkUrl = document.getElementById('banner-link-url').value.trim();
      if (!imageUrl) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ 배너 이미지 URL을 입력하세요.';
        return;
      }
      msg.textContent = '저장 중...';
      msg.style.color = '#222';
      let error;
      if (currentBannerId) {
        ({ error } = await db.from('banners').update({
          image_url: imageUrl,
          link_url: linkUrl || null,
          updated_at: new Date().toISOString(),
        }).eq('id', currentBannerId));
      } else {
        const res = await db.from('banners').insert({
          image_url: imageUrl,
          link_url: linkUrl || null,
        }).select().single();
        error = res.error;
        if (res.data) currentBannerId = res.data.id;
      }
      if (error) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ ' + error.message;
      } else {
        msg.style.color = 'green';
        msg.textContent = '✅ 저장 완료!';
        loadBanner();
        setTimeout(() => msg.textContent = '', 2000);
      }
    });

    document.getElementById('banner-delete-btn').addEventListener('click', async () => {
      const msg = document.getElementById('banner-msg');
      if (!currentBannerId) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ 삭제할 배너가 없습니다.';
        return;
      }
      if (!confirm('배너를 삭제할까요?')) return;
      msg.textContent = '삭제 중...';
      msg.style.color = '#222';
      const { error } = await db.from('banners').delete().eq('id', currentBannerId);
      if (error) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ ' + error.message;
      } else {
        msg.style.color = 'green';
        msg.textContent = '✅ 삭제 완료!';
        document.getElementById('banner-image-url').value = '';
        document.getElementById('banner-link-url').value = '';
        document.getElementById('banner-preview').style.display = 'none';
        currentBannerId = null;
        setTimeout(() => msg.textContent = '', 2000);
      }
    });

    // ===== 배송비 설정 =====
    async function loadShippingSetting() {
      const { data } = await db.from('settings').select('value').eq('key', 'shipping_fee').maybeSingle();
      document.getElementById('global-shipping').value = data ? (data.value || 0) : 0;
    }

    document.getElementById('save-shipping').addEventListener('click', async () => {
      const val = Number(document.getElementById('global-shipping').value) || 0;
      const sm = document.getElementById('shipping-msg');
      sm.textContent = '저장 중...';
      sm.style.color = '#222';
      const { error } = await db.from('settings').upsert({ key: 'shipping_fee', value: String(val) });
      if (error) {
        sm.style.color = 'crimson';
        sm.textContent = '❌ ' + error.message;
      } else {
        sm.style.color = 'green';
        sm.textContent = '✅ 저장 완료!';
        setTimeout(() => sm.textContent = '', 2000);
      }
    });

    // ===== 상품 등록 =====
    const form = document.getElementById('product-form');
    const msg = document.getElementById('msg');
    const listEl = document.getElementById('admin-list');
    const parseList = (str) => (str || '').split(',').map(s => s.trim()).filter(Boolean);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const detail_images = form.detail_images.value.split('\n').map(s => s.trim()).filter(Boolean);

      msg.textContent = '등록 중...';
      msg.style.color = '#222';

      const { error } = await db.from('products').insert({
        product_code: form.product_code.value.trim() || null,
        name: form.name.value.trim(),
        price: Number(form.price.value),
        main_image: form.main_image.value.trim(),
        detail_images,
        colors: parseList(form.colors.value),
        sizes: parseList(form.sizes.value),
        hem_option: parseList(form.hem_option.value),
        other_option: parseList(form.other_option.value),
      });

      if (error) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ ' + error.message;
      } else {
        msg.style.color = 'green';
        msg.textContent = '✅ 등록 완료!';
        form.reset();
        loadAdminList();
      }
    });

    // ===== 상품 목록 =====
    let allProducts = [];
    let currentPage = 1;
    const PER_PAGE = 10;
    const MAX_PAGES = 10;

    async function loadAdminList() {
      const { data, error } = await db.from('products').select('*').order('created_at', { ascending: false });
      if (error) { listEl.innerHTML = '<p>불러오기 실패</p>'; return; }
      if (!data || data.length === 0) {
        listEl.innerHTML = '<p style="text-align:center; color:#888;">등록된 상품이 없습니다.</p>';
        document.getElementById('admin-pagination').innerHTML = '';
        document.getElementById('product-count').textContent = '';
        return;
      }
      allProducts = data;
      currentPage = 1;
      document.getElementById('product-count').textContent = `(${data.length}개)`;
      renderProducts();
    }

    function renderProducts() {
      const totalPages = Math.min(Math.ceil(allProducts.length / PER_PAGE), MAX_PAGES);
      const start = (currentPage - 1) * PER_PAGE;
      const items = allProducts.slice(start, start + PER_PAGE);

      listEl.innerHTML = items.map(p => `
        <div style="background:#f9f9f9; border-radius:8px; border-left:4px solid #1976d2; overflow:hidden;">
          <div class="product-summary" style="padding:10px; display:flex; align-items:center; gap:10px; cursor:pointer;">
            <img src="${p.main_image}" style="width:44px; height:44px; object-fit:cover; border-radius:6px; flex-shrink:0;">
            <div style="flex:1; min-width:0; font-size:13px; line-height:1.3;">
              <div style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.name}</div>
              <div style="color:#e53935; font-weight:700; margin-top:2px;">${Number(p.price).toLocaleString()}원</div>
            </div>
            <span class="product-arrow" style="color:#888; font-size:12px; transition:transform .2s;">▼</span>
          </div>
          <div class="product-detail" style="display:none; padding:0 12px 12px; font-size:12px; line-height:1.7; color:#333; border-top:1px solid #eee;">
            <div style="padding-top:8px;">
              ${p.product_code ? `<div><span style="color:#888;">제품번호:</span> ${p.product_code}</div>` : ''}
              ${(p.colors && p.colors.length) ? `<div><span style="color:#888;">색상:</span> ${p.colors.join(', ')}</div>` : ''}
              ${(p.sizes && p.sizes.length) ? `<div><span style="color:#888;">사이즈:</span> ${p.sizes.join(', ')}</div>` : ''}
              ${(p.hem_option && p.hem_option.length) ? `<div><span style="color:#888;">밑단선택:</span> ${p.hem_option.join(', ')}</div>` : ''}
              ${(p.other_option && p.other_option.length) ? `<div><span style="color:#888;">기타옵션:</span> ${p.other_option.join(', ')}</div>` : ''}
            </div>
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:4px; margin-top:8px;">
              <a href="product.html?id=${p.id}" target="_blank" rel="noopener"
                style="text-align:center; padding:6px; background:#555; color:#fff; border-radius:4px; text-decoration:none; font-size:11px;">보기</a>
              <a href="edit.html?id=${p.id}"
                style="text-align:center; padding:6px; background:#1976d2; color:#fff; border-radius:4px; text-decoration:none; font-size:11px;">수정</a>
              <button class="copy-btn" data-id="${p.id}"
                style="padding:6px; background:#03c75a; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:11px;">복사</button>
              <button class="del-btn" data-id="${p.id}"
                style="padding:6px; background:#e53935; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:11px;">삭제</button>
            </div>
          </div>
        </div>
      `).join('');

      listEl.querySelectorAll('.product-summary').forEach(sum => {
        sum.addEventListener('click', () => {
          const detail = sum.nextElementSibling;
          const arrow = sum.querySelector('.product-arrow');
          if (detail.style.display === 'none') {
            detail.style.display = 'block';
            arrow.style.transform = 'rotate(180deg)';
          } else {
            detail.style.display = 'none';
            arrow.style.transform = 'rotate(0deg)';
          }
        });
      });

      listEl.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const p = allProducts.find(x => String(x.id) === String(btn.dataset.id));
          if (!p) return;
          if (!confirm(`"${p.name}" 을 그대로 복사해서 새로 등록할까요?`)) return;

          btn.disabled = true;
          btn.textContent = '...';

          const { error } = await db.from('products').insert({
            product_code: p.product_code ? p.product_code + '-C' : null,
            name: p.name + ' (복사)',
            price: p.price,
            main_image: p.main_image,
            detail_images: p.detail_images || [],
            colors: p.colors || [],
            sizes: p.sizes || [],
            hem_option: p.hem_option || [],
            other_option: p.other_option || [],
          });

          if (error) {
            alert('❌ 복사 실패: ' + error.message);
            btn.disabled = false;
            btn.textContent = '복사';
          } else {
            loadAdminList();
          }
        });
      });

      listEl.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('정말 삭제할까요?')) return;
          const { error } = await db.from('products').delete().eq('id', btn.dataset.id);
          if (error) alert('삭제 실패: ' + error.message);
          else loadAdminList();
        });
      });

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const el = document.getElementById('admin-pagination');
      if (totalPages <= 1) { el.innerHTML = ''; return; }
      let html = '';
      html += `<button class="page-nav" data-page="${currentPage-1}" ${currentPage===1?'disabled':''}
        style="padding:6px 12px; border:1px solid #ddd; border-radius:6px; background:${currentPage===1?'#f5f5f5':'#fff'}; color:${currentPage===1?'#bbb':'#222'}; cursor:${currentPage===1?'default':'pointer'}; font-size:13px;">이전</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-num" data-page="${i}"
          style="padding:6px 12px; border:1px solid ${i===currentPage?'#1976d2':'#ddd'}; border-radius:6px; background:${i===currentPage?'#1976d2':'#fff'}; color:${i===currentPage?'#fff':'#222'}; cursor:pointer; font-size:13px; font-weight:${i===currentPage?'700':'400'};">${i}</button>`;
      }
      html += `<button class="page-nav" data-page="${currentPage+1}" ${currentPage===totalPages?'disabled':''}
        style="padding:6px 12px; border:1px solid #ddd; border-radius:6px; background:${currentPage===totalPages?'#f5f5f5':'#fff'}; color:${currentPage===totalPages?'#bbb':'#222'}; cursor:${currentPage===totalPages?'default':'pointer'}; font-size:13px;">다음</button>`;
      el.innerHTML = html;

      el.querySelectorAll('.page-num, .page-nav').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          currentPage = Number(btn.dataset.page);
          renderProducts();
        });
      });
    }

    // ===== 주문 목록 =====
    let currentOrders = [];

    async function loadOrders(filterNum) {
      const el = document.getElementById('order-list');
      let query = db.from('orders').select('*').order('created_at', { ascending: false });
      if (filterNum) query = query.eq('order_number', filterNum);

      const { data, error } = await query;
      if (error) { el.innerHTML = '<p>불러오기 실패: ' + error.message + '</p>'; return; }
      if (!data || data.length === 0) { el.innerHTML = '<p>주문이 없습니다.</p>'; return; }

      const groups = {};
      data.forEach(o => {
        const key = o.order_number || `no_num_${o.id}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(o);
      });

      currentOrders = data;

      el.innerHTML = Object.entries(groups).map(([num, items]) => {
        const first = items[0];
        const totalAll = items.reduce((s, o) => s + Number(o.total_price || 0), 0);
        return `
          <div style="background:#fff; border-radius:8px; border-left:4px solid ${statusColor(first.status)}; overflow:hidden;">
            <div class="order-summary" style="padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; flex-wrap:wrap;">
              <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:0; flex-wrap:wrap;">
                <span style="background:${statusColor(first.status)}; color:#fff; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; white-space:nowrap;">${first.status}</span>
                <span style="font-size:13px; color:#1976d2; font-weight:600;">${num}</span>
                <span style="font-size:14px; white-space:nowrap;"><b>${first.customer_name}</b></span>
                <span style="font-size:13px; color:#555;">${items.length}건</span>
                <span style="font-size:14px; font-weight:700; color:#e53935; white-space:nowrap;">${totalAll.toLocaleString()}원</span>
              </div>
              <span class="order-arrow" style="color:#888; font-size:12px; transition:transform .2s;">▼</span>
            </div>
            <div class="order-detail" style="display:none; padding:0 14px 14px; font-size:13px; line-height:1.8; color:#333; border-top:1px solid #eee;">
              <div style="padding-top:10px;">
                <div><span style="color:#888;">연락처:</span> ${first.customer_phone}</div>
                <div><span style="color:#888;">주소:</span> ${first.postcode ? `[${first.postcode}] ` : ''}${first.address || ''} ${first.address_detail || ''}</div>
                <div><span style="color:#888;">입금자명:</span> <b>${first.depositor_name}</b></div>
                ${first.memo ? `<div><span style="color:#888;">요청:</span> ${first.memo}</div>` : ''}
                <hr style="border:0; border-top:1px dashed #ddd; margin:8px 0;">
                ${items.map(o => `
                  <div style="padding:4px 0;">
                    <b>${o.product_name}</b>
                    ${o.product_code ? `<span style="color:#888;">[${o.product_code}]</span>` : ''}
                    × ${o.quantity} = <b style="color:#e53935;">${Number(o.total_price).toLocaleString()}원</b>
                    ${o.selected_color ? `<br><span style="color:#888; font-size:12px;">색상: ${o.selected_color}</span>` : ''}
                    ${o.selected_size ? ` <span style="color:#888; font-size:12px;">사이즈: ${o.selected_size}</span>` : ''}
                    ${o.selected_hem ? `<br><span style="color:#888; font-size:12px;">밑단선택: ${o.selected_hem}</span>` : ''}
                    ${o.selected_other ? `<br><span style="color:#888; font-size:12px;">기타옵션: ${o.selected_other}</span>` : ''}
                    <button class="order-edit" data-id="${o.id}"
                      style="margin-left:6px; padding:3px 8px; background:#1976d2; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:11px;">수정</button>
                    <button class="order-del" data-id="${o.id}"
                      style="margin-left:4px; padding:3px 8px; background:#e53935; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:11px;">삭제</button>
                  </div>
                `).join('')}
                <div style="margin-top:10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
                  <span style="color:#888; font-size:12px;">대표 상태 변경:</span>
                  <select data-ids="${items.map(o => o.id).join(',')}" class="group-status-select"
                    style="padding:5px; border:1px solid #ddd; border-radius:6px;">
                    ${['입금대기','입금완료','배송중','완료','취소'].map(s =>
                      `<option ${s === first.status ? 'selected' : ''}>${s}</option>`
                    ).join('')}
                  </select>
                </div>
                <div style="color:#888; font-size:12px; margin-top:6px;">
                  ${new Date(first.created_at).toLocaleString('ko-KR')}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      el.querySelectorAll('.order-summary').forEach(sum => {
        sum.addEventListener('click', () => {
          const detail = sum.nextElementSibling;
          const arrow = sum.querySelector('.order-arrow');
          if (detail.style.display === 'none') {
            detail.style.display = 'block';
            arrow.style.transform = 'rotate(180deg)';
          } else {
            detail.style.display = 'none';
            arrow.style.transform = 'rotate(0deg)';
          }
        });
      });

      el.querySelectorAll('.group-status-select').forEach(sel => {
        sel.addEventListener('click', (e) => e.stopPropagation());
        sel.addEventListener('change', async () => {
          const ids = sel.dataset.ids.split(',');
          const { error } = await db.from('orders').update({ status: sel.value }).in('id', ids);
          if (error) alert('상태 변경 실패: ' + error.message);
          else loadOrders();
        });
      });

      el.querySelectorAll('.order-edit').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const order = currentOrders.find(x => String(x.id) === String(btn.dataset.id));
          if (order) showOrderEditModal(order);
        });
      });

      el.querySelectorAll('.order-del').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirm('주문을 삭제할까요?')) return;
          const { error } = await db.from('orders').delete().eq('id', btn.dataset.id);
          if (error) alert('삭제 실패: ' + error.message);
          else loadOrders();
        });
      });
    }

    function statusColor(s) {
      return { '입금대기':'#ff9800', '입금완료':'#03c75a', '배송중':'#1976d2', '완료':'#555', '취소':'#e53935' }[s] || '#ccc';
    }

    document.getElementById('order-search-btn').addEventListener('click', () => {
      const num = document.getElementById('order-search').value.trim().toUpperCase();
      loadOrders(num || null);
    });
    document.getElementById('order-reset-btn').addEventListener('click', () => {
      document.getElementById('order-search').value = '';
      loadOrders();
    });

    // ===== 주문 수정 모달 =====
    function showOrderEditModal(o) {
      const modal = document.createElement('div');
      modal.style.cssText = `position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:10px;`;
      modal.innerHTML = `
        <div style="background:#fff; padding:20px; border-radius:10px; width:100%; max-width:440px; max-height:90vh; overflow-y:auto;">
          <h2 style="margin-bottom:16px; font-size:18px;">주문 수정 (${o.order_number || o.id})</h2>
          <form id="order-edit-form" style="display:grid; gap:10px;">
            <label style="font-size:13px; font-weight:600;">상품명</label>
            <input name="product_name" value="${o.product_name}" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">제품번호</label>
            <input name="product_code" value="${o.product_code || ''}" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">상품 가격</label>
            <input name="product_price" type="number" value="${o.product_price}" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">수량</label>
            <input name="quantity" type="number" min="1" value="${o.quantity}" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">배송비</label>
            <input name="shipping_fee" type="number" min="0" value="${o.shipping_fee || 0}" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">주문자 이름</label>
            <input name="customer_name" value="${o.customer_name}" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">연락처</label>
            <input name="customer_phone" type="tel" inputmode="numeric" value="${o.customer_phone}" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">우편번호</label>
            <input name="postcode" value="${o.postcode || ''}" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">주소</label>
            <input name="address" value="${o.address || ''}" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">상세주소</label>
            <input name="address_detail" value="${o.address_detail || ''}" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">입금자명</label>
            <input name="depositor_name" value="${o.depositor_name}" required style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">색상</label>
            <input name="selected_color" value="${o.selected_color || ''}" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">사이즈</label>
            <input name="selected_size" value="${o.selected_size || ''}" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">밑단선택</label>
            <input name="selected_hem" value="${o.selected_hem || ''}" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">기타옵션</label>
            <input name="selected_other" value="${o.selected_other || ''}" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <label style="font-size:13px; font-weight:600;">요청사항</label>
            <textarea name="memo" style="padding:10px; border:1px solid #ddd; border-radius:6px; min-height:60px;">${o.memo || ''}</textarea>
            <label style="font-size:13px; font-weight:600;">상태</label>
            <select name="status" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
              ${['입금대기','입금완료','배송중','완료','취소'].map(s =>
                `<option ${s === o.status ? 'selected' : ''}>${s}</option>`
              ).join('')}
            </select>
            <div style="display:flex; gap:8px; margin-top:8px;">
              <button type="submit" style="flex:1; padding:12px; background:#1976d2; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">저장</button>
              <button type="button" id="cancel-edit" style="flex:1; padding:12px; background:#eee; border:0; border-radius:6px; cursor:pointer;">취소</button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(modal);
      modal.querySelector('#cancel-edit').onclick = () => modal.remove();
      modal.querySelector('#order-edit-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;
        const qty = Number(f.quantity.value);
        const price = Number(f.product_price.value);
        const ship = Number(f.shipping_fee.value) || 0;

        const { error } = await db.from('orders').update({
          product_name: f.product_name.value.trim(),
          product_code: f.product_code.value.trim() || null,
          product_price: price,
          quantity: qty,
          total_price: price * qty + ship,
          shipping_fee: ship,
          customer_name: f.customer_name.value.trim(),
          customer_phone: f.customer_phone.value.trim(),
          depositor_name: f.depositor_name.value.trim(),
          address: f.address.value.trim(),
          address_detail: f.address_detail.value.trim(),
          postcode: f.postcode.value.trim(),
          selected_color: f.selected_color.value.trim() || null,
          selected_size: f.selected_size.value.trim() || null,
          selected_hem: f.selected_hem.value.trim() || null,
          selected_other: f.selected_other.value.trim() || null,
          memo: f.memo.value.trim(),
          status: f.status.value,
        }).eq('id', o.id);

        if (error) { alert('❌ 수정 실패: ' + error.message); return; }
        modal.remove();
        loadOrders();
      });
    }

    // ===== 회원 관리 =====
    let allMembers = [];

    async function loadMembers() {
      const el = document.getElementById('member-list');
      const { data, error } = await db.from('members').select('*').order('created_at', { ascending: false });
      if (error) { el.innerHTML = '<p>불러오기 실패</p>'; return; }
      if (!data || data.length === 0) { el.innerHTML = '<p>회원이 없습니다.</p>'; return; }

      allMembers = data;
      renderMembers();
    }

    function renderMembers(filterText) {
      const el = document.getElementById('member-list');
      let list = allMembers;

      if (filterText) {
        const f = filterText.toLowerCase();
        list = allMembers.filter(m =>
          (m.username && m.username.toLowerCase().includes(f)) ||
          (m.name && m.name.toLowerCase().includes(f)) ||
          (m.phone && m.phone.includes(f)) ||
          (m.email && m.email.toLowerCase().includes(f))
        );
      }

      if (list.length === 0) {
        el.innerHTML = '<p style="text-align:center; color:#888;">해당하는 회원이 없습니다.</p>';
        return;
      }

      el.innerHTML = list.map(m => {
        const status = m.status || '정상';
        const statusColor = status === '정상' ? '#03c75a'
                          : status === '정지' ? '#ff9800'
                          : '#e53935';

        return `
          <div style="background:#fff; padding:12px 14px; border-radius:6px; font-size:13px; border-left:4px solid ${statusColor};">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
              <div style="flex:1; min-width:0;">
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                  <b>${m.name || '-'}</b>
                  <span style="color:#888; font-size:12px;">(${m.username || '-'})</span>
                  <span style="background:${statusColor}; color:#fff; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600;">${status}</span>
                </div>
                <div style="color:#666; margin-top:4px; font-size:12px;">
                  ${m.phone || '-'}
                  ${m.email ? ` · ${m.email}` : ''}
                </div>
                ${m.address ? `<div style="color:#888; margin-top:2px; font-size:12px;">[${m.postcode || ''}] ${m.address} ${m.address_detail || ''}</div>` : ''}
                ${m.memo ? `<div style="color:#888; margin-top:2px; font-size:12px;">메모: ${m.memo}</div>` : ''}
              </div>
              <div style="display:flex; gap:4px;">
                <button class="member-edit-btn" data-id="${m.id}"
                  style="padding:6px 12px; background:#1976d2; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:12px;">수정</button>
                <button class="member-del-btn" data-id="${m.id}"
                  style="padding:6px 12px; background:#e53935; color:#fff; border:0; border-radius:4px; cursor:pointer; font-size:12px;">삭제</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      el.querySelectorAll('.member-edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = allMembers.find(x => String(x.id) === String(btn.dataset.id));
          if (m) showMemberEditModal(m);
        });
      });

      el.querySelectorAll('.member-del-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const m = allMembers.find(x => String(x.id) === String(btn.dataset.id));
          if (!m) return;
          if (!confirm(`"${m.name}" 회원을 완전히 삭제할까요?\n(복구 불가)`)) return;

          const { error } = await db.from('members').delete().eq('id', m.id);
          if (error) {
            alert('삭제 실패: ' + error.message);
          } else {
            alert('✅ 회원이 삭제되었습니다.');
            loadMembers();
          }
        });
      });
    }

    document.getElementById('member-search-btn').addEventListener('click', () => {
      const q = document.getElementById('member-search').value.trim();
      renderMembers(q);
    });
    document.getElementById('member-reset-btn').addEventListener('click', () => {
      document.getElementById('member-search').value = '';
      renderMembers();
    });
    document.getElementById('member-search').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        renderMembers(document.getElementById('member-search').value.trim());
      }
    });

    // ===== 회원 수정/제재 모달 =====
    function showMemberEditModal(m) {
      const modal = document.createElement('div');
      modal.style.cssText = `position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:10px;`;
      modal.innerHTML = `
        <div style="background:#fff; padding:20px; border-radius:10px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto;">
          <h2 style="margin-bottom:16px; font-size:18px;">회원 정보 (ID: ${m.id})</h2>
          <form id="member-edit-form" style="display:grid; gap:10px;">
            <label style="font-size:13px; font-weight:600;">아이디</label>
            <input name="username" value="${m.username || ''}" readonly
              style="padding:10px; border:1px solid #ddd; border-radius:6px; background:#f5f5f5;">

            <label style="font-size:13px; font-weight:600;">비밀번호</label>
            <input name="password" value="${m.password || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">
            <p style="font-size:11px; color:#888; margin:0;">※ 필요 시 변경 (평문 저장됨)</p>

            <label style="font-size:13px; font-weight:600;">이름</label>
            <input name="name" value="${m.name || ''}" required
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">연락처</label>
            <input name="phone" type="tel" inputmode="numeric" value="${m.phone || ''}" required
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">이메일</label>
            <input name="email" type="email" value="${m.email || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">우편번호</label>
            <input name="postcode" value="${m.postcode || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">주소</label>
            <input name="address" value="${m.address || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">상세주소</label>
            <input name="address_detail" value="${m.address_detail || ''}"
              style="padding:10px; border:1px solid #ddd; border-radius:6px;">

            <label style="font-size:13px; font-weight:600;">회원 상태</label>
            <select name="status" style="padding:10px; border:1px solid #ddd; border-radius:6px;">
              ${['정상','정지','탈퇴'].map(s =>
                `<option ${s === (m.status || '정상') ? 'selected' : ''}>${s}</option>`
              ).join('')}
            </select>

            <label style="font-size:13px; font-weight:600;">관리자 메모</label>
            <textarea name="memo" placeholder="제재 사유 등"
              style="padding:10px; border:1px solid #ddd; border-radius:6px; min-height:60px;">${m.memo || ''}</textarea>

            <div style="display:flex; gap:8px; margin-top:8px;">
              <button type="submit"
                style="flex:1; padding:12px; background:#1976d2; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600;">
                저장
              </button>
              <button type="button" id="cancel-edit"
                style="flex:1; padding:12px; background:#eee; border:0; border-radius:6px; cursor:pointer;">
                취소
              </button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(modal);
      modal.querySelector('#cancel-edit').onclick = () => modal.remove();

      modal.querySelector('#member-edit-form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const f = ev.target;

        const updates = {
          password: f.password.value,
          name: f.name.value.trim(),
          phone: f.phone.value.trim(),
          email: f.email.value.trim() || null,
          postcode: f.postcode.value.trim() || null,
          address: f.address.value.trim() || null,
          address_detail: f.address_detail.value.trim() || null,
          status: f.status.value,
          memo: f.memo.value.trim() || null,
        };

        const { error } = await db.from('members').update(updates).eq('id', m.id);

        if (error) { alert('❌ 저장 실패: ' + error.message); return; }
        alert('✅ 저장 완료!');
        modal.remove();
        loadMembers();
      });
    }

    checkSession();
  </script>
</body>
</html>
