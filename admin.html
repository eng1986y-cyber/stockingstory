<!DOCTYPE html>
<html lang="ko">
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<meta charset="UTF-8">
<title>관리자 페이지</title>

<style>

.ad-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.ad-title{
  font-size:20px;
  font-weight:bold;
}

.add-btn{
  height:32px;
  padding:0 14px;
  background:#4CAF50;
  border-radius:6px;
}

.add-btn:hover{
  background:#3da444;
}

.admin-buttons button{
  width:100px;
}

#boardAdminList{
  max-height:800px;
  overflow:auto;
}

.board-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  margin-bottom:60px;
  align-items:flex-start;
}

html,body{
  height:100%;
}

body.login-mode{
  overflow:hidden;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial;
  background:#f5f5f5;
}

h2{
  margin-top:0;
}

input{
  width:99.8%;
  height:36px;
  margin-bottom:6px;
  padding:0 8px;
  box-sizing:border-box;
}

button{
  height:36px;
  padding:0 12px;
  border:none;
  background:#87CEEB;
  color:#fff;
  cursor:pointer;
  border-radius:6px;
}

button:hover{ background:#6bbfe0; }

.section{
  margin:40px 0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.card{
  background:#fff;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  cursor:grab;
  position:relative;
}

/* 게시판 카드 간격 */
#boardAdminList .card{
  margin-bottom:10px;
}

#boardAdminList{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.delete-btn{
  position:absolute;
  top:6px;
  right:6px;
  background:#ff5c5c;
  height:24px;
  font-size:12px;
}



.admin-container{
  width:1400px;
  margin:0 auto;
}

@media (max-width:1400px){
  .admin-container{
    width:100%;
    padding:0 20px;
  }
}

.top-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

/* =========================
   게시판 관리
========================= */

.board-box{
  background:white;
  border:1px solid #ddd;
  border-radius:8px;
  padding:15px;
  height:650px;
  min-height:650px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* 게시판 내용 제목 + 검색창 */
.board-list-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-shrink:0;
  margin-bottom:10px;
}

.board-list-header strong{
  font-size:16px;
  white-space:nowrap;
}

/* 게시판 검색창 */
#boardSearch{
  flex:1;
  width:auto;
  height:36px;
  margin:0;
  padding:0 10px;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:6px;
  outline:none;
  background:#fff;
}

#boardSearch:focus{
  border-color:#87CEEB;
}

/* 게시글 내용 영역 */
.board-content{
  flex:1;
  min-height:0;
  overflow:hidden;
}

/* 게시글 목록 */
#boardAdminList{
  height:100%;
  max-height:none;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* 게시글 카드 */
#boardAdminList .card{
  margin-bottom:0;
  flex-shrink:0;
}

/* 게시판 페이지 버튼 */
.board-pagination{
  height:36px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-top:10px;
}

.board-pagination button{
  background:white;
  color:#333;
  border:1px solid #ddd;
  margin:0;
}

.board-pagination button.active{
  background:#333;
  color:#fff;
  border-color:#333;
}

.board-box input,
.board-box textarea{
  width:100%;
  box-sizing:border-box;
}

.edit-btn{
  position:absolute;
  top:6px;
  right:60px;
  height:24px;
  font-size:12px;
  background:#4CAF50;
}

/* 게시판 페이지 버튼 */
#boardPagination button{
  background:white;
  color:#333;
  border:1px solid #ddd;
  margin:0 3px;
}

/* 현재 페이지 */
#boardPagination button.active{
  background:#87CEEB;
  color:white;
}

.admin-buttons{
  position:fixed;
  left:50%;
  margin-left:720px;   /* 사이트폭(1400px) 기준 오른쪽 */
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:5px;
  z-index:999;
}

.top-btn{
  height:40px;
  background:#e5e5e5;
  color:#333;
}

.admin-main{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.admin-scroll{
  display:flex;
  flex-direction:column;
  gap:5px;
  margin-top:15px;
}

#boardPagination{
  margin-top:10px;
  margin-bottom:40px;
  text-align:center;
}

.board-box:last-child{
  margin-bottom:40px;
}

#visitStats{
  display:flex;
  flex-wrap:nowrap;
  overflow:hidden;
  white-space:nowrap;
}

#visitStats div::after{
  content:"|";
  margin:0 10px;
}

#visitStats div:last-child::after{
  content:"";
}

.search-with-logo{
  display:flex;
  align-items:center;
  gap:8px;
}

.search-logo{
  height:36px;
  width:auto;
  border-radius:6px;
}

.search-with-logo input[type="text"]{
  flex:1;
  margin-bottom:0;
}

#siteDescriptionInput{
  margin:0;
  resize:vertical;
}

textarea{
  width:99.8%;
  margin-bottom:6px;
  padding:8px;
  box-sizing:border-box;
  font-family:Arial;
}

/* 관리자 정방형 슬라이드 */

.admin-square-slider{
  display:flex;
  align-items:center;
  gap:10px;
}

.admin-square-wrapper{
  overflow:hidden;
  width:100%;
}

#squareAdmin{
  display:flex;
  transition:transform .35s ease;
  will-change:transform;
}

/* 한 페이지 */

.square-page{
  min-width:100%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  box-sizing:border-box;
}

/* 카드 높이 */

.square-page .card{
  min-height:210px;
}

/* 버튼 */

.simple-slide-btn{
  width:34px;
  height:34px;
  background:#e5e5e5;
  color:#333;
  border:none;
  border-radius:6px;
  font-size:14px;
  flex-shrink:0;
}

.simple-slide-btn:hover{
  background:#d5d5d5;
}

/* 태블릿 */

@media (max-width:1200px){

  .square-page{
    grid-template-columns:repeat(4,1fr);
  }

}

/* 모바일 */

@media (max-width:768px){

  .square-page{
    grid-template-columns:repeat(2,1fr);
  }

}

/* =========================
   주문서 관리
========================= */

.order-summary-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* =========================
   주문서 검색
========================= */

.order-search-box{
  display:flex;
  align-items:center;
  gap:8px;
  margin:15px 0;
  width:100%;
  box-sizing:border-box;
}

.order-search-box input{
  flex:1;
  min-width:0;
  height:42px;
  padding:0 14px;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
  outline:none;
  margin:0;
}

.order-search-box button{
  flex:0 0 90px;
  width:90px;
  height:42px;
  margin:0;
  padding:0;
  border:none;
  border-radius:6px;
  background:#87CEEB;
  color:#fff;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  line-height:42px;
  white-space:nowrap;
  box-sizing:border-box;
  vertical-align:middle;
}

.order-search-box input:focus{
  border-color:#87CEEB;
  box-shadow:0 0 0 2px rgba(135,206,235,.2);
}

.order-search-box button:hover{
  background:#6bbfe0;
}

.order-search-result-text{
  margin:0 0 10px;
  font-size:13px;
  color:#666;
}


/* =========================
   모바일
========================= */

@media(max-width:768px){

  .order-search-box{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:6px;
  }

  .order-search-box input{
    flex:1 1 auto;
    width:auto;
    min-width:0;
    height:42px;
  }

  .order-search-box button{
    flex:0 0 72px;
    width:72px;
    height:42px;
    padding:0;
    font-size:13px;
  }

}

.order-summary-item{
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:8px;
  padding:10px 12px;
}

.order-summary-text{
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.order-detail-btn{
  flex-shrink:0;
  background:#87CEEB;
  color:#fff;
}

/* =========================
   주문 상세 팝업
========================= */

.order-detail-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:10000;

  padding:20px;

  box-sizing:border-box;

  align-items:center;
  justify-content:center;

  overflow:hidden;
}


/* 팝업창 */

.order-detail-box{

  width:min(1200px, calc(100vw - 40px));

  height:auto;

  max-height:calc(100vh - 40px);

  background:#fff;

  border-radius:12px;

  padding:20px 24px;

  position:relative;

  box-sizing:border-box;

  overflow:hidden;

}


/* 제목 */

.order-detail-box h2{

  margin:0 0 15px;

  font-size:22px;

}


/* 주문 상세 테이블 */

.order-detail-table{

  width:100%;

  border-collapse:collapse;

  table-layout:fixed;

  margin-top:0;

}


/* 테이블 */

.order-detail-table th,
.order-detail-table td{

  border-bottom:1px solid #eee;

  padding:8px 10px;

  text-align:left;

  vertical-align:middle;

  box-sizing:border-box;

}


/* 왼쪽 제목 */

.order-detail-table th{

  width:120px;

  background:#fafafa;

  font-size:13px;

  white-space:nowrap;

}


/* 오른쪽 내용 */

.order-detail-table td{

  width:auto;

}


/* 입력창 */

.order-detail-table input{

  width:100% !important;

  height:34px !important;

  margin:0 !important;

  box-sizing:border-box !important;

}


/* 텍스트영역 */

.order-detail-table textarea{

  width:100% !important;

  min-height:70px !important;

  max-height:70px;

  margin:0 !important;

  box-sizing:border-box !important;

  resize:none;

}


/* 닫기 버튼 */

.order-detail-close{

  position:absolute;

  right:15px;

  top:12px;

  width:34px;

  height:34px;

  padding:0;

  background:#eee;

  color:#333;

  border-radius:6px;

}


/* =========================
   2열 입력 영역
========================= */

.order-customer-grid{

  display:grid;

  grid-template-columns:repeat(2, minmax(0, 1fr));

  gap:8px 12px;

  width:100%;

}


.order-input-group{

  width:100%;

  min-width:0;

}


.order-input-group label{

  display:block;

  font-size:12px;

  font-weight:bold;

  margin-bottom:4px;

}


/* 우편번호 + 배송주소 */

.order-address-grid{

  display:grid;

  grid-template-columns:130px minmax(0, 1fr);

  gap:12px;

  width:100%;

}


/* 주문 상태 */

.order-status-select{

  height:34px;

  min-width:180px;

}


/* 저장 버튼 */

.order-status-save-btn{

  height:36px;

}

.order-status-row{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
}

/* =========================
   태블릿 자동 크기 조절
   모바일은 제외
========================= */
@media(min-width:769px) and (max-width:1100px){

  .order-detail-modal{
    padding:20px;
    box-sizing:border-box;
  }

  .order-detail-box{
    width:min(94vw, 900px);
    max-width:900px;
    box-sizing:border-box;
    padding:20px;
    margin:auto;
  }

  .order-detail-table{
    width:100%;
    table-layout:fixed;
  }

  .order-detail-table th{
    width:110px;
    box-sizing:border-box;
  }

  .order-detail-table td{
    width:auto;
    min-width:0;
    box-sizing:border-box;
  }

  .order-detail-table input,
  .order-detail-table textarea,
  .order-detail-table select{
    max-width:100%;
    box-sizing:border-box;
  }

  .order-customer-grid{
    grid-template-columns:repeat(2, minmax(0, 1fr));
    width:100%;
  }

  .order-address-grid{
    grid-template-columns:110px minmax(0, 1fr);
    width:100%;
  }

  .order-input-group{
    min-width:0;
  }
}

/* =========================
   모바일
========================= */

@media(max-width:768px){

  .order-detail-modal{

    padding:10px;

    overflow-y:auto;

    align-items:flex-start;

  }

  .order-detail-box{

    width:100%;

    max-height:none;

    padding:18px 12px;

    overflow:visible;

  }

  .order-detail-table th{

    width:85px;

    font-size:12px;

  }

  .order-customer-grid{

    grid-template-columns:1fr;

  }

  .order-address-grid{

    grid-template-columns:100px minmax(0, 1fr);

  }

}

.order-detail-close{
  position:absolute;
  right:15px;
  top:12px;

  background:#eee;
  color:#333;
}

  width:100%;

.order-detail-table th,

.order-detail-table th{

  width:140px;

  background:#fafafa;

.order-detail-table td{

  width:auto;

/* =========================
   주문서 페이지네이션
========================= */

.order-pagination{

  justify-content:center;

  align-items:center;

  gap:8px;

  margin-top:20px;

  flex-wrap:wrap;

}

.order-page-btn{

  background:none;

  border:none;

  color:#000;

  font-size:16px;

  cursor:pointer;

  padding:5px;

}

.order-list-fixed{

  min-height:370px;

}

.order-delete-btn{

  padding:8px 14px;

  border:1px solid #ddd;

  background:#fff;

  color:#000;

  cursor:pointer;

  border-radius:4px;

}

/* =========================
   주문서 관리 목록 테이블
========================= */

  width:100%;
  min-height:370px;
  background:#fff;
  border:1px solid #ddd;

  overflow:hidden;

.order-admin-table tr:hover{

}

.order-address-cell{
  text-align:left !important;
}

.order-email-cell{
  font-size:12px;
}

.order-customs-cell{
  font-size:12px;
}

.order-address-detail-cell{
  font-size:12px;
}

.order-product-link-btn{
  display:inline-flex;

  background:#fff;

.order-detail-btn{
  background:#fff;
  color:#111;
  border:1px solid #333;

  display:grid;

  width:100%;
}

  width:100%;
  min-width:0;

  width:100% !important;
  height:36px !important;
  margin:0 !important;
  box-sizing:border-box !important;
}

  display:grid;
  grid-template-columns:140px minmax(0, 1fr);
  gap:12px;
  width:100%;
}

  min-width:0;
}

.order-address-grid input{
  display:block;
  width:100% !important;

  margin:0 !important;
  box-sizing:border-box !important;
}

/* ========================================
   구매대행 추천 태그 관리
======================================== */

.purchase-tag-admin-form{

  display:grid;

  grid-template-columns:
  1fr
  2fr
  120px;

  gap:10px;

  margin-bottom:15px;

}


.purchase-tag-admin-form input{

  width:100%;

  height:40px;

  margin:0;

  box-sizing:border-box;

}


.purchase-tag-admin-form button{

  width:100%;

  height:40px;

  margin:0;

}


/* 태그 목록 */

.purchase-tag-admin-list{
  display:flex;
  flex-direction:column;
  gap:8px;

  /* 5개 태그가 모두 보이도록 충분한 높이 */
  height:390px;
  min-height:390px;
  box-sizing:border-box;

  overflow:visible;
}

/* 태그 한줄 */

.purchase-tag-admin-item{

  display:grid;

  grid-template-columns:
  150px
  1fr
  80px
  80px;

  gap:10px;

  align-items:center;

  padding:12px;

  background:#fff;

  border:1px solid #ddd;

  border-radius:8px;

}


/* 태그명 */

.purchase-tag-admin-name{

  font-weight:bold;

  color:#111;

}


/* 링크 */

.purchase-tag-admin-link{

/* ================= 공통 카드 생성 ================= */

function createCard(innerHTML, id=null){

  const div=document.createElement("div");

  div.className="card";

  div.draggable=true;

  /* 기존 DB 광고의 ID 보관 */
  if(id !== null && id !== undefined){
    div.dataset.id = id;
  }

  div.innerHTML=`
    <button
      class="delete-btn"
      onclick="deleteAd(this)">
      삭제
    </button>

    ${innerHTML}
  `;

  div.addEventListener(
    "dragstart",
    ()=>{
      dragItem=div;
    }
  );

  div.addEventListener(
    "dragover",
    e=>{
      e.preventDefault();
    }
  );

  div.addEventListener(
    "drop",
    function(){

      if(dragItem!==div){

        div.parentNode.insertBefore(
          dragItem,
          div.nextSibling
        );

      }

    }
  );

  return div;
}

/* ================= 추가 ================= */

function addImageAd(
  main="",
  img="",
  link="",
  video="",
  id=null
){

  imageAdmin.appendChild(

    createCard(`

      <input
        value="${main}"
        placeholder="메인 명칭">

        placeholder="이미지 URL">

        type="file"

        value="${link}"
        placeholder="클릭 링크">

}

function addTextAd(
  title="",
  link="",
  fallback1="",
  fallback2="",
  id=null
){

  textAdmin.appendChild(

    createCard(`

      <input
        value="${title}"
        placeholder="추천사이트 이름">

      <input
        value="${link}"
        placeholder="기본 주소">

      <input
        value="${fallback1}"
        placeholder="예비 주소 1">

      <input
        value="${fallback2}"
        placeholder="예비 주소 2">

    `, id)

  );

}

function addSquareAd(
  main="",
  img="",
  link="",
  price="",
  detail="",
  id=null
){

  const card = createCard(`

      <input
        value="${main}"
        placeholder="메인 명칭">

      <input
        value="${img}"
        placeholder="이미지 URL">

      <input
        type="file"
        accept="image/*"
        onchange="uploadImage(this)">

      <input
        value="${link}"
        placeholder="클릭 링크">

      <input
        value="${price}"
        placeholder="상품가격"
        inputmode="decimal">

      <input
        value="${detail}"
        placeholder="상품상세 이미지 링크">

    `, id);

  const oldCards =
    [...squareAdmin.querySelectorAll(".card")];

  const allCards =
    [card, ...oldCards];

  rebuildSquarePages(allCards);

}

function rebuildSquarePages(cards = null){

  if(!cards){
    cards = [...squareAdmin.querySelectorAll(".card")];
  }

  squareAdmin.innerHTML = "";

  const pageSize = 18;

  for(let i=0; i<cards.length; i+=pageSize){

    const page = document.createElement("div");
    page.className = "square-page";

    cards.slice(i, i+pageSize).forEach(card=>{
      page.appendChild(card);
    });

    squareAdmin.appendChild(page);

  }

  adminSquarePage = 0;

  squareAdmin.style.transform = "translateX(0)";
}

function addSnsVideo(
  title="",
  thumb="",
  video="",
  link="",
  id=null
){

  snsVideoAdmin.appendChild(

    createCard(`

      <input
        value="${title}"
        placeholder="영상 제목">

      <input
        value="${thumb}"
        placeholder="썸네일 이미지 URL">

      <input
        type="file"
        accept="image/*"
        onchange="uploadImage(this)">

      <input
        value="${video}"

      <input
        value="${link}"
        placeholder="클릭 링크">

    `, id)

  );

}

/* ================= 불러오기 ================= */

async function loadData(){

imageAdmin.innerHTML="";
textAdmin.innerHTML="";
squareAdmin.innerHTML="";
snsVideoAdmin.innerHTML="";

const { data: ads } = await supabaseClient
  .from("ads")
  .select("*")
  .order("sort",{ascending:true});

const squareCards = [];

ads.forEach(ad=>{

  if(ad.type==="image"){
    addImageAd(
    ad.main_title,
    ad.image_url,
    ad.link_url,
    ad.video_url,
    ad.id
  );
  }

  if(ad.type==="text"){
  addTextAd(
  ad.title,
  ad.link_url,
  ad.fallback_url_1,
  ad.fallback_url_2,
  ad.id
);
}

if(ad.type==="square"){

const card = createCard(`
    <input value="${ad.main_title || ""}" placeholder="메인 명칭">

    <input value="${ad.image_url || ""}" placeholder="이미지 URL">

    <input type="file" accept="image/*"
      onchange="uploadImage(this)">

    <input value="${ad.link_url || ""}" placeholder="클릭 링크">

    <input
      value="${ad.product_price || ""}"
      placeholder="상품가격"
      inputmode="decimal">

    <input value="${ad.detail_url || ""}" placeholder="상품상세 이미지 링크">
  `, ad.id);

  squareCards.push(card);

}

if(ad.type==="sns"){
  addSnsVideo(
  ad.title,
  ad.image_url,
  ad.video_url,
  ad.link_url,
  ad.id
);
}

});

/* 정방형광고 한번만 생성 */
rebuildSquarePages(squareCards);

const { data: settings } = await supabaseClient
  .from("site_settings")
  .select("*")
  .limit(1);

if(settings && settings.length>0){

  const s=settings[0];

  bannerImg.value=s.banner_img||"";
  bannerLink.value=s.banner_link||"";

  ownerNameInput.value=s.owner_name||"";
  ownerInstagram.value=s.owner_instagram||"";
  ownerYoutube.value=s.owner_youtube||"";
  ownerBlog.value=s.owner_blog||"";

  const logoInput = document.getElementById("searchLogoInput");
  if(logoInput) logoInput.value = s.search_logo || "";

  const logoPreview = document.getElementById("searchLogoPreview");
  if(logoPreview) logoPreview.src = s.search_logo || "";

  const adsense = document.getElementById("adsenseCode");
  if(adsense) adsense.value = s.adsense_code || "";

}
}

async function saveAll(){

  try{

    /* =====================================================
       1. 화면에서 모든 광고 카드 수집
    ===================================================== */

    const imageCards =
      [...imageAdmin.querySelectorAll(".card")];

    const textCards =
      [...textAdmin.querySelectorAll(".card")];

    const squareCards =
      [...squareAdmin.querySelectorAll(".card")];

    const snsCards =
      [...snsVideoAdmin.querySelectorAll(".card")];


    /* =====================================================
       2. 먼저 입력값 검사
       ※ 여기서는 DB를 아직 건드리지 않음
    ===================================================== */

    for(const card of imageCards){

      const i =
        card.querySelectorAll("input");

      const imageUrl =
        i[1].value.trim();

      const videoUrl =
        i[4].value.trim();

      if(imageUrl && videoUrl){

        if(
          !/^https?:\/\//i.test(videoUrl)
        ){

          alert(
            "이미지 광고의 영상 링크가 올바르지 않습니다.\n\n" +
            "http:// 또는 https:// 주소를 입력해주세요."
          );

          return;
        }

      }

    }


    for(const card of snsCards){

      const i =
        card.querySelectorAll("input");

      const thumbUrl =
        i[1].value.trim();

      const videoUrl =
        i[3].value.trim();

      if(thumbUrl && videoUrl){

        if(
          !/^https?:\/\//i.test(videoUrl)
        ){

          alert(
            "추천영상의 영상 링크가 올바르지 않습니다.\n\n" +
            "http:// 또는 https:// 주소를 입력해주세요."
          );

          return;
        }

      }

    }


    /* =====================================================
       3. 삭제된 기존 광고만 DELETE
    ===================================================== */

    for(const id of deletedAdIds){

      const { data: deletedAd, error } =
        await supabaseClient
          .from("ads")
          .delete()
          .eq("id", id)
          .select()
          .maybeSingle();

      if(error){

        console.error(
          "광고 삭제 오류:",
          error
        );

        alert(
          "광고 삭제에 실패했습니다.\n\n" +
          error.message
        );

        return;
      }

    }


    /* =====================================================
       4. 이미지 광고
       기존 ID → UPDATE
       ID 없음 → INSERT
    ===================================================== */

    for(
      const [index, card]
      of imageCards.entries()
    ){

      const i =
        card.querySelectorAll("input");

      const main =
        i[0].value.trim();

      const imageUrl =
        i[1].value.trim();

      const link =
        i[3].value.trim();

      const video =
        i[4].value.trim();

      if(!imageUrl){
        continue;
      }

      const payload = {

        type: "image",

        main_title: main,

        image_url: imageUrl,

        link_url: link,

        video_url: video,

        sort: index

      };

      const id =
        card.dataset.id;

/* ================= 주문서 관리 ================= */
let orderData = [];
let allOrderData = [];

let currentOrderId = null;

let currentOrderPage = 1;

const ordersPerPage = 5;

const maxOrderPages = 10;

function escapeOrderHTML(v){
  return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function loadOrders(){

  const list =
    document.getElementById("orderAdminList");

  if(!list) return;


  const {data,error} =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("id",{ascending:false});


  if(error){

    console.error(
      "주문서 불러오기 오류:",
      error
    );

    list.innerHTML =
      '<div class="card">주문서를 불러오지 못했습니다.</div>';

    return;

  }


  allOrderData = data || [];
  orderData = [...allOrderData];


  if(!orderData.length){

    list.innerHTML =
      '<div class="card">접수된 주문서가 없습니다.</div>';

    return;

  }


  renderOrderPage();

}

/* =========================
   주문서 검색
   주문번호 / 받는사람 / 송장번호
========================= */

function searchOrders(){

  const input =
    document.getElementById(
      "orderSearchInput"
    );

  const resultText =
    document.getElementById(
      "orderSearchResultText"
    );


  if(!input){
    return;
  }


  const keyword =
    input.value
      .trim()
      .toLowerCase();


  /* 검색어가 없으면 전체보기 */

  if(!keyword){

    resetOrderSearch();

    return;

  }


  orderData =
    allOrderData.filter(order => {

      const orderNumber =
        String(
          order.order_number || ""
        ).toLowerCase();


      const receiverName =
        String(
          order.receiver_name || ""
        ).toLowerCase();


      const trackingNumber =
        String(
          order.tracking_number || ""
        ).toLowerCase();


      return (

        orderNumber.includes(keyword) ||

        receiverName.includes(keyword) ||

        trackingNumber.includes(keyword)

      );

    });


  currentOrderPage = 1;


  if(resultText){

    resultText.textContent =
      `검색 결과: ${orderData.length}건`;

  }


  renderOrderPage();

}


/* =========================
   주문서 전체보기
========================= */

function resetOrderSearch(){

  const input =
    document.getElementById(
      "orderSearchInput"
    );

  const resultText =
    document.getElementById(
      "orderSearchResultText"
    );


  if(input){

    input.value = "";

  }


  orderData =
    [...allOrderData];


  currentOrderPage = 1;


  if(resultText){

    resultText.textContent = "";

  }


  renderOrderPage();

}

document.addEventListener(
  "keydown",
  function(e){

    const input =
      document.getElementById(
        "orderSearchInput"
      );


    if(
      input &&
      document.activeElement === input &&
      e.key === "Enter"
    ){

      e.preventDefault();

      searchOrders();

    }

  }
);

function renderOrderPagination(totalPages){

  if(totalPages <= 1){

    return "";

  }


  let html =

    `
    <div class="order-pagination">
    `;


  for(

    let page = 1;

    page <= totalPages;

    page++

  ){

    html += `

      <button

        class="order-page-btn
        ${
          page === currentOrderPage
            ? "active"
            : ""
        }"

        onclick="changeOrderPage(${page})">

        ${page}

      </button>

    `;

  }


  html +=

    `
    </div>
    `;


  return html;

}

function changeOrderPage(page){

  currentOrderPage = page;

  renderOrderPage();

}

async function loadPurchaseTags(){

  const list =
    document.getElementById(
      "purchaseTagAdminList"
    );

  if(!list) return;


  const { data, error } =
    await supabaseClient
      .from("purchase_tags")
      .select("*")
      .order("sort",{ascending:true})
      .order("id",{ascending:true});


  if(error){

    console.error(
      "구매대행 태그 불러오기 오류:",
      error
    );


    list.innerHTML =
      '<div class="card">태그를 불러오지 못했습니다.</div>';


    return;

  }


  purchaseTagData = data || [];


  /* 현재 페이지가 전체 페이지보다 크면 조정 */

  const totalPages =
    Math.ceil(
      purchaseTagData.length /
      purchaseTagsPerPage
    );


  if(
    currentPurchaseTagPage >
    totalPages
  ){

    currentPurchaseTagPage =
      Math.max(
        1,
        totalPages
      );

  }


  renderPurchaseTags();

}


/* ========================================
   구매대행 태그 목록 출력
======================================== */

function renderPurchaseTags(){

  const list =
    document.getElementById(
      "purchaseTagAdminList"
    );


  const pagination =
    document.getElementById(
      "purchaseTagPagination"
    );


  if(!list) return;


  list.innerHTML = "";


  if(pagination){

    pagination.innerHTML = "";

  }


  /* 태그가 없을 경우 */

  if(!purchaseTagData.length){

    list.innerHTML = `

      <div
      class="card"
      style="
        text-align:center;
        color:#888;
        padding:20px;
      ">

        등록된 태그가 없습니다.

      </div>

    `;


    return;

  }


  /* 전체 페이지 */

  const totalPages =
    Math.ceil(

      purchaseTagData.length /

      purchaseTagsPerPage

    );


  /* 최대 10페이지까지만 */

  const displayPages =
    Math.min(

      totalPages,

      maxPurchaseTagPages

    );


  /* 시작 위치 */

  const startIndex =

    (
      currentPurchaseTagPage - 1
    )

    *

    purchaseTagsPerPage;


  /* 끝 위치 */

  const endIndex =

    startIndex +

    purchaseTagsPerPage;


  /* 현재 페이지 데이터 */

  const pageTags =

    purchaseTagData.slice(

      startIndex,

      endIndex

    );


  /* 태그 출력 */

  pageTags.forEach(tag=>{


    const item =
      document.createElement("div");


    item.className =
      "purchase-tag-admin-item";


    item.innerHTML = `

      <div
      class="purchase-tag-admin-name">

        #${escapePurchaseTagHTML(
          tag.title
        )}

      </div>


      <div
      class="purchase-tag-admin-link"
      title="${escapePurchaseTagHTML(
        tag.link_url
      )}">

        ${escapePurchaseTagHTML(
          tag.link_url
        )}

      </div>


      <button
      class="purchase-tag-edit-btn"
      onclick="editPurchaseTag(
        ${tag.id}
      )">

        수정

      </button>


      <button
      class="purchase-tag-delete-btn"
      onclick="deletePurchaseTag(
        ${tag.id}
      )">

        삭제

      </button>

    `;


    list.appendChild(item);


  });


  /* =========================
     페이지네이션 생성
  ========================= */

  if(

    pagination &&

    totalPages > 1

  ){


    /* 이전 버튼 */

    if(

      currentPurchaseTagPage > 1

    ){


      const prev =
        document.createElement(
          "button"
        );


      prev.textContent =
        "◀";


      prev.onclick = ()=>{

        currentPurchaseTagPage--;


        renderPurchaseTags();

      };


      pagination.appendChild(
        prev
      );

    }


    /* 페이지 번호 */

    for(

      let page = 1;

      page <= displayPages;

      page++

    ){


      const btn =
        document.createElement(
          "button"
        );


      btn.textContent =
        page;


      /* 현재 페이지 */

      if(

        page ===
        currentPurchaseTagPage

      ){

        btn.classList.add(
          "active"
        );

      }


      btn.onclick = ()=>{

        currentPurchaseTagPage =
          page;


        renderPurchaseTags();

      };


      pagination.appendChild(
        btn
      );

    }


    /* 다음 버튼 */

    if(

      currentPurchaseTagPage <
      totalPages

    ){


      const next =
        document.createElement(
          "button"
        );


      next.textContent =
        "▶";


      next.onclick = ()=>{

        currentPurchaseTagPage++;


        renderPurchaseTags();

      };


      pagination.appendChild(
        next
      );

    }

  }

}


/* ========================================
   HTML 보안 처리
======================================== */

function escapePurchaseTagHTML(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

======================================== */

async function savePurchaseTag(){

  const title =
    document.getElementById(
      "purchaseTagTitle"
    )
    .value
    .trim();


  const linkUrl =
    document.getElementById(
      "purchaseTagLink"
    )
    .value
    .trim();


  if(!title){

    alert(
      "태그명을 입력해주세요."
    );

    return;

  }


  if(!linkUrl){

    alert(
      "연결할 링크를 입력해주세요."
    );

    return;

  }


  let error;


  /* 수정 */

  if(editingPurchaseTagId){

    const result =
      await supabaseClient
        .from("purchase_tags")
        .update({

          title:title,

          link_url:linkUrl

        })
        .eq(
          "id",
          editingPurchaseTagId
        );


    error =
      result.error;

  }


  /* 새로 추가 */

  else{

    const nextSort =
      purchaseTagData.length;


    const result =
      await supabaseClient
        .from("purchase_tags")
        .insert({

          title:title,

          link_url:linkUrl,

          sort:nextSort

        });


    error =
      result.error;

  }


  if(error){

    console.error(
      "구매대행 태그 저장 오류:",
      error
    );


    alert(
      "태그 저장에 실패했습니다.\n\n" +
      error.message
    );

    return;

  }


  alert(
    editingPurchaseTagId
      ? "태그가 수정되었습니다."
      : "태그가 추가되었습니다."
  );


  editingPurchaseTagId = null;


  document.getElementById(
    "purchaseTagTitle"
  ).value = "";


  document.getElementById(
    "purchaseTagLink"
  ).value = "";


  document.getElementById(
    "purchaseTagSaveBtn"
  ).textContent = "태그 추가";


  await loadPurchaseTags();

}

function editPurchaseTag(id){

  const tag =
    purchaseTagData.find(
      item =>
        item.id === id
    );


  if(!tag) return;


  editingPurchaseTagId =
    id;


  document.getElementById(
    "purchaseTagTitle"
  ).value =
    tag.title || "";


  document.getElementById(
    "purchaseTagLink"
  ).value =
    tag.link_url || "";


  document.getElementById(
    "purchaseTagSaveBtn"
  ).textContent =
    "태그 수정";


  document.getElementById(
    "purchaseTagTitle"
  ).focus();


  window.scrollTo({

    top:
      document.getElementById(
        "purchaseTagTitle"
      )
      .getBoundingClientRect()
      .top +

      window.scrollY -

      100,

    behavior:"smooth"

  });

}

======================================== */

async function deletePurchaseTag(id){

  const tag =
    purchaseTagData.find(
      item =>
        item.id === id
    );


  if(!tag) return;


  const ok =
    confirm(

      `#${tag.title} 태그를 삭제하시겠습니까?`

    );


  if(!ok) return;


  const { error } =
    await supabaseClient

      .from("purchase_tags")

      .delete()

      );


  if(error){

    console.error(

      error
    );


    alert(
      "태그 삭제에 실패했습니다.\n\n" +

    );

    return;

  }


  alert(
    "태그가 삭제되었습니다."
  );


  if(
    editingPurchaseTagId === id
  ){

    addPurchaseTag();

  }


  await loadPurchaseTags();

}

const boardAdminList = document.getElementById("boardAdminList");
const boardPagination = document.getElementById("boardPagination");

let boardData = [];
let currentPage = 1;
let editingPostId = null;

const rowsPerPage = 5;
const maxPageButtons = 10;

let boardSearchKeyword = "";

/* 게시판 데이터 불러오기 */

async function loadBoardData(){

  const { data } = await supabaseClient
    .from("board_posts")
    .select("*")
    .order("id",{ascending:false});

  boardData = data || [];
  currentPage = 1;

  renderBoard();
}

/* 게시판 출력 */

function escapeHTML(str){

  if(!str) return "";

  return str
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;");

}

function renderBoard(){

  boardAdminList.innerHTML="";

  const keyword =
    boardSearchKeyword.trim().toLowerCase();

  const filteredData =
    keyword
      ? boardData.filter(post => {

          const category =
            String(post.category || "").toLowerCase();

          const title =
            String(post.title || "").toLowerCase();

          const content =
            String(post.content || "").toLowerCase();

          return (
            category.includes(keyword) ||
            title.includes(keyword) ||
            content.includes(keyword)
          );

        })
      : boardData;


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filteredData.length /
        rowsPerPage
      )
    );


  if(currentPage > totalPages){
    currentPage = totalPages;
  }


  const start =
    (currentPage - 1) *
    rowsPerPage;

  const end =
    start +
    rowsPerPage;


  const pageItems =
    filteredData.slice(
      start,
      end
    );


  if(pageItems.length === 0){

    boardAdminList.innerHTML = `
      <div
        style="
          text-align:center;
          color:#888;
          padding:30px 10px;
        "
      >
        검색된 게시글이 없습니다.
      </div>
    `;

  }else{

    pageItems.forEach(post=>{

      const div =
        document.createElement("div");

      div.className="card";

      div.innerHTML=`

        <button
          class="delete-btn"
          onclick="deleteBoardPost(${post.id})">
          삭제
        </button>

        <button
          class="edit-btn"
          onclick="editBoardPost(${post.id})">
          수정
        </button>

        <div
          style="
            font-size:12px;
            color:#888;
            margin-bottom:4px;
          "
        >
          [${escapeHTML(
            post.category || "일반"
          )}]
        </div>

        <strong>
          ${escapeHTML(
            post.title
          )}
        </strong>

      `;

      boardAdminList.appendChild(div);

    });

  }


  renderPagination(
    totalPages
  );

}

function searchBoardPosts(){

  const searchInput =
    document.getElementById(
      "boardSearch"
    );

  boardSearchKeyword =
    searchInput
      ? searchInput.value
      : "";

  currentPage = 1;

  renderBoard();

}

/* 페이지 버튼 */

function renderPagination(){

  boardPagination.innerHTML="";

  const keyword =
    boardSearchKeyword
      .trim()
      .toLowerCase();


  const filteredData =
    keyword
      ? boardData.filter(post => {

          const category =
            String(
              post.category || ""
            ).toLowerCase();

          const title =
            String(
              post.title || ""
            ).toLowerCase();

          const content =
            String(
              post.content || ""
            ).toLowerCase();

          return (
            category.includes(keyword) ||
            title.includes(keyword) ||
            content.includes(keyword)
          );

        })
      : boardData;


  const totalPages =
    Math.ceil(
      filteredData.length /
      rowsPerPage
    );


  if(totalPages <= 1){
    return;
  }


  let startPage =
    Math.floor(
      (currentPage - 1) /
      maxPageButtons
    ) *
    maxPageButtons +
    1;


  let endPage =
    Math.min(
      startPage +
      maxPageButtons -
      1,
      totalPages
    );


  if(currentPage > 1){

    const prev =
      document.createElement(
        "button"
      );

    prev.textContent="◀";

    prev.onclick=()=>{

      currentPage--;

      renderBoard();

    };

    boardPagination.appendChild(
      prev
    );

  }


  for(
    let i=startPage;
    i<=endPage;
    i++
  ){

    const btn =
      document.createElement(
        "button"
      );

    btn.textContent=i;


    if(i === currentPage){

      btn.classList.add(
        "active"
      );

    }


    btn.onclick=()=>{

      currentPage=i;

      renderBoard();

    };


    boardPagination.appendChild(
      btn
    );

  }


  if(
    currentPage <
    totalPages
  ){

    const next =

async function deleteBannerImage(){

  const imageUrl = bannerImg.value.trim();

  if(!imageUrl){
    alert("삭제할 배너가 없습니다.");
    return;
  }

  const confirmDelete =
    confirm("배너 이미지를 삭제하시겠습니까?\n\nSupabase Storage에서도 삭제됩니다.");

  if(!confirmDelete) return;


  /* =========================
     Supabase Storage 파일 삭제
  ========================= */

  const storageBase =
    "/storage/v1/object/public/yb365/";

  if(imageUrl.includes(storageBase)){

    const filePath =
      decodeURIComponent(
        imageUrl.split(storageBase)[1]
      );

    const { error: storageError } =
      await supabaseClient
        .storage
        .from("yb365")
        .remove([filePath]);

    if(storageError){

      console.error(
        "배너 Storage 삭제 오류:",
        storageError
      );

      alert(
        "배너 파일 삭제 실패:\n" +
        storageError.message
      );

      return;
    }
  }


  /* =========================
     site_settings에서도 삭제
  ========================= */

  const { error: dbError } =
    await supabaseClient
      .from("site_settings")
      .update({
        banner_img: "",
        banner_link: ""
      })
      .eq("id", 1);

  if(dbError){

    console.error(
      "배너 설정 삭제 오류:",
      dbError
    );

    alert(
      "배너 설정 삭제 실패:\n" +
      dbError.message
    );

    return;
  }


  /* 화면에서도 삭제 */

  bannerImg.value = "";
  bannerLink.value = "";

  const bannerFile =
    document.querySelector(
      'input[type="file"][onchange="uploadBannerImage(this)"]'
    );

  if(bannerFile){
    bannerFile.value = "";
  }


  alert("배너 삭제 완료 ✅");
}

async function loadVisitStats(){

  const today = new Date();
  const startDate = new Date();
  startDate.setDate(today.getDate() - 29);   // 오늘 포함 최근 30일

  const start = startDate.toISOString().split("T")[0];
  const todayStr = today.toISOString().split("T")[0];

  const { data } = await supabaseClient
    .from("site_visits")
    .select("*")
    .gte("date", start)
    .lte("date", todayStr)
    .order("date", { ascending: false });

  if(!data) return;

  let total = 0;
  let todayCount = 0;

  const labels = [];
  const counts = [];

  data.forEach(row => {

    total += row.count;

    if(row.date === todayStr){
      todayCount = row.count;
    }

    labels.push(row.date.slice(5)); // MM-DD
    counts.push(row.count);

  });

  document.getElementById("todayVisit").textContent = todayCount;
  document.getElementById("totalVisit").textContent = total;

  const ctx = document.getElementById("visitChart");

  if(window.visitChartInstance){
    window.visitChartInstance.destroy();
  }

  window.visitChartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        data: counts,
        tension: 0.3,
        fill: true
      }]
    },
    options: {
      plugins:{ legend:{ display:false }},
      scales:{ y:{ display:false }}
    }
  });
}

loadVisitStats();

let adminSquarePage = 0;

function slideAdminSquare(direction){

  const wrapper =
    document.querySelector(".admin-square-wrapper");

  const pageWidth = wrapper.clientWidth;

  const totalPages =
    squareAdmin.querySelectorAll(".square-page").length;

  adminSquarePage += direction;

  if(adminSquarePage < 0){
    adminSquarePage = 0;
  }

  if(adminSquarePage >= totalPages){
    adminSquarePage = totalPages - 1;
  }

  squareAdmin.style.transform =
    `translateX(-${adminSquarePage * pageWidth}px)`;

}
