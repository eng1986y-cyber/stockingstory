<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내 정보 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    /* ⭐ 전체 컨테이너 넓이 통일 및 여백 정리 */
    .mypage-wrap { 
      max-width: 640px; 
      margin: 40px auto; 
      padding: 0 16px; 
      box-sizing: border-box; 
    }
    
    .mypage-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #222;
      padding: 0 4px; /* ⭐ 제목도 카드와 라인 맞춤 */
    }
    body.dark .mypage-title { color: #fff; }
    
    .mypage-form {
      display: grid;
      gap: 10px;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      margin-bottom: 32px;
      box-sizing: border-box;
      width: 100%;
    }
    body.dark .mypage-form {
      background: #151515;
      border: 1px solid #222;
      border-radius: 12px;
    }

    /* ⭐ 2열 배치 그리드 */
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 12px;
    }
    @media (max-width: 768px) {
      .form-grid-2 {
        grid-template-columns: 1fr; /* 모바일은 1열로 변경 */
        gap: 10px;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mypage-form label {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }
    body.dark .mypage-form label { color: #999; }
    
    .mypage-form input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
      width: 100%;
    }
    body.dark .mypage-form input {
      background: #0f0f0f;
      border-color: #2a2a2a;
      color: #e5e7eb;
    }
    body.dark .mypage-form input::placeholder { color: #555; }
    .mypage-form input[readonly] {
      background: #f5f5f5;
      color: #888;
    }
    body.dark .mypage-form input[readonly] {
      background: #1a1a1a;
      color: #666;
    }
    body.dark .mypage-form input:focus {
      outline: none;
      border-color: #555;
      box-shadow: 0 0 0 3px rgba(255,255,255,.05);
    }

    /* ⭐ 저장 버튼 전체 영역 차지 */
    .mypage-form button[type="submit"] {
      grid-column: 1 / -1;
      padding: 14px;
      background: #03c75a;
      color: #fff;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      font-family: inherit;
      margin-top: 10px;
    }
    .mypage-form button[type="submit"]:hover { background: #02b151; }
    
    #msg { margin-top: 12px; font-weight: 600; text-align: center; margin-bottom: 24px; }

    /* ⭐ 주문 내역 스타일 */
    .order-history-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #222;
      padding: 0 4px; /* ⭐ 제목도 카드와 라인 맞춤 */
    }
    body.dark .order-history-title { color: #fff; }
    
    .order-history-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }
    
    .history-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      font-size: 14px;
      line-height: 1.6;
      color: #222;
      box-sizing: border-box;
      width: 100%;
    }
    body.dark .history-card {
      background: #151515;
      border-color: #222;
      color: #e5e7eb;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }
    body.dark .history-header { border-bottom-color: #222; }
    
    .history-date { font-size: 13px; color: #888; }
    .history-status {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      color: #fff;
    }
    .history-order-num {
      font-weight: 700;
      color: #1976d2;
      font-size: 15px;
      margin-bottom: 12px;
      display: block;
    }
    body.dark .history-order-num { color: #60a5fa; }

    .history-product-item {
      padding: 10px 0;
      border-bottom: 1px dashed #eee;
    }
    body.dark .history-product-item { border-bottom-color: #222; }
    .history-product-item:last-child { border-bottom: none; }

    .history-item-main {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .history-item-main .name { font-weight: 600; }
    .history-item-main .qty { color: #888; margin-left: 4px; font-weight: normal; font-size: 13px; }
    
    .history-item-detail {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
    }
    body.dark .history-item-detail { color: #9ca3af; }

    .history-info-box {
      margin-top: 16px;
      background: #f9fafb;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #4b5563;
      line-height: 1.6;
    }
    body.dark .history-info-box { background: #0f0f0f; color: #9ca3af; }
    
    .history-total {
      text-align: right;
      font-weight: 700;
      font-size: 15px;
      color: #e53935;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    body.dark .history-total { border-top-color: #222; color: #ef4444; }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div class="mypage-wrap">
      <h2 class="mypage-title">내 정보</h2>
      
      <!-- ⭐ 2열 그리드 폼 적용 -->
      <form id="mypage-form" class="mypage-form form-grid-2">
        <div class="form-group">
          <label>아이디 (변경 불가)</label>
          <input name="username" readonly>
        </div>
        
        <div class="form-group">
          <label>비밀번호</label>
          <input name="password" type="password" placeholder="변경 시 입력">
        </div>

        <div class="form-group">
          <label>이름</label>
          <input name="name" required>
        </div>

        <div class="form-group">
          <label>연락처</label>
          <input name="phone" type="tel" inputmode="numeric" required>
        </div>

        <div class="form-group">
          <label>이메일</label>
          <input name="email" type="email">
        </div>

        <div class="form-group">
          <label>우편번호</label>
          <input name="postcode">
        </div>

        <div class="form-group">
          <label>주소</label>
          <input name="address">
        </div>

        <div class="form-group">
          <label>상세주소</label>
          <input name="address_detail">
        </div>

        <button type="submit">저장</button>
      </form>
      <p id="msg"></p>

      <!-- ⭐ 내 주문 내역 섹션 -->
      <h2 class="order-history-title">내 주문내역</h2>
      <div id="order-history-list" class="order-history-list">
        <p style="color:#888; font-size:14px;">주문 내역을 불러오는 중입니다...</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const form = document.getElementById('mypage-form');
    const msg = document.getElementById('msg');
    const historyListEl = document.getElementById('order-history-list');

    let member = JSON.parse(localStorage.getItem('member') || 'null');
    if (!member || !member.id) {
      alert('로그인이 필요합니다.');
      location.href = 'login.html';
    }

    function statusColor(s) {
      return { '입금대기':'#f59e0b', '입금완료':'#059669', '배송중':'#1976d2', '완료':'#6b7280', '취소':'#dc2626' }[s] || '#9ca3af';
    }

    async function loadFromServer() {
      const { data, error } = await db.from('members').select('*').eq('id', member.id).maybeSingle();
      if (error) { console.error(error); return; }
      if (!data) {
        alert('회원 정보를 찾을 수 없습니다. 다시 로그인해주세요.');
        localStorage.removeItem('member');
        location.href = 'login.html';
        return;
      }
      member = data;
      localStorage.setItem('member', JSON.stringify(data));

      form.username.value = data.username || '';
      form.name.value = data.name || '';
      form.phone.value = data.phone || '';
      form.email.value = data.email || '';
      form.postcode.value = data.postcode || '';
      form.address.value = data.address || '';
      form.address_detail.value = data.address_detail || '';

      loadOrderHistory(data);
    }

    async function loadOrderHistory(m) {
      historyListEl.innerHTML = '<p style="color:#888; font-size:14px;">주문 내역을 불러오는 중입니다...</p>';
      
      const { data, error } = await db.from('orders')
        .select('*')
        .or(`and(customer_name.eq.${m.name},customer_phone.eq.${m.phone}),and(customer_name.eq.${m.name},depositor_name.eq.${m.name})`)
        .order('created_at', { ascending: false });

      if (error) {
        const fallbackRes = await db.from('orders').select('*').eq('customer_name', m.name).order('created_at', { ascending: false });
        if (fallbackRes.error || !fallbackRes.data || fallbackRes.data.length === 0) {
          historyListEl.innerHTML = '<p style="color:#888; font-size:14px;">주문 내역이 없습니다.</p>';
          return;
        }
        renderHistory(fallbackRes.data);
        return;
      }

      if (!data || data.length === 0) {
        historyListEl.innerHTML = '<p style="color:#888; font-size:14px;">주문 내역이 없습니다.</p>';
        return;
      }

      renderHistory(data);
    }

    function renderHistory(orders) {
      const groups = {};
      orders.forEach(o => {
        const key = o.order_number || `single_${o.id}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(o);
      });

      const entries = Object.entries(groups);

      historyListEl.innerHTML = entries.map(([key, items]) => {
        const first = items[0];
        const totalAll = items.reduce((s, o) => s + Number(o.total_price || 0), 0);
        const dateStr = new Date(first.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        const displayNum = first.order_number || `(번호 없음)`;
        const fullAddress = `${first.postcode ? `[${first.postcode}] ` : ''}${first.address || ''} ${first.address_detail || ''}`.trim();

        return `
          <div class="history-card">
            <div class="history-header">
              <span class="history-date">${dateStr}</span>
              <span class="history-status" style="background:${statusColor(first.status)};">${first.status || '-'}</span>
            </div>
            <span class="history-order-num">${displayNum}</span>
            
            <div>
              ${items.map(o => {
                const opts = [];
                if (o.selected_color) opts.push(`색상: ${o.selected_color}`);
                if (o.selected_size) opts.push(`사이즈: ${o.selected_size}`);
                if (o.selected_hem) opts.push(`밑단: ${o.selected_hem}`);
                if (o.selected_other) opts.push(`기타: ${o.selected_other}`);
                const optStr = opts.length ? opts.join(' | ') : '기본 옵션';

                return `
                  <div class="history-product-item">
                    <div class="history-item-main">
                      <span class="name">${o.product_name} <span class="qty">x ${o.quantity}</span></span>
                      <span>${Number(o.total_price).toLocaleString()}원</span>
                    </div>
                    <div class="history-item-detail">
                      ${optStr}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="history-info-box">
              <div>📍 <b>배송지:</b> ${fullAddress || '주소 정보 없음'}</div>
              ${first.memo ? `<div style="margin-top:4px;">📝 <b>요청사항:</b> ${first.memo}</div>` : ''}
              ${(first.courier || first.tracking_number) ? `
                <div style="margin-top:8px; padding-top:8px; border-top:1px dashed #ddd; color:#1976d2;">
                  🚚 <b>배송정보:</b> ${first.courier || '택배사 미정'} | ${first.tracking_number || '운송장 없음'}
                </div>
              ` : ''}
            </div>

            <div class="history-total">총 결제금액: ${totalAll.toLocaleString()}원</div>
          </div>
        `;
      }).join('');
    }

    loadFromServer();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '저장 중...';
      msg.style.color = '#888';

      const updates = {
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        email: form.email.value.trim() || null,
        postcode: form.postcode.value.trim() || null,
        address: form.address.value.trim() || null,
        address_detail: form.address_detail.value.trim() || null,
      };

      if (form.password.value) updates.password = form.password.value;

      const { error } = await db.from('members').update(updates).eq('id', member.id);

      if (error) {
        msg.style.color = '#ef4444';
        msg.textContent = '❌ ' + error.message;
        return;
      }

      const updated = { ...member, ...updates };
      localStorage.setItem('member', JSON.stringify(updated));
      member = updated;

      form.password.value = '';
      msg.style.color = '#10b981';
      msg.textContent = '✅ 저장 완료!';
      
      loadOrderHistory(member);
      
      setTimeout(() => msg.textContent = '', 2000);
    });
  </script>
</body>
</html>
