<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내 정보 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div style="max-width:500px; margin:40px auto;">
      <h2 style="margin-bottom:16px;">내 정보</h2>
      <form id="mypage-form" style="display:grid; gap:10px; background:#fff; padding:24px; border-radius:8px;">
        <label style="font-size:13px; color:#666;">아이디 (변경 불가)</label>
        <input name="username" readonly
          style="padding:12px; border:1px solid #ddd; border-radius:6px; background:#f5f5f5;">

        <label style="font-size:13px; color:#666;">비밀번호</label>
        <input name="password" type="password" placeholder="비밀번호 (변경 시 입력)"
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">이름</label>
        <input name="name" required
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">연락처</label>
        <input name="phone" type="tel" inputmode="numeric" required
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">이메일</label>
        <input name="email" type="email"
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">우편번호</label>
        <input name="postcode"
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">주소</label>
        <input name="address"
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">상세주소</label>
        <input name="address_detail"
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <button type="submit"
          style="padding:14px; background:#03c75a; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600; font-size:15px;">
          저장
        </button>
      </form>
      <p id="msg" style="margin-top:12px; font-weight:600; text-align:center;"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const form = document.getElementById('mypage-form');
    const msg = document.getElementById('msg');

    let member = JSON.parse(localStorage.getItem('member') || 'null');
    if (!member || !member.id) {
      alert('로그인이 필요합니다.');
      location.href = 'login.html';
    }

    // ⭐ 서버에서 최신 정보 다시 불러오기 (localStorage 값이 오래됐을 수 있음)
    async function loadFromServer() {
      const { data, error } = await db
        .from('members')
        .select('*')
        .eq('id', member.id)
        .maybeSingle();

      if (error) { console.error(error); return; }
      if (!data) {
        alert('회원 정보를 찾을 수 없습니다. 다시 로그인해주세요.');
        localStorage.removeItem('member');
        location.href = 'login.html';
        return;
      }

      member = data;
      localStorage.setItem('member', JSON.stringify(data));

      form.username.value = data.username || '';
      form.name.value = data.name || '';
      form.phone.value = data.phone || '';
      form.email.value = data.email || '';
      form.postcode.value = data.postcode || '';
      form.address.value = data.address || '';
      form.address_detail.value = data.address_detail || '';
    }

    loadFromServer();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '저장 중...';
      msg.style.color = '#222';

      const updates = {
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        email: form.email.value.trim() || null,
        postcode: form.postcode.value.trim() || null,
        address: form.address.value.trim() || null,
        address_detail: form.address_detail.value.trim() || null,
      };

      // 비밀번호 입력했을 때만 변경
      if (form.password.value) {
        updates.password = form.password.value;
      }

      const { error } = await db
        .from('members')
        .update(updates)
        .eq('id', member.id);

      if (error) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ ' + error.message;
        return;
      }

      // localStorage 갱신
      const updated = { ...member, ...updates };
      localStorage.setItem('member', JSON.stringify(updated));
      member = updated;

      form.password.value = '';
      msg.style.color = 'green';
      msg.textContent = '✅ 저장 완료!';
      setTimeout(() => msg.textContent = '', 2000);
    });
  </script>
</body>
</html>
