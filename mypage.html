<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내 정보 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div style="max-width:500px; margin:40px auto;">
      <h2 style="margin-bottom:16px;">내 정보</h2>
      <form id="mypage-form" style="display:grid; gap:10px; background:#fff; padding:24px; border-radius:8px;">
        <label style="font-size:13px; color:#666;">아이디 (변경 불가)</label>
        <input name="username" readonly
          style="padding:12px; border:1px solid #ddd; border-radius:6px; background:#f5f5f5;">

        <label style="font-size:13px; color:#666;">비밀번호</label>
        <input name="password" type="password" required
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">이름</label>
        <input name="name" required
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">연락처</label>
        <input name="phone" type="tel" inputmode="numeric" required
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">이메일</label>
        <input name="email" type="email"
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">우편번호</label>
        <input name="postcode"
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">주소</label>
        <input name="address"
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <label style="font-size:13px; color:#666;">상세주소</label>
        <input name="address_detail"
          style="padding:12px; border:1px solid #ddd; border-radius:6px;">

        <button type="submit"
          style="padding:14px; background:#03c75a; color:#fff; border:0; border-radius:6px; cursor:pointer; font-weight:600; font-size:15px;">
          저장
        </button>
      </form>
      <p id="msg" style="margin-top:12px; font-weight:600; text-align:center;"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const form = document.getElementById('mypage-form');
    const msg = document.getElementById('msg');

    const member = JSON.parse(localStorage.getItem('member') || 'null');
    if (!member) {
      alert('로그인이 필요합니다.');
      location.href = 'login.html';
    } else {
      form.username.value = member.username || '';
      form.name.value = member.name || '';
      form.phone.value = member.phone || '';
      form.email.value = member.email || '';
      form.postcode.value = member.postcode || '';
      form.address.value = member.address || '';
      form.address_detail.value = member.address_detail || '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '저장 중...';
      msg.style.color = '#222';

      const updates = {
        password: form.password.value,
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        email: form.email.value.trim(),
        postcode: form.postcode.value.trim(),
        address: form.address.value.trim(),
        address_detail: form.address_detail.value.trim(),
      };

      const { error } = await db
        .from('members')
        .update(updates)
        .eq('id', member.id);

      if (error) {
        msg.style.color = 'crimson';
        msg.textContent = '❌ ' + error.message;
        return;
      }

      localStorage.setItem('member', JSON.stringify({ ...member, ...updates }));
      msg.style.color = 'green';
      msg.textContent = '✅ 저장 완료!';
    });
  </script>
</body>
</html>
