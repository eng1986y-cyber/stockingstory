<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내 정보 - Simple life' StockingStory</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    /* ⭐ main의 기본 여백을 무력화해서 .mypage-wrap이 정확히 중앙에 오도록 */
    main {
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* ⭐ 전체 컨테이너 중앙 정렬 (좌우 auto + width 100%) */
    .mypage-wrap { 
      max-width: 640px; 
      width: 100%;
      margin: 40px auto; 
      padding: 0 16px; 
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    
    .mypage-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #222;
      padding: 0 4px;
      text-align: left;
    }
    body.dark .mypage-title { color: #fff; }
    
    /* ⭐ [내 정보] 폼 카드 */
    .mypage-form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin-bottom: 32px;
      box-sizing: border-box;
      width: 100%;
      display: block;
    }
    body.dark .mypage-form {
      background: #151515;
      border: 1px solid #222;
      border-radius: 12px;
    }

    /* ⭐ 내부 2열 그리드 */
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 12px;
    }
    @media (max-width: 768px) {
      .form-grid-2 {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .mypage-wrap {
        margin: 24px auto;
        padding: 0 12px;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mypage-form label {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }
    body.dark .mypage-form label { color: #999; }
    
    .mypage-form input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
      width: 100%;
    }
    body.dark .mypage-form input {
      background: #0f0f0f;
      border-color: #2a2a2a;
      color: #e5e7eb;
    }
    body.dark .mypage-form input::placeholder { color: #555; }
    .mypage-form input[readonly] {
      background: #f5f5f5;
      color: #888;
    }
    body.dark .mypage-form input[readonly] {
      background: #1a1a1a;
      color: #666;
    }
    body.dark .mypage-form input:focus {
      outline: none;
      border-color: #555;
      box-shadow: 0 0 0 3px rgba(255,255,255,.05);
    }

    /* ⭐ 저장 버튼 */
    .mypage-form button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: #03c75a;
      color: #fff;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      font-family: inherit;
      margin-top: 24px;
    }
    .mypage-form button[type="submit"]:hover { background: #02b151; }
    
    #msg { margin-top: 12px; margin-bottom: 0; font-weight: 600; text-align: center; min-height: 20px; }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div class="mypage-wrap">
      <h2 class="mypage-title">내 정보</h2>
      
      <form id="mypage-form" class="mypage-form">
        <div class="form-grid-2">
          <div class="form-group">
            <label>아이디 (변경 불가)</label>
            <input name="username" readonly>
          </div>
          
          <div class="form-group">
            <label>비밀번호</label>
            <input name="password" type="password" placeholder="변경 시 입력">
          </div>

          <div class="form-group">
            <label>이름</label>
            <input name="name" required>
          </div>

          <div class="form-group">
            <label>연락처</label>
            <input name="phone" type="tel" inputmode="numeric" required>
          </div>

          <div class="form-group">
            <label>이메일</label>
            <input name="email" type="email">
          </div>

          <div class="form-group">
            <label>우편번호</label>
            <input name="postcode">
          </div>

          <div class="form-group">
            <label>주소</label>
            <input name="address">
          </div>

          <div class="form-group">
            <label>상세주소</label>
            <input name="address_detail">
          </div>
        </div>
        
        <button type="submit">저장</button>
      </form>
      <p id="msg"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const form = document.getElementById('mypage-form');
    const msg = document.getElementById('msg');

    let member = JSON.parse(localStorage.getItem('member') || 'null');
    if (!member || !member.id) {
      alert('로그인이 필요합니다.');
      location.href = 'login.html';
    }

    async function loadFromServer() {
      const { data, error } = await db.from('members').select('*').eq('id', member.id).maybeSingle();
      if (error) { console.error(error); return; }
      if (!data) {
        alert('회원 정보를 찾을 수 없습니다. 다시 로그인해주세요.');
        localStorage.removeItem('member');
        location.href = 'login.html';
        return;
      }
      member = data;
      localStorage.setItem('member', JSON.stringify(data));

      form.username.value = data.username || '';
      form.name.value = data.name || '';
      form.phone.value = data.phone || '';
      form.email.value = data.email || '';
      form.postcode.value = data.postcode || '';
      form.address.value = data.address || '';
      form.address_detail.value = data.address_detail || '';
    }

    loadFromServer();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '저장 중...';
      msg.style.color = '#888';

      const updates = {
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        email: form.email.value.trim() || null,
        postcode: form.postcode.value.trim() || null,
        address: form.address.value.trim() || null,
        address_detail: form.address_detail.value.trim() || null,
      };

      if (form.password.value) updates.password = form.password.value;

      const { error } = await db.from('members').update(updates).eq('id', member.id);

      if (error) {
        msg.style.color = '#ef4444';
        msg.textContent = '❌ ' + error.message;
        return;
      }

      const updated = { ...member, ...updates };
      localStorage.setItem('member', JSON.stringify(updated));
      member = updated;

      form.password.value = '';
      msg.style.color = '#10b981';
      msg.textContent = '✅ 저장 완료!';
      
      setTimeout(() => msg.textContent = '', 2000);
    });
  </script>
</body>
</html>
