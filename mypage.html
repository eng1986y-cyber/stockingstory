<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내 정보 - 심플몰</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <style>
    /* ⭐ 전체 컨테이너 넓이 통일 및 여백 정리 */
    .mypage-wrap { 
      max-width: 640px; 
      margin: 40px auto; 
      padding: 0 16px; 
      box-sizing: border-box; 
    }
    
    /* ⭐ 타이틀 영역 (내 정보 + 주문내역 버튼) */
    .mypage-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    
    .mypage-title {
      font-size: 22px;
      font-weight: 700;
      color: #222;
      margin: 0;
    }
    body.dark .mypage-title { color: #fff; }

    /* ⭐ 주문내역 팝업 오픈 버튼 */
    .btn-order-history {
      padding: 8px 14px;
      background: #1976d2;
      color: #fff;
      border: 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    body.dark .btn-order-history { background: #3b82f6; }
    .btn-order-history:hover { opacity: 0.9; }
    
    /* ⭐ 폼 바깥 껍데기 (카드 디자인) */
    .mypage-form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin-bottom: 32px;
      box-sizing: border-box;
      width: 100%;
      display: block;
    }
    body.dark .mypage-form {
      background: #151515;
      border: 1px solid #222;
      border-radius: 12px;
    }

    /* ⭐ 내부 2열 그리드 */
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 12px;
    }
    @media (max-width: 768px) {
      .form-grid-2 {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mypage-form label {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }
    body.dark .mypage-form label { color: #999; }
    
    .mypage-form input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
      width: 100%;
    }
    body.dark .mypage-form input {
      background: #0f0f0f;
      border-color: #2a2a2a;
      color: #e5e7eb;
    }
    body.dark .mypage-form input::placeholder { color: #555; }
    .mypage-form input[readonly] {
      background: #f5f5f5;
      color: #888;
    }
    body.dark .mypage-form input[readonly] {
      background: #1a1a1a;
      color: #666;
    }
    body.dark .mypage-form input:focus {
      outline: none;
      border-color: #555;
      box-shadow: 0 0 0 3px rgba(255,255,255,.05);
    }

    /* ⭐ 저장 버튼 */
    .mypage-form button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: #03c75a;
      color: #fff;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      font-family: inherit;
      margin-top: 24px;
    }
    .mypage-form button[type="submit"]:hover { background: #02b151; }
    
    #msg { margin-top: -16px; margin-bottom: 24px; font-weight: 600; text-align: center; }

    /* ⭐⭐⭐ 주문 내역 팝업(모달) 스타일 ⭐⭐⭐ */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 10px;
      backdrop-filter: blur(2px);
    }
    .modal-box {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      box-sizing: border-box;
      position: relative;
    }
    body.dark .modal-box {
      background: #151515;
      border: 1px solid #222;
      color: #e5e7eb;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }
    body.dark .modal-header { border-bottom-color: #222; }
    .modal-header h2 {
      margin: 0;
      font-size: 20px;
      color: #222;
    }
    body.dark .modal-header h2 { color: #fff; }
    .modal-close-btn {
      background: none; border: 0; cursor: pointer;
      font-size: 24px; color: #888; padding: 0; line-height: 1;
    }
    .modal-close-btn:hover { color: #222; }
    body.dark .modal-close-btn:hover { color: #fff; }

    /* 주문 내역 카드 리스트 */
    .order-history-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }
    .history-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.6;
      color: #222;
      box-sizing: border-box;
      width: 100%;
    }
    body.dark .history-card { background: #0f0f0f; border-color: #2a2a2a; color: #e5e7eb; }
    
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
    body.dark .history-header { border-bottom-color: #222; }
    .history-date { font-size: 13px; color: #888; }
    .history-status { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 4px; color: #fff; }
    .history-order-num { font-weight: 700; color: #1976d2; font-size: 15px; margin-bottom: 12px; display: block; }
    body.dark .history-order-num { color: #60a5fa; }

    .history-product-item { padding: 10px 0; border-bottom: 1px dashed #eee; }
    body.dark .history-product-item { border-bottom-color: #222; }
    .history-product-item:last-child { border-bottom: none; }
    .history-item-main { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 14px; }
    .history-item-main .name { font-weight: 600; }
    .history-item-main .qty { color: #888; margin-left: 4px; font-weight: normal; font-size: 13px; }
    .history-item-detail { font-size: 13px; color: #6b7280; line-height: 1.5; }
    body.dark .history-item-detail { color: #9ca3af; }

    .history-info-box { margin-top: 16px; background: #fff; padding: 12px; border-radius: 6px; font-size: 13px; color: #4b5563; line-height: 1.6; border: 1px solid #e5e7eb; }
    body.dark .history-info-box { background: #151515; border-color: #2a2a2a; color: #9ca3af; }
    
    /* ⭐ 결제 금액 상세 */
    .history-price-summary { margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee; font-size: 14px; color: #4b5563; }
    body.dark .history-price-summary { border-top-color: #222; color: #9ca3af; }
    .history-price-summary .price-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .history-price-summary .price-row.total { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd; font-weight: 700; font-size: 16px; color: #e53935; }
    body.dark .history-price-summary .price-row.total { border-top-color: #333; color: #ef4444; }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main>
    <div class="mypage-wrap">
      
      <!-- ⭐ 타이틀 + 주문내역 버튼 -->
      <div class="mypage-header-row">
        <h2 class="mypage-title">내 정보</h2>
        <button type="button" id="open-history-btn" class="btn-order-history">
          🧾 내 주문내역
        </button>
      </div>

      <form id="mypage-form" class="mypage-form">
        <div class="form-grid-2">
          <div class="form-group">
            <label>아이디 (변경 불가)</label>
            <input name="username" readonly>
          </div>
          
          <div class="form-group">
            <label>비밀번호</label>
            <input name="password" type="password" placeholder="변경 시 입력">
          </div>

          <div class="form-group">
            <label>이름</label>
            <input name="name" required>
          </div>

          <div class="form-group">
            <label>연락처</label>
            <input name="phone" type="tel" inputmode="numeric" required>
          </div>

          <div class="form-group">
            <label>이메일</label>
            <input name="email" type="email">
          </div>

          <div class="form-group">
            <label>우편번호</label>
            <input name="postcode">
          </div>

          <div class="form-group">
            <label>주소</label>
            <input name="address">
          </div>

          <div class="form-group">
            <label>상세주소</label>
            <input name="address_detail">
          </div>
        </div>
        
        <button type="submit">저장</button>
      </form>
      <p id="msg"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const db = supabase.createClient(
      "https://alpdhgcipjeekzrpxlbh.supabase.co",
      "sb_publishable_OVbjUaCErU6bscQ3XSLDgA_p7MtTWya"
    );
  </script>

  <script>
    const form = document.getElementById('mypage-form');
    const msg = document.getElementById('msg');
    const openHistoryBtn = document.getElementById('open-history-btn');

    let member = JSON.parse(localStorage.getItem('member') || 'null');
    if (!member || !member.id) {
      alert('로그인이 필요합니다.');
      location.href = 'login.html';
    }

    function statusColor(s) {
      return { '입금대기':'#f59e0b', '입금완료':'#059669', '배송중':'#1976d2', '완료':'#6b7280', '취소':'#dc2626' }[s] || '#9ca3af';
    }

    async function loadFromServer() {
      const { data, error } = await db.from('members').select('*').eq('id', member.id).maybeSingle();
      if (error) { console.error(error); return; }
      if (!data) {
        alert('회원 정보를 찾을 수 없습니다. 다시 로그인해주세요.');
        localStorage.removeItem('member');
        location.href = 'login.html';
        return;
      }
      member = data;
      localStorage.setItem('member', JSON.stringify(data));

      form.username.value = data.username || '';
      form.name.value = data.name || '';
      form.phone.value = data.phone || '';
      form.email.value = data.email || '';
      form.postcode.value = data.postcode || '';
      form.address.value = data.address || '';
      form.address_detail.value = data.address_detail || '';
    }

    loadFromServer();

    /* ⭐ 주문 내역 불러오기 및 팝업 렌더링 */
    async function showOrderHistoryModal() {
      // 1. 모달 열기 전 로딩 화면 띄우기
      const modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.innerHTML = `
        <div class="modal-box">
          <div class="modal-header">
            <h2>내 주문내역</h2>
            <button type="button" class="modal-close-btn" onclick="this.closest('.modal-backdrop').remove()">×</button>
          </div>
          <div id="modal-order-content" style="text-align:center; padding:40px 0; color:#888;">
            주문 내역을 불러오는 중입니다...
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      
      // 모달 바깥(배경) 클릭 시 닫기
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.remove();
      });

      const contentEl = modal.querySelector('#modal-order-content');

      // 2. DB에서 내 주문 내역 가져오기
      const { data, error } = await db.from('orders')
        .select('*')
        .or(`and(customer_name.eq.${member.name},customer_phone.eq.${member.phone}),and(customer_name.eq.${member.name},depositor_name.eq.${member.name})`)
        .order('created_at', { ascending: false });

      let orders = [];
      if (error) {
        const fallbackRes = await db.from('orders').select('*').eq('customer_name', member.name).order('created_at', { ascending: false });
        orders = fallbackRes.data;
      } else {
        orders = data;
      }

      if (!orders || orders.length === 0) {
        contentEl.innerHTML = '<p style="color:#888; font-size:14px;">주문 내역이 없습니다.</p>';
        return;
      }

      // 3. 주문번호 기준으로 그룹화
      const groups = {};
      orders.forEach(o => {
        const key = o.order_number || `single_${o.id}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(o);
      });

      // 4. HTML 렌더링
      contentEl.innerHTML = `<div class="order-history-list">` + Object.entries(groups).map(([key, items]) => {
        const first = items[0];
        const dateStr = new Date(first.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
        const displayNum = first.order_number || `(번호 없음)`;
        const fullAddress = `${first.postcode ? `[${first.postcode}] ` : ''}${first.address || ''} ${first.address_detail || ''}`.trim();

        // ⭐ 상품금액과 배송비 분리
        let productTotal = 0;
        let shippingTotal = 0;
        items.forEach(o => {
          const rowTotal = Number(o.total_price || 0);
          const rowShip = Number(o.shipping_fee || 0);
          productTotal += (rowTotal - rowShip);
          shippingTotal += rowShip;
        });
        const totalAll = productTotal + shippingTotal;

        return `
          <div class="history-card">
            <div class="history-header">
              <span class="history-date">${dateStr}</span>
              <span class="history-status" style="background:${statusColor(first.status)};">${first.status || '-'}</span>
            </div>
            <span class="history-order-num">${displayNum}</span>
            
            <div>
              ${items.map(o => {
                const opts = [];
                if (o.selected_color) opts.push(`색상: ${o.selected_color}`);
                if (o.selected_size) opts.push(`사이즈: ${o.selected_size}`);
                if (o.selected_hem) opts.push(`밑단: ${o.selected_hem}`);
                if (o.selected_other) opts.push(`기타: ${o.selected_other}`);
                const optStr = opts.length ? opts.join(' | ') : '기본 옵션';
                const itemPrice = Number(o.total_price) - Number(o.shipping_fee || 0);

                return `
                  <div class="history-product-item">
                    <div class="history-item-main">
                      <span class="name">${o.product_name} <span class="qty">x ${o.quantity}</span></span>
                      <span>${itemPrice.toLocaleString()}원</span>
                    </div>
                    <div class="history-item-detail">${optStr}</div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="history-info-box">
              <div>📍 <b>배송지:</b> ${fullAddress || '주소 정보 없음'}</div>
              ${first.memo ? `<div style="margin-top:4px;">📝 <b>요청사항:</b> ${first.memo}</div>` : ''}
              ${(first.courier || first.tracking_number) ? `
                <div style="margin-top:8px; padding-top:8px; border-top:1px dashed #ddd; color:#1976d2;">
                  🚚 <b>배송정보:</b> ${first.courier || '택배사 미정'} | ${first.tracking_number || '운송장 없음'}
                </div>
              ` : ''}
            </div>

            <div class="history-price-summary">
              <div class="price-row">
                <span>상품 금액</span>
                <span>${productTotal.toLocaleString()}원</span>
              </div>
              <div class="price-row">
                <span>배송비</span>
                <span>${shippingTotal > 0 ? shippingTotal.toLocaleString() + '원' : '무료'}</span>
              </div>
              <div class="price-row total">
                <span>총 결제금액</span>
                <span>${totalAll.toLocaleString()}원</span>
              </div>
            </div>
          </div>
        `;
      }).join('') + `</div>`;
    }

    // 버튼 클릭 시 팝업 열기
    openHistoryBtn.addEventListener('click', showOrderHistoryModal);

    // 폼 저장 로직
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '저장 중...';
      msg.style.color = '#888';

      const updates = {
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        email: form.email.value.trim() || null,
        postcode: form.postcode.value.trim() || null,
        address: form.address.value.trim() || null,
        address_detail: form.address_detail.value.trim() || null,
      };

      if (form.password.value) updates.password = form.password.value;

      const { error } = await db.from('members').update(updates).eq('id', member.id);

      if (error) {
        msg.style.color = '#ef4444';
        msg.textContent = '❌ ' + error.message;
        return;
      }

      const updated = { ...member, ...updates };
      localStorage.setItem('member', JSON.stringify(updated));
      member = updated;

      form.password.value = '';
      msg.style.color = '#10b981';
      msg.textContent = '✅ 저장 완료!';
      
      setTimeout(() => msg.textContent = '', 2000);
    });
  </script>
</body>
</html>
